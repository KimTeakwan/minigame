<title>붕붕 꿀벌 동굴 레이스</title>
<style>
  /* 창을 꽉 채우고 스크롤·선택·길게 누르기 메뉴를 막아요 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1530; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;

<button id="mute" aria-label="소리 끄기">🔊</button>
<script>
/* ===== 게임 SDK: 리더보드 + 멀티 (public/sdk.js와 같은 코드. 지우지 마세요) ===== */
/* 멀티 게임 쓰는 법은 games/README.md의 "멀티 게임"을 보세요 */
(function () {
  var sent = false;
  var standalone = window.parent === window; // 파일을 직접 열었을 때
  var listeners = { message: [], players: [], emote: [], error: [] };
  var room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
  var waiting = [];

  function post(msg) {
    if (!standalone) window.parent.postMessage(msg, "*");
  }
  function emit(name, a, b) {
    var list = listeners[name] || [];
    for (var i = 0; i < list.length; i++) {
      try { list[i](a, b); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }
  function settle(ok, value) {
    var list = waiting;
    waiting = [];
    for (var i = 0; i < list.length; i++) {
      clearTimeout(list[i].timer);
      ok ? list[i].resolve(value) : list[i].reject(new Error(value));
    }
  }

  window.addEventListener("message", function (event) {
    if (standalone || event.source !== window.parent) return; // 바깥 플레이 페이지에서 온 것만
    var m = event.data;
    if (!m || typeof m !== "object") return;
    if (m.type === "GAMESDK_MP_JOINED") {
      room = { joined: true, roomId: m.roomId, me: m.me, players: m.players || [], hostId: m.hostId, maxPlayers: m.maxPlayers };
      settle(true, { roomId: room.roomId, me: room.me, players: room.players, hostId: room.hostId, maxPlayers: room.maxPlayers });
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_PLAYERS") {
      room.players = m.players || [];
      room.hostId = m.hostId;
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_MESSAGE") {
      emit("message", m.data, m.from);
    } else if (m.type === "GAMESDK_MP_EMOTE") {
      emit("emote", m.key, m.from);
    } else if (m.type === "GAMESDK_MP_ERROR") {
      if (!room.joined) settle(false, m.message);
      emit("error", m.message);
    }
  });

  window.GameSDK = {
    submitScore: function (score) {
      if (sent) return; // 한 판에 한 번만
      if (typeof score !== "number" || !isFinite(score)) return;
      sent = true;
      post({ type: "GAMESDK_SCORE", score: score });
    },
    // 새 판을 시작할 때 부르면 다시 점수를 보낼 수 있어요.
    newRound: function () {
      sent = false;
      post({ type: "GAMESDK_NEW_ROUND" });
    },
    multi: {
      join: function () {
        return new Promise(function (resolve, reject) {
          if (standalone) return reject(new Error("사이트 밖에서는 멀티를 쓸 수 없어요"));
          var w = { resolve: resolve, reject: reject, timer: 0 };
          w.timer = setTimeout(function () {
            waiting = waiting.filter(function (x) { return x !== w; });
            reject(new Error("방에 들어가지 못했어요 (응답 없음)"));
          }, 8000);
          waiting.push(w);
          post({ type: "GAMESDK_MP_JOIN" });
        });
      },
      send: function (data) { if (room.joined) post({ type: "GAMESDK_MP_SEND", data: data }); },
      emote: function (key) { if (room.joined) post({ type: "GAMESDK_MP_EMOTE", key: key }); },
      lock: function (locked) { if (room.joined) post({ type: "GAMESDK_MP_LOCK", locked: locked !== false }); },
      leave: function () {
        if (!room.joined) return;
        room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
        post({ type: "GAMESDK_MP_LEAVE" });
      },
      on: function (name, fn) { if (listeners[name] && typeof fn === "function") listeners[name].push(fn); },
      me: function () { return room.me; },
      players: function () { return room.players.slice(); },
      hostId: function () { return room.hostId; },
      isHost: function () { return !!room.me && room.me.id === room.hostId; },
    },
  };
})();

/* =====================================================================
   붕붕 꿀벌 동굴 레이스 — 꾹 누르면 떠오르고 떼면 내려가는 원버튼 비행 (최대 4명)
   멀티 구조
   - 방장(먼저 들어온 사람)이 판 번호·시드·참가자 명단·단계 전환·컴퓨터 꿀벌을 맡고 상태("s")를 보내요.
   - 동굴은 시드로 만들어서 모두에게 똑같아요 (200단위 구간마다 난수 7개를 늘 같은 순서로 써요).
   - 각자 자기 꿀벌만 자기 화면에서 계산하고 위치("p")를 보내요. 거리는 "출발 뒤 지난 시간"으로 정해져요.
   - 혼자거나 멀티 연결이 안 되면 내가 방장이고 컴퓨터 꿀벌과 날아요.
   ===================================================================== */
const BAND = 600, BEE_X = 100, VIEW_AHEAD = 420;
const EXIT_X = 75000, UNIT_PER_M = 50;
const EXIT_T_MS = (50 + (EXIT_X - 19000) / 480) * 1000;
const COUNT_MS = 3000, RESULT_MS = 6000, TIMEOUT_MS = 3000, RESULT_CARD_DELAY = 900;
const ME_COLOR = "#ffc93c", OTHER_COLORS = ["#ff8fb8", "#6fe0c0", "#8fb8ff", "#c9a0ff"];
const BOT_NAMES = ["컴퓨터 하나", "컴퓨터 둘", "컴퓨터 셋"];
const EMOTE_ICONS = { hi: "👋", gg: "🤝", again: "🔁", wow: "😮", oops: "😅", thanks: "🙏" };
const FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
const TAU = Math.PI * 2;
const now = () => performance.now();

// ---- 동굴·물리 (시작) ----
const SEG = 200, NSEG = 400, NR = 7;
const BEE_R = 22, HIT_R = 15, HONEY_HIT = 29;
const UP_ACC = 1400, DOWN_ACC = 1200, VMAX = 420, HOVER_T = 1.5;
const STEP = 1 / 60;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 통로 높이: 거리(m)별 선형 보간
const GAP_M = [0, 60, 200, 480, 1050, 1500], GAP_V = [420, 380, 270, 200, 165, 130];
function gapAt(x) {
  const m = x / UNIT_PER_M;
  if (m <= 0) return GAP_V[0];
  for (let i = 1; i < GAP_M.length; i++) {
    if (m <= GAP_M[i]) return GAP_V[i - 1] + (GAP_V[i] - GAP_V[i - 1]) * (m - GAP_M[i - 1]) / (GAP_M[i] - GAP_M[i - 1]);
  }
  return GAP_V[GAP_V.length - 1];
}
// 속도: 280에서 1초마다 +4, 50초 뒤 480에서 멈춰요. 거리는 시간만으로 정해져요.
function distAt(t) { return t <= 0 ? 0 : t <= 50 ? 280 * t + 2 * t * t : 19000 + 480 * (t - 50); }
function speedAtDist(x) { return x >= 19000 ? 480 : Math.sqrt(78400 + 8 * Math.max(0, x)); }

const cC = new Float32Array(NSEG + 2);   // 제어점 중심 높이
const obT = new Uint8Array(NSEG + 2);    // 0 없음, 1 종유석(위), 2 석순(아래), 3 떠 있는 바위
const obA = new Float32Array(NSEG + 2);  // 종유석·석순: 튀어나온 길이 / 바위: 윗변 y
const obB = new Float32Array(NSEG + 2);  // 종유석·석순: 반폭 / 바위: 높이
const hnY = new Float32Array(NSEG + 2);  // 꿀방울 y (x = 200k + 100), 없으면 -1
const RN = new Float32Array((NSEG + 2) * NR);
let caveSeed = -1;

function centerAt(x) {
  if (x <= 0) return cC[0];
  let k = Math.floor(x / SEG);
  if (k >= NSEG) return cC[NSEG];
  const f = (x - k * SEG) / SEG, s = f * f * (3 - 2 * f);
  return cC[k] + (cC[k + 1] - cC[k]) * s;
}
function ceilAt(x) { return centerAt(x) - gapAt(x) / 2; }
function floorAt(x) { return centerAt(x) + gapAt(x) / 2; }

function buildCave(seed) {
  if (seed === caveSeed) return;
  caveSeed = seed;
  const rnd = mulberry32(seed);
  for (let i = 0; i < RN.length; i++) RN[i] = rnd(); // 구간마다 7개씩 (중심, 장애물 여부, 종류, 크기, 바위 위치, 꿀 여부, 꿀 높이)
  // 1) 중심선: 기울기 ≤ (최대 세로 속도 420 ÷ 그때 속도) × 0.55 (smoothstep 최대 기울기 = 1.5 × 변화량 / 200)
  let c = 300;
  for (let k = 0; k <= NSEG + 1; k++) {
    const x = k * SEG, m = x / UNIT_PER_M, g = gapAt(x);
    if (k >= 3) {
      let amp = m < 60 ? 40 : m < 200 ? 40 + (m - 60) / 140 * 60 : 100;
      amp = Math.min(amp, (VMAX / speedAtDist(x)) * 0.55 * SEG / 1.5);
      c = clamp(c + (RN[k * NR] * 2 - 1) * amp, g / 2 + 30, BAND - 30 - g / 2);
    }
    cC[k] = c;
  }
  // 2) 장애물과 꿀
  let prev = false;
  for (let k = 0; k <= NSEG + 1; k++) {
    const x = k * SEG, m = x / UNIT_PER_M, r = k * NR;
    obT[k] = 0; obA[k] = 0; obB[k] = 0; hnY[k] = -1;
    // 이웃 구간에 연속으로 두지 않아요. 100m 표지판 자리(k % 25 == 0)와 출구 근처도 비워요.
    const p = m < 60 ? 0 : m < 200 ? 0.1 + (m - 60) / 140 * 0.18 : m < 480 ? 0.28 + (m - 200) / 280 * 0.39 : 0.67;
    if (!prev && RN[r + 1] < p && k % 25 !== 0 && x <= EXIT_X - 600) {
      const g = gapAt(x), r3 = RN[r + 2];
      let type = m >= 300 && r3 < 0.3 ? 3 : (m >= 300 ? (r3 - 0.3) / 0.7 : r3) < 0.5 ? 1 : 2;
      if (type === 3) {
        // 떠 있는 바위: 가로 50 × 통로의 28%. 넓은 쪽 통로가 120 이상 남게 둬요.
        const hR = Math.min(0.28 * g, g - 132);
        if (hR < 24) type = r3 < 0.15 ? 1 : 2;
        else {
          const free = g - hR, small = 12 + RN[r + 3] * Math.max(0, free - 132);
          const top = cC[k] - g / 2, bot = cC[k] + g / 2;
          obA[k] = RN[r + 4] < 0.5 ? top + small : bot - small - hR;
          obB[k] = hR;
        }
      }
      if (type === 1 || type === 2) {
        // 남는 통로가 120 이상 (기획 115에 여유 5)
        const intr = (g - 120) * (0.45 + 0.55 * RN[r + 3]);
        if (intr < 12) type = 0;
        else { obA[k] = intr; obB[k] = clamp(intr * 0.42, 22, 48); }
      }
      obT[k] = type;
      prev = type !== 0;
    } else prev = false;
    // 꿀: 처음엔 통로 한가운데, 200m부터 점점 벽 가까이
    if (k >= 2 && RN[r + 5] < 0.42 && x + 100 < EXIT_X - 300) {
      const hx = x + 100, gh = gapAt(hx), ch = centerAt(hx);
      const spread = m < 60 ? 0 : m < 200 ? (m - 60) / 140 * 0.6 : Math.min(0.95, 0.6 + (m - 200) / 280 * 0.35);
      hnY[k] = ch + spread * (RN[r + 6] * 2 - 1) * (gh / 2 - 26);
    }
  }
}

function segDist2(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, l = vx * vx + vy * vy;
  let t = l > 0 ? ((px - ax) * vx + (py - ay) * vy) / l : 0;
  t = clamp(t, 0, 1);
  const dx = px - (ax + vx * t), dy = py - (ay + vy * t);
  return dx * dx + dy * dy;
}
function inTri(px, py, ax, ay, bx, by, cx, cy) {
  const d1 = (px - bx) * (ay - by) - (ax - bx) * (py - by);
  const d2 = (px - cx) * (by - cy) - (bx - cx) * (py - cy);
  const d3 = (px - ax) * (cy - ay) - (cx - ax) * (py - ay);
  const neg = d1 < 0 || d2 < 0 || d3 < 0, pos = d1 > 0 || d2 > 0 || d3 > 0;
  return !(neg && pos);
}
// 종유석·석순 모양: 그림과 판정이 같이 써요 (판정 삼각형은 늘 그림 안에 있어요)
// SG = [왼쪽 벽 x, y, 왼쪽 어깨 x, y, 끝 x, y(조절점), 오른쪽 어깨 x, y, 오른쪽 벽 x, y, 판정 끝 x, y]
const SPIKE_SHOULDER = 0.94;
const SG = new Float32Array(12);
function spikeGeom(k) {
  const x0 = k * SEG, hw = obB[k], up = obT[k] === 1, toRock = up ? -1 : 1;
  const lx = x0 - hw, rx = x0 + hw;
  const ly = up ? ceilAt(lx) : floorAt(lx), ry = up ? ceilAt(rx) : floorAt(rx);
  const ty = up ? ceilAt(x0) + obA[k] : floorAt(x0) - obA[k];
  const f = SPIKE_SHOULDER;
  const ax = lx + (x0 - lx) * f, ay = ly + (ty - ly) * f, bx = rx + (x0 - rx) * f, by = ry + (ty - ry) * f;
  SG[0] = lx; SG[1] = ly; SG[2] = ax; SG[3] = ay; SG[4] = x0; SG[5] = ty; SG[6] = bx; SG[7] = by; SG[8] = rx; SG[9] = ry;
  // 둥근 끝 곡선(어깨 → 조절점 (x0, ty) → 어깨)의 가운데 점에서 바위 쪽으로 1단위 = 판정 끝
  SG[10] = 0.25 * ax + 0.5 * x0 + 0.25 * bx;
  SG[11] = 0.25 * ay + 0.5 * ty + 0.25 * by + toRock;
}
const ROCK_W = 50, ROCK_R = 10;
// 판정 원(반지름 15)이 벽·장애물에 닿았는지. 그림(반지름 22)보다 작아서 너그러워요.
function hitCave(d, y) {
  for (let i = -1; i <= 1; i++) {
    const x = d + i * 11, r = i === 0 ? HIT_R : 10.2;
    const c = centerAt(x), h = gapAt(x) / 2;
    if (y - r < c - h || y + r > c + h) return true;
  }
  const k = Math.round(d / SEG);
  if (k < 0 || k > NSEG || !obT[k]) return false;
  const x0 = k * SEG;
  if (obT[k] === 3) {
    // 떠 있는 바위: 그림(둥근 사각형, 모서리 반지름 10)을 2단위 줄인 둥근 사각형
    const rr = Math.min(ROCK_R, obB[k] / 2), ir = rr - 2;
    const cx = clamp(d, x0 - ROCK_W / 2 + rr, x0 + ROCK_W / 2 - rr), cy = clamp(y, obA[k] + rr, obA[k] + obB[k] - rr);
    const lim = HIT_R + ir;
    return (d - cx) * (d - cx) + (y - cy) * (y - cy) < lim * lim;
  }
  if (Math.abs(d - x0) > obB[k] + HIT_R) return false;
  spikeGeom(k);
  const lx = SG[0], ly = SG[1], rx = SG[8], ry = SG[9], tx = SG[10], ty = SG[11];
  if (inTri(d, y, lx, ly, tx, ty, rx, ry)) return true;
  return segDist2(d, y, lx, ly, tx, ty) < HIT_R * HIT_R || segDist2(d, y, tx, ty, rx, ry) < HIT_R * HIT_R;
}
function scoreOf(b) { return Math.floor(b.d / UNIT_PER_M) + b.honey * 5 + (b.exit ? 100 : 0); }

// 꿀벌 하나를 1/60초 진행해요. t는 출발 뒤 지난 시간(초)이에요.
function stepBee(b, t) {
  if (b.press) b.everPressed = true;
  if (!b.everPressed && t < HOVER_T) {
    // 출발 직후 첫 입력 전까지(최대 1.5초) 제자리에서 둥실둥실
    const ny = b.y0 + Math.sin(t * 6) * 4;
    b.vy = (ny - b.y) / STEP; b.y = ny;
  } else {
    b.vy += (b.press ? -UP_ACC : DOWN_ACC) * STEP;
    b.vy = clamp(b.vy, -VMAX, VMAX);
    b.y += b.vy * STEP;
  }
  const d = distAt(t);
  if (d >= EXIT_X) {
    b.d = EXIT_X; b.alive = false; b.exit = true; b.score = scoreOf(b);
    beeEvent(b, "exit", 0);
    return;
  }
  b.d = d;
  const k = Math.round((d - 100) / SEG);
  if (k >= 0 && k <= NSEG && hnY[k] >= 0 && !b.taken[k]) {
    const dx = d - (k * SEG + 100), dy = b.y - hnY[k];
    if (dx * dx + dy * dy < HONEY_HIT * HONEY_HIT) { b.taken[k] = 1; b.honey++; beeEvent(b, "honey", k); }
  }
  b.score = scoreOf(b);
  if (hitCave(d, b.y)) { b.alive = false; beeEvent(b, "crash", 0); }
}

// 컴퓨터 꿀벌: 0.1초마다 판단. 앞 140단위의 통로 중심(장애물이 있으면 넓은 쪽)을 따라가요.
function initBotAI(b, t) {
  b.thinkT = t; b.wobbleT = t; b.wobble = 0;
  const r = Math.random();
  b.mistakeAt = t + (b.skill < 0.6 ? 20 + r * 50 : b.skill > 0.7 ? 45 + r * 85 : 30 + r * 60);
  b.mistakeMode = Math.random() < 0.5;
}
function botThink(b, t) {
  if (t < b.thinkT) return;
  b.thinkT = t + 0.1;
  const d = b.d;
  let target = centerAt(d + 140);
  const kA = Math.ceil((d - 30) / SEG);
  for (let k = Math.max(0, kA); k <= kA + 2 && k <= NSEG; k++) {
    const x0 = k * SEG;
    if (x0 - d > 300) break;
    if (!obT[k]) continue;
    const g = gapAt(x0), top = cC[k] - g / 2, bot = cC[k] + g / 2;
    if (obT[k] === 1) target = (top + obA[k] + bot) / 2;
    else if (obT[k] === 2) target = (top + bot - obA[k]) / 2;
    else { const rt = obA[k], rb = rt + obB[k]; target = rt - top > bot - rb ? (top + rt) / 2 : (rb + bot) / 2; }
    break;
  }
  if (t >= b.wobbleT) { b.wobbleT = t + 0.5; b.wobble = (Math.random() * 2 - 1) * (1 - b.skill) * gapAt(d) * 0.25; }
  target += b.wobble;
  let press = (b.y - target) + b.vy * 0.25 > 0; // 아래에 있거나 빠르게 떨어지는 중이면 눌러요
  if (t >= b.mistakeAt) {
    if (t < b.mistakeAt + 0.5) press = b.mistakeMode; // 실수: 0.5초 동안 잘못 누르거나 떼요
    else { b.mistakeAt = t + 10 + Math.random() * 15; b.mistakeMode = Math.random() < 0.5; }
  }
  b.press = press;
}
// ---- 동굴·물리 (끝) ----

/* ===== 화면 ===== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

  const n = clamp(m.n | 0, 0, 1e9);
  const ph = PH_ORDER[m.ph] ? m.ph : "lobby";
  if (n === G.n && PH_ORDER[ph] < PH_ORDER[G.phase]) return; // 내가 먼저 넘어간 단계 (예: 출발)
  const newRound = n !== G.n, prev = G.phase;
  G.n = n;
  if (ph !== "lobby") {
    const sd = (+m.seed) >>> 0;
    if (sd !== G.seed) { G.seed = sd; buildCave(sd); }
  }
  // 시계 맞추기: 그 판의 첫 상태에서 한 번, 그 뒤로는 500ms 넘게 어긋날 때만 고쳐요
  if (ph === "count" || ph === "play") {
    const st = ph === "count" ? t + clamp(+m.tl || 0, 0, COUNT_MS + 500) : t - clamp(+m.el || 0, 0, EXIT_T_MS + 20000);
    if (G.clockN !== n || Math.abs(st - G.startAt) > 500) { G.startAt = st; G.clockN = n; }
  } else G.phaseEnd = t + clamp(+m.tl || 0, 0, 20000);
  if (Array.isArray(m.r)) syncRoster(m.r, newRound);
  G.phase = ph;
  const hb = beeById(hostId);
  if (hb && Array.isArray(m.h)) netBee(hb, m.h, t, ph);
  if (Array.isArray(m.b)) {
    let j = 0;
    for (const b of G.roster) if (b.bot) { const e = m.b[j++]; if (Array.isArray(e)) netBee(b, e, t, ph); }
  }
  if (Array.isArray(m.f)) {
    for (let i = 0; i < G.roster.length; i++) {
      const b = G.roster[i], e = m.f[i];
      if (b.isMe || !Array.isArray(e)) continue;
      b.fD = clamp(+e[0] || 0, 0, EXIT_X); b.fSc = clamp(e[1] | 0, 0, 99999); b.fE = e[2] ? 1 : 0; b.hasFinal = true;
    }
  }
  if (newRound && (ph === "play" || ph === "result")) enterPhase("count"); // 카운트다운을 놓쳤어도 판 준비는 해요
  if (newRound || prev !== ph) enterPhase(ph);
}
function netBee(b, e, t, ph) {
  if (b.isMe) return;
  b.nD = clamp(+e[0] || 0, 0, EXIT_X); b.nY = clamp(+e[1] || 0, 0, BAND); b.nSc = clamp(e[3] | 0, 0, 99999); b.nAt = t;
  if (!b.alive) return;
  b.d = b.nD; b.score = b.nSc; netHoney(b);
  if (!e[2] && (ph === "play" || ph === "result")) {

    if (ph === "play") beeEvent(b, b.exit ? "exit" : "crash", 0);

  }
}
function syncRoster(r, newRound) {
  const len = Math.min(4, r.length);
  let same = !newRound && len === G.roster.length;
  for (let i = 0; same && i < len; i++) if (!Array.isArray(r[i]) || String(r[i][0]).slice(0, 64) !== G.roster[i].id) same = false;
  if (!same) {
    const list = [];
    for (let i = 0; i < len; i++) {
      const e = r[i];
      if (!Array.isArray(e)) continue;
      const id = String(e[0]).slice(0, 64);
      const old = newRound ? null : beeById(id);
      list.push(old || makeBee(id, !!e[1], list.length));
    }
    setRoster(list);
  }
  for (let i = 0; i < G.roster.length; i++) {
    const e = r[i], b = G.roster[i];
    if (Array.isArray(e) && e[1] && !b.bot && !b.isMe) { b.bot = true; b.name = botName(b.id); }
  }
}

/* ----- 모두: 단계가 바뀔 때 ----- */
function enterPhase(ph) {
  const t = now();
  if (ph === "count") {
    simT = 0; camD = 0; camOff = 0; camKey = "start"; countNum = 0; rankPrev = -1; shakeT = 0;
    for (const p of parts) p.on = false;
    for (const p of pops) p.on = false;
    for (const nn of notes) nn.until = 0;
    if (G.me) { GameSDK.newRound(); submitted = false; } // 구경만 하는 판은 점수를 보내지 않아요
  } else if (ph === "play") {
    goAt = t; sfx.go();
  } else if (ph === "result") {
    G.resultAt = t;
    for (const b of G.roster) {
      if (!b.hasFinal || b.isMe) { b.fD = b.d; b.fSc = b.score; b.fE = b.exit ? 1 : 0; b.hasFinal = true; }
      b.flying = b.alive;
    }
    const me = G.me;
    if (me && !submitted) { submitted = true; GameSDK.submitScore(me.score); best = Math.max(best, me.score); }
    updateRanking();
    if (me && rankArr[0] === me) sfx.win();
  } else if (ph === "lobby") {
    G.lobbySince = t;
  }
}

/* ----- 꿀벌에게 일어난 일 (꿀, 쿵, 완주) ----- */
function beeEvent(b, kind, k) {
  const t = now();
  if (kind === "honey") {
    if (b.isMe) {
      sfx.honey();
      const hx = k * SEG + 100, hy = hnY[k];
      for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; spawn(1, hx, hy, Math.cos(a) * 140 + speedNow() * 0.6, Math.sin(a) * 140, 0.5, 4, "#ffd75e"); }
      popup(b.d + 42, b.y + (b.y < 200 ? 24 : -26), "+5", "#ffd23f", 20, true);
    }
    return;
  }
  b.deadAt = t; b.exitAt = t; b.deadD = b.d;
  b.fallY = localSim(b) ? b.y : b.dispY; b.fallVy = kind === "crash" ? -170 : 0;
  if (isHost()) G.dirty = true;
  if (b.isMe) {
    if (kind === "exit") {
      sfx.exit();
      for (let i = 0; i < 30; i++) spawn(3, b.d, b.y, (Math.random() * 2 - 1) * 260 + 300, -Math.random() * 380, 1.4, 5, OTHER_COLORS[i % 4]);
      popup(b.d + 20, 300, "완주! +100", "#ffd23f", 26);
    } else {
      sfx.crash(); shakeT = 0.3;
      for (let i = 0; i < 10; i++) { const a = Math.random() * TAU, v = 160 + Math.random() * 200; spawn(2, b.d, b.y, Math.cos(a) * v, Math.sin(a) * v - 120, 0.9, 7, "#ffe066"); }
      popup(b.d + 36, b.y + (b.y < 300 ? 48 : -48), "쿵!", "#ffffff", 26);
    }
    if (!submitted) { submitted = true; GameSDK.submitScore(b.score); } // 떨어지거나 출구에 닿는 순간 한 번
    best = Math.max(best, b.score);
    ignoreUntil = t + 1000; // 떨어진 뒤 1초 동안 입력 무시
    pNow = true;
  } else if (G.phase === "play") {
    notify(kind === "exit" ? `${b.name} 완주!` : `${b.name} 쿵!`);
    if (kind === "crash") {
      sfx.other();
      for (let i = 0; i < 5; i++) { const a = Math.random() * TAU; spawn(2, b.deadD, b.fallY, Math.cos(a) * 160, Math.sin(a) * 160 - 100, 0.7, 5, "#ffe066"); }
    }
  }
}

/* ===== 입력 (스페이스·↑·W·Enter·마우스 왼쪽·터치, 하나라도 누르고 있으면 올라가요) ===== */
const keysDown = new Set();
const pointers = new Set();
const PRESS_CODES = new Set(["Space", "ArrowUp", "KeyW", "Enter", "NumpadEnter"]);
window.addEventListener("keydown", (e) => {
  const code = e.code || e.key;
  const isPress = PRESS_CODES.has(code) || e.key === " " || e.key === "w" || e.key === "W";
  if (isPress || code.startsWith("Arrow")) e.preventDefault();
  if (!isPress) return;
  if (!e.repeat && !keysDown.has(code)) onTap();
  keysDown.add(code);
});
window.addEventListener("keyup", (e) => { keysDown.delete(e.code || e.key); });
canvas.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  pointers.add(e.pointerId);
  onTap();
});
window.addEventListener("pointerup", (e) => pointers.delete(e.pointerId));
window.addEventListener("pointercancel", (e) => pointers.delete(e.pointerId));
window.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("blur", () => { keysDown.clear(); pointers.clear(); });
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) return;
  keysDown.clear(); pointers.clear();
  // 탭이 뒤로 가면 그 자리에서 떨어진 것으로 처리해요
  const me = G.me;
  if (me && me.alive && G.phase === "play") { me.alive = false; beeEvent(me, "crash", 0); }
});
const pressed = () => keysDown.size > 0 || pointers.size > 0;

function onTap() {
  unlockAudio();
  const t = now();
  if (t < ignoreUntil) return;
  if (G.phase === "lobby") {
    if (isHost()) startCountdown();
    else if (t - lastGo > 500) { if (sendLimited({ t: "p", n: G.n, go: 1, d: 0, y: 0, a: 0, s: 0, e: 0 })) lastGo = t; }
  } else if (G.phase === "result" && humans.length < 2 && isHost() && t - G.resultAt > 1000) {
    startCountdown(); // 혼자 모드: 바로 다시 하기
  }
}

/* ===== 효과 (개수 제한, 미리 만들어 둔 것 재사용) ===== */
const PMAX = 150, parts = [];
for (let i = 0; i < PMAX; i++) parts.push({ on: false, kind: 0, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 3, color: "#fff", rot: 0 });
let pCursor = 0, windCount = 0, windAcc = 0;
function spawn(kind, x, y, vx, vy, life, size, color) {
  for (let n = 0; n < PMAX; n++) {
    const p = parts[pCursor];
    pCursor = (pCursor + 1) % PMAX;
    if (p.on) continue;
    p.on = true; p.kind = kind; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = life; p.size = size; p.color = color; p.rot = Math.random() * TAU;
    if (kind === 0) windCount++;
    return p;
  }

}
const pops = [];
for (let i = 0; i < 10; i++) pops.push({ on: false, x: 0, y: 0, text: "", life: 0, color: "#fff", size: 18, follow: false });
function popup(x, y, text, color, size, follow) {
  for (const p of pops) if (!p.on) { p.on = true; p.x = x; p.y = y; p.text = text; p.life = 0.9; p.color = color; p.size = size; p.follow = !!follow; return; }
}
const notes = [{ text: "", until: 0 }, { text: "", until: 0 }, { text: "", until: 0 }];
function notify(text) {
  let s = notes[0];
  for (const nn of notes) if (nn.until < s.until) s = nn;
  // 좁은 화면에서 처음 3초 안내가 떠 있으면 그 뒤에 1.5초 보여줘요
  const guideEnd = !NOTE_SIDE && G.me && (G.phase === "count" || G.phase === "play") ? G.startAt + 3000 : 0;
  s.text = text; s.until = Math.max(now(), guideEnd) + 1500;
}
function speedNow() { return G.phase === "play" ? speedAtDist(distAt(simT)) : 0; }

/* ===== 업데이트 ===== */
const rankArr = [];
let rankFinal = false, liveD = 0;
function rankCmp(a, b) {
  if (b.rk !== a.rk) return b.rk - a.rk;
  if (Math.abs(b.rkD - a.rkD) > 0.5) return b.rkD - a.rkD;
  const fa = rankFinal ? a.flying : a.alive, fb = rankFinal ? b.flying : b.alive; // 같으면 아직 날던 꿀벌이 앞
  if (fa !== fb) return fa ? -1 : 1;
  return a.idx - b.idx;
}
function updateRanking() {
  rankFinal = G.phase === "result";
  // 날고 있는 꿀벌은 모두 같은 거리(출발 뒤 지난 시간으로 정해져요)라서 네트워크 지연 없이 비교해요
  liveD = G.phase === "play" ? Math.min(EXIT_X, distAt(Math.max(0, (now() - G.startAt) / 1000))) : 0;
  rankArr.length = 0;
  for (const b of G.roster) {
    const live = !rankFinal && b.alive && G.phase === "play";
    b.rkD = rankFinal ? b.fD : live ? liveD : b.d;
    b.rk = rankFinal ? b.fSc : live ? Math.floor(liveD / UNIT_PER_M) + b.honey * 5 : b.score;
    rankArr.push(b);
  }
  rankArr.sort(rankCmp);
}
function netHoney(b) { b.honey = Math.max(0, Math.round((b.nSc - Math.floor(b.nD / UNIT_PER_M) - (b.nD >= EXIT_X ? 100 : 0)) / 5)); }

function simulate(t) {
  if (G.phase !== "play") return;
  const target = (t - G.startAt) / 1000;
  if (target - simT > 2) simT = Math.floor((target - 2) / STEP) * STEP; // 너무 오래 멈췄으면 2초까지만 따라잡아요
  const me = G.me, host = isHost();
  if (me && me.alive) me.press = pressed();
  let steps = 0;
  // 프레임이 끊겨도 1/60초씩 나눠 진행해서 벽을 뚫지 않아요
  while (simT + STEP <= target && steps < 150) {
    simT += STEP; steps++;
    if (me && me.alive) stepBee(me, simT);
    if (host) {
      for (let i = 0; i < G.roster.length; i++) {
        const b = G.roster[i];
        if (b.bot && b.alive) { botThink(b, simT); stepBee(b, simT); }
      }
    }
  }
}

function updateBees(dt, t) {
  for (const b of G.roster) {
    let pressing = false;
    if (G.phase === "lobby" || G.phase === "count") {
      b.dispD = 0; b.dispY = b.y0 + Math.sin(t / 260 + b.idx * 1.7) * 4; b.dispVy = 0; pressing = true;
    } else if (b.alive && G.phase === "result") {
      // 판이 끝났을 때 아직 날던 꿀벌은 그대로 앞으로 날아가요 (순위는 끝난 순간 거리로)
      b.dispD = b.fD + (t - G.resultAt) / 1000 * speedAtDist(b.fD); b.dispVy = 0; pressing = true;
    } else if (b.alive) {
      if (localSim(b)) { b.dispD = b.d; b.dispY = b.y; b.dispVy = b.vy; pressing = b.press; }
      else {
        // 받은 위치 사이를 이어 그려요: x는 마지막 거리 + 속도 × 지난 시간, y는 부드럽게 따라가요
        const ext = clamp((t - b.nAt) / 1000, 0, 1.5), v = speedAtDist(b.nD);
        const td = Math.min(EXIT_X, b.nD + v * ext);
        const pred = b.dispD + (ext < 1.5 ? v * dt : 0); // 속도만큼 먼저 움직이고 남은 차이만 부드럽게 맞춰요
        b.dispD = Math.abs(td - pred) > 300 ? td : pred + (td - pred) * Math.min(1, dt * 8);
        const py = b.dispY;
        b.dispY += (b.nY - b.dispY) * Math.min(1, dt * 12);
        b.dispVy += ((b.dispY - py) / Math.max(dt, 0.001) - b.dispVy) * Math.min(1, dt * 8);
        pressing = b.dispVy < -60;
      }
    } else if (b.exit) {
      b.dispD = EXIT_X + (t - b.exitAt) * 0.4; b.dispY += (300 - b.dispY) * Math.min(1, dt * 2); pressing = true;
    } else {
      // 떨어진 꿀벌: 머리 위에 별을 달고 바닥까지 떨어져요
      b.dispD = b.deadD;
      const fl = floorAt(b.deadD) - 13;
      if (b.fallY < fl) { b.fallVy += 1400 * dt; b.fallY = Math.min(fl, b.fallY + b.fallVy * dt); } else { b.fallY = fl; b.fallVy = 0; }
      b.dispY = b.fallY;
    }
    if (b.alive || b.exit) b.tilt = clamp(b.dispVy / VMAX, -1, 1) * 0.35;
    else b.tilt += (0.6 - b.tilt) * Math.min(1, dt * 6);
    b.flap += dt * (pressing ? 42 : 15);
  }
}
function leader() {
  let best = null;
  for (const b of G.roster) if (b.alive && !b.isMe && (!best || b.dispD > best.dispD)) best = b;
  return best;
}
function updateCamera(dt, t) {
  let target = 0, key = "start";
  if (G.phase === "play" || G.phase === "result") {
    const me = G.me;
    if (me && me.alive) { target = me.dispD; key = "me"; }
    else if (me && (G.phase === "result" || t - me.deadAt < 1300)) { target = me.deadD; key = "medead"; }
    else if (G.phase === "play") {
      const lead = leader(); // 구경: 가장 멀리 날고 있는 꿀벌을 따라가요
      if (lead) { target = lead.dispD; key = lead.id; } else { target = camD; key = "stay"; }
    } else { target = camD; key = "stay"; }
  }
  if (key !== camKey) { camOff = camD - target; camKey = key; }
  camOff *= Math.exp(-dt * 4);
  if (Math.abs(camOff) < 0.5) camOff = 0;
  camD = target + camOff;
}

function update(dt, t) {
  if (isHost()) hostUpdate(t);
  else if (G.phase === "count" && t >= G.startAt && G.clockN === G.n) { G.phase = "play"; enterPhase("play"); }
  if (G.phase === "count") {
    const num = Math.ceil((G.startAt - t) / 1000);
    if (num !== countNum && num >= 1 && num <= 3) { countNum = num; sfx.tick(); } // 3·2·1
  }
  const me = G.me;
  const prevD = me ? me.d : 0;
  simulate(t);
  // 100m마다 표지판 "딩동"
  if (me && G.phase === "play" && Math.floor(me.d / 5000) > Math.floor(prevD / 5000) && me.d < EXIT_X) { sfx.sign(); popup(me.d + 70, me.y + (me.y < 200 ? 50 : -50), `${Math.floor(me.d / 5000) * 100}m!`, "#ffe9a8", 18, true); }
  updateBees(dt, t);
  updateCamera(dt, t);
  // 내 순위가 오르면 "뿅"
  updateRanking();
  const r = me ? rankArr.indexOf(me) : -1;
  if (G.phase === "play" && me && me.alive && rankPrev >= 0 && r < rankPrev && t - rankBeepAt > 700 && t - G.startAt > 1500) { sfx.pop(); rankBeepAt = t; }
  rankPrev = r;
  netSend(t);

  // 날갯짓 바람 방울 (최대 40개)
  if (me && me.alive && G.phase === "play" && me.press) {
    windAcc += dt;
    while (windAcc > 0.025) {
      windAcc -= 0.025;
      if (windCount < 40) spawn(0, me.d - 6 + Math.random() * 8, me.y + 12, speedNow() * 0.55, 150 + Math.random() * 90, 0.35, 2.5 + Math.random() * 2, "#ffffff");
    }
  } else windAcc = 0;
  windCount = 0;
  for (const p of parts) {
    if (!p.on) continue;
    p.life -= dt;
    if (p.life <= 0) { p.on = false; continue; }
    if (p.kind === 0) windCount++;
    if (p.kind === 2) p.vy += 700 * dt; else if (p.kind === 3) { p.vy += 420 * dt; p.vx *= 1 - dt * 1.5; } else if (p.kind === 1) p.vy += 120 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 6;
  }
  const mv = me && me.alive && G.phase === "play" ? speedNow() * dt : 0; // 내 꿀벌 팝업은 꿀벌과 같이 움직여요
  for (const p of pops) if (p.on) { p.life -= dt; p.y -= 50 * dt; if (p.follow) p.x += mv; if (p.life <= 0) p.on = false; }
  if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
  updateBuzz(t);
}

/* ===== 그리기 ===== */
function roundRect(x, y, w, h, r) {

  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function setFont(size, weight) { ctx.font = `${weight || "normal"} ${size}px ${FONT}`; }
function text(s, x, y, size, align, weight, color, maxW) {
  setFont(size, weight);
  if (maxW) { const w = ctx.measureText(s).width; if (w > maxW) { size = Math.max(14, size * maxW / w); setFont(size, weight); } }
  ctx.textAlign = align || "center"; ctx.textBaseline = "middle"; ctx.fillStyle = color || "#fff";
  if (maxW) ctx.fillText(s, x, y, maxW); else ctx.fillText(s, x, y);
}

  ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(15,8,26,0.75)";
  ctx.strokeText(s, x, y); ctx.fillStyle = color || "#fff"; ctx.fillText(s, x, y);
}
function fitStr(s, maxW) {

  let n = s.length;
  while (n > 1 && ctx.measureText(s.slice(0, n) + "…").width > maxW) n--;
  return s.slice(0, n) + "…";
}
function pill(cx, cy, w, h, color) { roundRect(cx - w / 2, cy - h / 2, w, h, h / 2); ctx.fillStyle = color; ctx.fill(); }
function starPath(x, y, r, rot) {
  ctx.beginPath();

    ctx.beginPath(); ctx.ellipse(4, -16, 6, 11 * open, 0.25, 0, TAU); ctx.fill();
  }

  ctx.fillStyle = color;

  ctx.save(); ctx.clip();
  ctx.fillStyle = "#2b2b2b"; ctx.fillRect(-11, -16, 5, 32); ctx.fillRect(-2, -16, 5, 32);
  ctx.restore();

  ctx.fillStyle = "#222222"; ctx.beginPath(); ctx.arc(12.4, -4, 2, 0, TAU); ctx.fill();

function drawBee(b, t) {

function drawWorld(t) {
  const x0 = camD - BEE_X - 30, x1 = camD - BEE_X + W / S + 30;

  let n = 0;
  for (let x = Math.floor(x0 / 20) * 20; x <= x1 + 20 && n < PTS; x += 20) { PX[n] = x; PCe[n] = ceilAt(x); PFl[n] = floorAt(x); n++; }
  ctx.beginPath(); ctx.moveTo(PX[0], PCe[0]);

  ctx.fillStyle = "rgba(94,224,208,0.25)";

    const cx = base + (((c[0] - camD * 0.3) % span) + span) % span, cy = c[1], s = c[2];
    ctx.beginPath(); ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * 0.35, cy - s * 0.2); ctx.lineTo(cx + s * 0.22, cy + s * 0.6);
    ctx.lineTo(cx - s * 0.22, cy + s * 0.6); ctx.lineTo(cx - s * 0.35, cy - s * 0.2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + s * 0.5, cy - s * 0.4); ctx.lineTo(cx + s * 0.7, cy + s * 0.1); ctx.lineTo(cx + s * 0.55, cy + s * 0.6); ctx.lineTo(cx + s * 0.35, cy + s * 0.2); ctx.closePath(); ctx.fill();

  ctx.beginPath(); ctx.moveTo(PX[0], PFl[0]); for (let i = 1; i < n; i++) ctx.lineTo(PX[i], PFl[i]); ctx.stroke();

  for (let k = kS; k <= kE; k++) {

      pill(W / 2, GUIDE_Y, w, 32, "rgba(20,12,34,0.72)");
      text(label, W / 2, GUIDE_Y + 1, 16, "center", "800", "#ffe9a8", w - 20);
      drawHint(t);
    } else if (!me) {
      bannerBottom = bottomBanner(W < 420 ? "이번 판은 구경해요." : "이번 판은 구경해요. 다음 판부터 같이 해요!", W < 420 ? "다음 판부터 같이 해요!" : "");
    } else if (!me.alive && G.phase === "play" && t - me.deadAt > 1300) {
      bannerBottom = bottomBanner(me.exit ? "완주! 남은 꿀벌을 구경해요" : "쿵! 남은 꿀벌을 구경해요", `내 기록 ${Math.floor(me.d / UNIT_PER_M)}m · 꿀 ${me.honey} · ${me.score}점`);
    }
  }
  drawNotes(t, bannerBottom, guide);
}
function bottomBanner(a, b) {
  setFont(16, "800");
  let w = ctx.measureText(a).width;
  if (b) { setFont(14, "700"); w = Math.max(w, ctx.measureText(b).width); }
  w = Math.min(W - 16, w + 32);
  const h = b ? 52 : 32, y = BOTTOM_Y - (b ? 10 : 0);
  roundRect(W / 2 - w / 2, y - h / 2, w, h, 14); ctx.fillStyle = "rgba(20,12,34,0.78)"; ctx.fill();
  if (b) {
    text(a, W / 2, y - 11, 16, "center", "800", "#ffffff", w - 16);
    text(b, W / 2, y + 12, 14, "center", "700", "#ffe9a8", w - 16);
  } else text(a, W / 2, y + 1, 16, "center", "800", "#ffffff", w - 16);
  return y + h / 2;
}

function card(x, y, w, h) {
  roundRect(x, y, w, h, 20); ctx.fillStyle = "rgba(42,31,61,0.95)"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#9a6b40"; ctx.stroke();
}
function drawLobby(t) {
  ctx.fillStyle = "rgba(12,8,24,0.5)"; ctx.fillRect(0, 0, W, H);
  let cw = Math.min(W - 24, 420);
  const ch = Math.min(H - 24, 300);
  let top = H / 2 - ch / 2;
  if (HINT_BELOW) top = Math.max(12, Math.min(top, HINT_Y - 45 - 10 - ch));
  if (top < 56) cw = Math.min(cw, W - 120); // 음소거 버튼과 겹치지 않게
  const x = W / 2 - cw / 2;
  card(x, top, cw, ch);
  text("붕붕 꿀벌 동굴 레이스", W / 2, top + ch * 0.13, Math.min(30, (cw - 24) / 10), "center", "900", ME_COLOR, cw - 24);
  ctx.save();
  ctx.translate(W / 2, top + ch * 0.34 + Math.sin(t / 400) * 6);
  const bs = clamp(ch / 260, 0.9, 1.25);
  ctx.scale(bs, bs); ctx.rotate(Math.sin(t / 400 + 1) * 0.12);
  beeShape(ME_COLOR, true, t / 25, true, 1, 2 / bs);
  ctx.restore();
  text("꾹 누르면 올라가요 · 떼면 내려가요", W / 2, top + ch * 0.53, 16, "center", "700", "#ffffff", cw - 24);
  const status = online ? `다른 플레이어를 기다리는 중 (${humans.length}/4)` : "혼자 모드 · 컴퓨터 꿀벌과 함께해요";
  text(status, W / 2, top + ch * 0.65, 16, "center", "600", "#d9cdf0", cw - 24);
  const pulse = 1 + Math.sin(t / 260) * 0.04;
  text("탭하거나 스페이스를 눌러 시작", W / 2, top + ch * 0.79, 18 * pulse, "center", "900", "#ffd23f", cw - 24);
  let sub = "";
  if (joinState === "ok") {
    const end = isHost() ? G.lobbySince + lobbyWait() : G.phaseEnd;
    const left = Math.ceil((end - t) / 1000);
    sub = left > 0 ? `${left}초 뒤에 자동으로 시작해요` : "곧 시작해요";
  } else sub = "컴퓨터 꿀벌 둘과 같이 날아요";
  text(sub, W / 2, top + ch * 0.9, 14, "center", "600", "#bfb2d9", cw - 24);
  // "여기를 꾹!"은 카드와 겹치지 않을 때만 (작은 가로 화면에서는 카드 안 안내로 충분해요)
  if (!(HINT_X + 45 > x && HINT_X - 45 < x + cw && HINT_Y + 45 > top && HINT_Y - 45 < top + ch)) drawHint(t);
}
function drawCount(t) {
  const left = Math.ceil((G.startAt - t) / 1000);
  if (left >= 1 && left <= 3) {
    const f = (G.startAt - t) / 1000 - (left - 1), size = clamp(Math.min(W, H) * 0.22, 64, 150) * (0.85 + f * 0.25);
    textO(String(left), W / 2, BT + BAND * S * 0.42, size, "center", "900", "#ffffff");
  }
}
function drawGo(t) {
  const k = (t - goAt) / 800;
  if (k < 0 || k > 1) return;
  ctx.globalAlpha = 1 - k;
  textO("출발!", W / 2, BT + BAND * S * 0.42, clamp(Math.min(W, H) * 0.14, 44, 96) * (1 + k * 0.2), "center", "900", ME_COLOR);
  ctx.globalAlpha = 1;
}
function crown(x, y) {
  ctx.fillStyle = "#ffd23f";
  ctx.beginPath(); ctx.moveTo(x - 11, y + 7); ctx.lineTo(x - 12, y - 6); ctx.lineTo(x - 5, y); ctx.lineTo(x, y - 9);
  ctx.lineTo(x + 5, y); ctx.lineTo(x + 12, y - 6); ctx.lineTo(x + 11, y + 7); ctx.closePath(); ctx.fill();
}
function drawResult(t) {
  const since = t - G.resultAt;
  if (since < RESULT_CARD_DELAY) return; // 쿵 하는 모습을 먼저 보여줘요
  const a = clamp((since - RESULT_CARD_DELAY) / 250, 0, 1);
  ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(12,8,24,0.55)"; ctx.fillRect(0, 0, W, H);
  const me = G.me, rows = rankArr.length;
  let cw = Math.min(W - 24, 400);
  const head = 58, mine = me ? 32 : 0, foot = 46;
  let rowH = 46;
  let ch = head + rows * rowH + mine + foot + 8;
  if (ch > H - 16) { rowH = Math.max(34, (H - 16 - head - mine - foot - 8) / Math.max(1, rows)); ch = head + rows * rowH + mine + foot + 8; }
  const y = Math.max(8, H / 2 - ch / 2);
  if (y < 56) cw = Math.min(cw, W - 120); // 음소거 버튼과 겹치지 않게
  const x = W / 2 - cw / 2;
  card(x, y, cw, ch);
  const title = !me ? "이번 판 결과" : me.exit ? "완주했어요!" : rankArr[0] === me ? "1등이에요!" : "쿵! 이번 판 결과";
  text(title, W / 2, y + 30, Math.min(26, cw / 12), "center", "900", ME_COLOR, cw - 24);
  for (let i = 0; i < rows; i++) {
    const b = rankArr[i], ry = y + head + i * rowH + rowH / 2;
    if (b.isMe) { roundRect(x + 8, ry - rowH / 2 + 2, cw - 16, rowH - 4, 10); ctx.fillStyle = "rgba(255,201,60,0.14)"; ctx.fill(); }
    if (i === 0) crown(x + 26, ry); else text(String(i + 1), x + 26, ry, 16, "center", "900", "#d9cdf0");
    ctx.save(); ctx.translate(x + 56, ry + 1); ctx.scale(0.62, 0.62);
    beeShape(b.color, b.isMe, 1, false, 1, 3); ctx.restore();
    setFont(15, "800");
    const nameW = cw - 80 - 82;
    const nm = fitStr(b.isMe && b.name !== "나" ? `${b.name} (나)` : b.name, nameW);
    text(nm, x + 80, ry - 9, 15, "left", "800", b.isMe ? "#ffd23f" : "#ffffff");
    const m = Math.floor(b.fD / UNIT_PER_M);
    const sub = b.flying ? `${m}m · 계속 날았어요` : b.fE ? `${m}m · 완주` : `${m}m`;
    text(sub, x + 80, ry + 11, 14, "left", "600", "#bfb2d9", nameW);
    text(`${b.fSc}점`, x + cw - 16, ry, 17, "right", "900", "#ffd23f");
  }
  let yy = y + head + rows * rowH;
  if (me) { text(`내 점수 ${me.fSc} · 최고 ${best}`, W / 2, yy + 16, 16, "center", "800", "#ffffff", cw - 24); yy += mine; }
  const solo = humans.length < 2;
  if (solo && isHost()) {
    const ready = t >= ignoreUntil && since > 1000;
    text("탭하거나 스페이스를 눌러 다시 하기", W / 2, yy + 22, 17, "center", "900", ready ? "#ffd23f" : "rgba(255,210,63,0.45)", cw - 24);
  } else {
    const left = Math.max(0, Math.ceil((G.phaseEnd - t) / 1000));
    text(`곧 다음 판이 시작돼요 (${left}초)`, W / 2, yy + 22, 15, "center", "700", "#d9cdf0", cw - 24);
  }
  ctx.globalAlpha = 1;
}

function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (W < 20 || H < 20) return;
  SHX = 0; SHY = 0;
  if (shakeT > 0) { const k = shakeT / 0.3; SHX = (Math.random() * 2 - 1) * 8 * k; SHY = (Math.random() * 2 - 1) * 8 * k; }
  ctx.save();
  ctx.translate(SHX + (BEE_X - camD) * S, SHY + BT);
  ctx.scale(S, S);
  drawWorld(t);
  ctx.restore();
  drawScreenLayer(t);
  // 꿀벌 앞 420단위부터 어둠
  const dx = (BEE_X + VIEW_AHEAD) * S;
  if (dx < W) { ctx.fillStyle = darkGrad; ctx.fillRect(dx, 0, W - dx, H); }
  drawHud(t);
  if (G.phase === "lobby") drawLobby(t);
  else if (G.phase === "count") drawCount(t);
  else if (G.phase === "play") drawGo(t);
  else if (G.phase === "result") drawResult(t);
}

/* ===== 메인 루프 (iframe 크기가 늦게 잡혀도 매 프레임 확인해요) ===== */
let last = now();
function loop(ts) {
  const t = now();
  const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
  last = t;
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  update(dt, t);
  draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
