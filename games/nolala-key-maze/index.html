<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>열쇠 찾아 노라라 미로</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2118; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #mute {
    position: fixed; top: 4px; right: 6px; width: 48px; height: 48px; border: 0; border-radius: 10px;
    background: rgba(255,255,255,.18); color: #fff; font-size: 20px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" aria-label="소리 끄기">🔊</button>
<script>
/* ===== 게임 SDK: 리더보드 + 멀티 (public/sdk.js와 같은 코드. 지우지 마세요) ===== */
/* 멀티 게임 쓰는 법은 games/README.md의 "멀티 게임"을 보세요 */
(function () {
  var sent = false;
  var standalone = window.parent === window; // 파일을 직접 열었을 때
  var listeners = { message: [], players: [], emote: [], error: [] };
  var room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
  var waiting = [];

  function post(msg) {
    if (!standalone) window.parent.postMessage(msg, "*");
  }
  function emit(name, a, b) {
    var list = listeners[name] || [];
    for (var i = 0; i < list.length; i++) {
      try { list[i](a, b); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }
  function settle(ok, value) {
    var list = waiting;
    waiting = [];
    for (var i = 0; i < list.length; i++) {
      clearTimeout(list[i].timer);
      ok ? list[i].resolve(value) : list[i].reject(new Error(value));
    }
  }

  window.addEventListener("message", function (event) {
    if (standalone || event.source !== window.parent) return; // 바깥 플레이 페이지에서 온 것만
    var m = event.data;
    if (!m || typeof m !== "object") return;
    if (m.type === "GAMESDK_MP_JOINED") {
      room = { joined: true, roomId: m.roomId, me: m.me, players: m.players || [], hostId: m.hostId, maxPlayers: m.maxPlayers };
      settle(true, { roomId: room.roomId, me: room.me, players: room.players, hostId: room.hostId, maxPlayers: room.maxPlayers });
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_PLAYERS") {
      room.players = m.players || [];
      room.hostId = m.hostId;
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_MESSAGE") {
      emit("message", m.data, m.from);
    } else if (m.type === "GAMESDK_MP_EMOTE") {
      emit("emote", m.key, m.from);
    } else if (m.type === "GAMESDK_MP_ERROR") {
      if (!room.joined) settle(false, m.message);
      emit("error", m.message);
    }
  });

  window.GameSDK = {
    submitScore: function (score) {
      if (sent) return; // 한 판에 한 번만
      if (typeof score !== "number" || !isFinite(score)) return;
      sent = true;
      post({ type: "GAMESDK_SCORE", score: score });
    },
    // 새 판을 시작할 때 부르면 다시 점수를 보낼 수 있어요.
    newRound: function () {
      sent = false;
      post({ type: "GAMESDK_NEW_ROUND" });
    },
    multi: {
      join: function () {
        return new Promise(function (resolve, reject) {
          if (standalone) return reject(new Error("사이트 밖에서는 멀티를 쓸 수 없어요"));
          var w = { resolve: resolve, reject: reject, timer: 0 };
          w.timer = setTimeout(function () {
            waiting = waiting.filter(function (x) { return x !== w; });
            reject(new Error("방에 들어가지 못했어요 (응답 없음)"));
          }, 8000);
          waiting.push(w);
          post({ type: "GAMESDK_MP_JOIN" });
        });
      },
      send: function (data) { if (room.joined) post({ type: "GAMESDK_MP_SEND", data: data }); },
      emote: function (key) { if (room.joined) post({ type: "GAMESDK_MP_EMOTE", key: key }); },
      lock: function (locked) { if (room.joined) post({ type: "GAMESDK_MP_LOCK", locked: locked !== false }); },
      leave: function () {
        if (!room.joined) return;
        room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
        post({ type: "GAMESDK_MP_LEAVE" });
      },
      on: function (name, fn) { if (listeners[name] && typeof fn === "function") listeners[name].push(fn); },
      me: function () { return room.me; },
      players: function () { return room.players.slice(); },
      hostId: function () { return room.hostId; },
      isHost: function () { return !!room.me && room.me.id === room.hostId; },
    },
  };
})();

/* ===== 화면 크기 ===== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ===== 소리 ===== */
let audio = null, muted = false;
function beep(freq, dur = 0.08, type = "square", vol = 0.08, delay = 0) {
  if (!audio || muted) return;
  const t = audio.currentTime + delay;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + dur);
}
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === "suspended") audio.resume();
}
const muteBtn = document.getElementById("mute");
muteBtn.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  unlockAudio();
  muted = !muted;
  muteBtn.textContent = muted ? "🔇" : "🔊";
  muteBtn.setAttribute("aria-label", muted ? "소리 켜기" : "소리 끄기");
});

/* ===== 입력 (키는 e.code로 판정해요: 한글 자판에서도 WASD가 돼요) ===== */
const keys = new Set();
const pointer = { down: false, x: 0, y: 0 };
let swipeX = 0, swipeY = 0;
const GAME_KEYS = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"];
window.addEventListener("keydown", (e) => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (!keys.has(e.code)) onPress(e.code);
  keys.add(e.code);
});
window.addEventListener("keyup", (e) => keys.delete(e.code));
canvas.addEventListener("pointerdown", (e) => {
  if (pressButtonAt(e)) return;
  pointer.down = true; pointer.x = swipeX = e.clientX; pointer.y = swipeY = e.clientY;
  onPress("pointer");
});
canvas.addEventListener("pointermove", (e) => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (pointer.down && state === "play" && !paused) {
    const dx = e.clientX - swipeX, dy = e.clientY - swipeY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) {
      queueDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
      swipeX = e.clientX; swipeY = e.clientY;
    }
  }
});
window.addEventListener("pointerup", (e) => { releaseButton(e); pointer.down = false; });
window.addEventListener("pointercancel", (e) => { releaseButton(e); pointer.down = false; });

/* ===== 부품 상자 ===== */
const buttons = [];
function addButton(id, label, layout) { buttons.push({ id, label, layout, down: false, pid: null }); }
function buttonRect(b) {
  const r = b.layout(W, H);
  const w = Math.max(48, r.w), h = Math.max(48, r.h);
  return { x: r.x - (w - r.w) / 2, y: r.y - (h - r.h) / 2, w, h };
}
function buttonDown(id) { for (const b of buttons) if (b.id === id) return b.down; return false; }
function pressButtonAt(e) {
  if (state !== "play") return false;
  for (const b of buttons) {
    const r = buttonRect(b);
    if (e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h) {
      b.down = true; b.pid = e.pointerId;
      onPress("btn:" + b.id);
      return true;
    }
  }
  return false;
}
function releaseButton(e) { for (const b of buttons) if (b.pid === e.pointerId) { b.down = false; b.pid = null; } }
function drawButtons() {
  if (state !== "play") return;
  for (const b of buttons) {
    const r = buttonRect(b);
    ctx.fillStyle = b.down ? "rgba(94,200,242,.6)" : "rgba(255,255,255,.2)";
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4, 12); else ctx.rect(r.x + 2, r.y + 2, r.w - 4, r.h - 4); ctx.fill();
    text(b.label, r.x + r.w / 2, r.y + r.h / 2, 22, "center", "bold");
  }
}

const MAX_PARTICLES = 120;
const particles = []; let particleNext = 0;
for (let i = 0; i < MAX_PARTICLES; i++) particles.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, color: "#fff", size: 3 });
function burst(x, y, color = "#fff", n = 10, speed = 180) {
  for (let i = 0; i < n; i++) {
    const p = particles[particleNext]; particleNext = (particleNext + 1) % MAX_PARTICLES;
    const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.6);
    p.x = x; p.y = y; p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v;
    p.max = p.life = 0.35 + Math.random() * 0.3; p.color = color; p.size = 2 + Math.random() * 3;
  }
}
let shakeTime = 0, shakePower = 0;
function shake(power = 6, time = 0.15) { shakePower = Math.max(shakePower, power); shakeTime = Math.max(shakeTime, time); }
function updateFx(dt) {
  for (const p of particles) if (p.life > 0) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
  if (shakeTime > 0) { shakeTime -= dt; if (shakeTime <= 0) shakePower = 0; }
}
function beginShake() {
  ctx.save();
  if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 2 * shakePower, (Math.random() - 0.5) * 2 * shakePower);
}
function endShake() { ctx.restore(); }
function drawFx() {
  for (const p of particles) if (p.life > 0) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function clearFx() {
  for (const p of particles) p.life = 0;
  shakeTime = 0; shakePower = 0;
  for (const b of buttons) { b.down = false; b.pid = null; }
}
function fitSize(size) { return Math.max(14, Math.round(size * Math.min(1, W / 420))); }
function text(s, x, y, size, align = "center", weight = "normal", color = "#fff") {
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  ctx.fillText(s, x, y);
}
// 글자가 maxW보다 길면 14px까지 줄여서 그려요
function textFit(s, x, y, maxW, size, align = "center", weight = "normal", color = "#fff") {
  let sz = size;
  ctx.font = `${weight} ${sz}px sans-serif`;
  while (sz > 14 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${weight} ${sz}px sans-serif`; }
  text(s, x, y, sz, align, weight, color);
}

/* ===== 미로 만들기 (그림 없이 계산만 해요. 테스트에서도 이 부분만 따로 돌려요) ===== */
/*GEN-START*/
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0], BIT = [1, 2, 4, 8], OPP = [2, 3, 0, 1]; // 0 위, 1 오른쪽, 2 아래, 3 왼쪽
function bfsDist(cols, rows, walls, src, blocked) {
  const n = cols * rows, dist = new Int16Array(n).fill(-1), q = new Int16Array(n);
  let h = 0, t = 0; q[t++] = src; dist[src] = 0;
  while (h < t) {
    const c = q[h++], x = c % cols, y = (c / cols) | 0;
    for (let d = 0; d < 4; d++) {
      if (walls[c] & BIT[d]) continue;
      const nx = x + DX[d], ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      const nb = ny * cols + nx;
      if (dist[nb] >= 0 || (blocked && blocked[nb])) continue;
      dist[nb] = dist[c] + 1; q[t++] = nb;
    }
  }
  return dist;
}
function genMaze(cols, rows, nKeys, nAnts, antLen) {
  const n = cols * rows, walls = new Uint8Array(n).fill(15), vis = new Uint8Array(n);
  const ri = (m) => Math.floor(Math.random() * m);
  const stack = [0]; vis[0] = 1;
  const opts = [0, 0, 0, 0];
  while (stack.length) {
    const c = stack[stack.length - 1], x = c % cols, y = (c / cols) | 0;
    let k = 0;
    for (let d = 0; d < 4; d++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (nx >= 0 && ny >= 0 && nx < cols && ny < rows && !vis[ny * cols + nx]) opts[k++] = d;
    }
    if (!k) { stack.pop(); continue; }
    const d = opts[ri(k)], nb = (y + DY[d]) * cols + x + DX[d];
    walls[c] &= ~BIT[d]; walls[nb] &= ~BIT[OPP[d]]; vis[nb] = 1; stack.push(nb);
  }
  // 샛길: 벽 몇 개를 더 뚫어요
  for (let t = Math.floor(n * 0.13); t > 0; t--) {
    const c = ri(n), d = ri(4), x = c % cols, y = (c / cols) | 0, nx = x + DX[d], ny = y + DY[d];
    if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || !(walls[c] & BIT[d])) continue;
    walls[c] &= ~BIT[d]; walls[ny * cols + nx] &= ~BIT[OPP[d]];
  }
  const dist = bfsDist(cols, rows, walls, 0, null);
  let maxd = 0; for (let i = 0; i < n; i++) if (dist[i] > maxd) maxd = dist[i];
  // 문: 시작에서 먼 칸
  const far = []; for (let i = 1; i < n; i++) if (dist[i] >= Math.floor(maxd * 0.75)) far.push(i);
  const door = far[ri(far.length)];
  // 열쇠: 시작에서 멀고 서로 떨어진 칸
  const pool = []; for (let i = 1; i < n; i++) if (i !== door && dist[i] >= Math.max(3, Math.floor(maxd * 0.35))) pool.push(i);
  for (let i = pool.length - 1; i > 0; i--) { const j = ri(i + 1), t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  let keyCells = [];
  for (const gap of [5, 3, 0]) {
    keyCells = [];
    const dd = [bfsDist(cols, rows, walls, door, null)];
    for (const c of pool) {
      if (keyCells.length >= nKeys) break;
      let ok = true;
      for (const a of dd) if (a[c] < gap) { ok = false; break; }
      if (!ok) continue;
      keyCells.push(c); dd.push(bfsDist(cols, rows, walls, c, null));
    }
    if (keyCells.length >= nKeys) break;
  }
  for (let i = 1; i < n && keyCells.length < nKeys; i++) if (i !== door && keyCells.indexOf(i) < 0) keyCells.push(i);
  // 개미: 막다른 길이 아닌 통로 위를 오가요. 개미 길을 다 막아도 열쇠·문에 닿을 수 있을 때만 놓아요
  const forbid = new Uint8Array(n), blocked = new Uint8Array(n), ants = [];
  forbid[door] = 1; for (const k of keyCells) forbid[k] = 1;
  const openCount = (c) => { let k = 0; for (let d = 0; d < 4; d++) if (!(walls[c] & BIT[d])) k++; return k; };
  for (let a = 0; a < nAnts; a++) {
    for (let tries = 0; tries < 80; tries++) {
      const s = ri(n);
      const okCell = (c) => dist[c] >= 3 && !forbid[c] && !blocked[c] && openCount(c) >= 2;
      if (!okCell(s)) continue;
      const path = [s];
      while (path.length < antLen) {
        const c = path[path.length - 1], x = c % cols, y = (c / cols) | 0;
        let k = 0;
        for (let d = 0; d < 4; d++) {
          if (walls[c] & BIT[d]) continue;
          const nb = (y + DY[d]) * cols + x + DX[d];
          if (okCell(nb) && path.indexOf(nb) < 0) opts[k++] = nb;
        }
        if (!k) break;
        path.push(opts[ri(k)]);
      }
      if (path.length < 3) continue;
      for (const c of path) blocked[c] = 1;
      const d2 = bfsDist(cols, rows, walls, 0, blocked);
      let ok = d2[door] >= 0;
      for (const k of keyCells) if (d2[k] < 0) ok = false;
      if (ok) { ants.push(path); break; }
      for (const c of path) blocked[c] = 0;
    }
  }
  return { cols, rows, walls, keys: keyCells, door, ants };
}
/*GEN-END*/

/* ===== 게임 상태 ===== */
const STAGES = [
  { c: 7, r: 7, k: 1, a: 0 },
  { c: 9, r: 9, k: 2, a: 0 },
  { c: 9, r: 9, k: 2, a: 1 },
  { c: 13, r: 9, k: 3, a: 2 },
  { c: 13, r: 9, k: 3, a: 2 },
];
const TOTAL_TIME = 150, HIT_PENALTY = 5, STEP_SPEED = 9;
let state = "title"; // title | play | over
let score = 0, best = 0;
let paused = false, overT = 0, overMsg = "", time = 0;
let stage = 1, timeLeft = TOTAL_TIME, keysGot = 0, doorOpen = false, wipeT = 0, wipeBuilt = false;
let maze = null, keyGot = [], antList = [];
const hamster = { cx: 0, cy: 0, fx: 0, fy: 0, invuln: 0 };
let bufDir = -1, bufT = 0, lastDir = -1;
let msg = "", msgT = 0;
// 배치 (매 프레임 계산)
let L = { land: false, bs: 48, dpX: 0, dpY: 0, rx: 0, ry: 0, rw: 0, rh: 0, cs: 20, ox: 0, oy: 0 };

function say(s) { msg = s; msgT = 2.4; }
function dirOfCode(c) {
  if (c === "ArrowUp" || c === "KeyW") return 0;
  if (c === "ArrowRight" || c === "KeyD") return 1;
  if (c === "ArrowDown" || c === "KeyS") return 2;
  if (c === "ArrowLeft" || c === "KeyA") return 3;
  return -1;
}
const DIR_CODES = [["ArrowUp", "KeyW"], ["ArrowRight", "KeyD"], ["ArrowDown", "KeyS"], ["ArrowLeft", "KeyA"]];
function isHeld(d) { return keys.has(DIR_CODES[d][0]) || keys.has(DIR_CODES[d][1]) || buttonDown("d" + d); }
function heldDir() {
  if (lastDir >= 0 && isHeld(lastDir)) return lastDir;
  for (let d = 0; d < 4; d++) if (isHeld(d)) return d;
  return -1;
}
function queueDir(d) { lastDir = d; bufDir = d; bufT = 0.2; }

addButton("d0", "▲", () => ({ x: L.dpX + L.bs, y: L.dpY, w: L.bs, h: L.bs }));
addButton("d1", "▶", () => ({ x: L.dpX + L.bs * 2, y: L.dpY + L.bs, w: L.bs, h: L.bs }));
addButton("d2", "▼", () => ({ x: L.dpX + L.bs, y: L.dpY + L.bs * 2, w: L.bs, h: L.bs }));
addButton("d3", "◀", () => ({ x: L.dpX, y: L.dpY + L.bs, w: L.bs, h: L.bs }));

function computeLayout() {
  const land = W > H * 1.15;
  const bs = Math.max(48, Math.min(64, Math.round(Math.min(W, H) * 0.16)));
  const m = 8;
  L.land = land; L.bs = bs;
  L.dpX = land ? W - bs * 3 - m : Math.round((W - bs * 3) / 2);
  L.dpY = H - bs * 3 - m;
  L.rx = 6; L.ry = 88;
  L.rw = (land ? L.dpX - 10 : W - 6) - L.rx;
  L.rh = (land ? H - 6 : L.dpY - 8) - L.ry;
  if (maze) {
    L.cs = Math.max(8, Math.floor(Math.min(L.rw / maze.cols, L.rh / maze.rows)));
    L.ox = Math.round(L.rx + (L.rw - L.cs * maze.cols) / 2);
    L.oy = Math.round(L.ry + (L.rh - L.cs * maze.rows) / 2);
  }
}

function buildStage() {
  const cfg = STAGES[stage - 1];
  let c = cfg.c, r = cfg.r;
  computeLayout();
  if (c > r && !L.land && L.rh > L.rw * 1.15) { const t = c; c = r; r = t; } // 세로 화면에서는 세로로 긴 미로
  maze = genMaze(c, r, cfg.k, cfg.a, stage >= 4 ? 5 : 4);
  keyGot = maze.keys.map(() => false);
  keysGot = 0; doorOpen = false;
  hamster.cx = hamster.cy = hamster.fx = hamster.fy = 0; hamster.invuln = 0.6;
  bufDir = -1; bufT = 0;
  antList.length = 0;
  for (const path of maze.ants) {
    const sp = stage >= 4 ? 2.0 : 1.7;
    antList.push({ path, s: Math.random() * (path.length - 1), d: Math.random() < 0.5 ? 1 : -1, v: sp, x: 0, y: 0, hx: 1, hy: 0 });
  }
  updateAnts(0);
  computeLayout();
  say(`스테이지 ${stage}: 열쇠 ${maze.keys.length}개를 모아요`);
}

function onPress(code) {
  unlockAudio();
  if (state === "title") return startGame();
  if (state === "over") { if (overT <= 0) startGame(); return; }
  if (paused) { paused = false; return; }
  if (wipeT > 0) return;
  const d = code.indexOf("btn:d") === 0 ? +code.slice(5) : dirOfCode(code);
  if (d >= 0) queueDir(d);
}

function startGame() {
  if (state === "over") GameSDK.newRound();
  state = "play"; score = 0; stage = 1; timeLeft = TOTAL_TIME; paused = false; wipeT = 0;
  clearFx(); keys.clear(); pointer.down = false;
  buildStage();
  beep(660, 0.1, "triangle");
}

function endGame(why) {
  state = "over"; overT = 0.6; overMsg = why;
  best = Math.max(best, score);
  GameSDK.submitScore(Math.round(score));
  if (why.indexOf("탈출") >= 0) { beep(660, 0.12, "triangle", 0.09); beep(880, 0.12, "triangle", 0.09, 0.12); beep(1320, 0.25, "triangle", 0.09, 0.24); }
  else { beep(220, 0.3, "sawtooth"); shake(6, 0.2); }
}

function updateAnts(dt) {
  for (const a of antList) {
    a.s += a.v * a.d * dt;
    const last = a.path.length - 1;
    if (a.s >= last) { a.s = last; a.d = -1; }
    if (a.s <= 0) { a.s = 0; a.d = 1; }
    const i = Math.min(last - 1, Math.floor(a.s)), f = a.s - i;
    const p0 = a.path[i], p1 = a.path[i + 1];
    const x0 = p0 % maze.cols, y0 = (p0 / maze.cols) | 0, x1 = p1 % maze.cols, y1 = (p1 / maze.cols) | 0;
    a.x = x0 + (x1 - x0) * f; a.y = y0 + (y1 - y0) * f;
    if (x1 !== x0 || y1 !== y0) { a.hx = (x1 - x0) * a.d; a.hy = (y1 - y0) * a.d; }
  }
}

function cellPx(cx, cy) { return { x: L.ox + (cx + 0.5) * L.cs, y: L.oy + (cy + 0.5) * L.cs }; }

function arrive() {
  const idx = hamster.cy * maze.cols + hamster.cx;
  for (let i = 0; i < maze.keys.length; i++) {
    if (!keyGot[i] && maze.keys[i] === idx) {
      keyGot[i] = true; keysGot++; score += 20;
      const px = cellPx(hamster.cx, hamster.cy);
      burst(px.x, px.y, "#fcd34d", 14, 150); burst(px.x, px.y, "#fff", 6, 110);
      beep(1200, 0.06, "triangle", 0.1); beep(1800, 0.1, "triangle", 0.1, 0.06);
      if (keysGot >= maze.keys.length) {
        doorOpen = true; shake(3, 0.1);
        beep(180, 0.12, "square", 0.09, 0.14); beep(110, 0.15, "square", 0.09, 0.26); beep(660, 0.2, "triangle", 0.08, 0.4);
        say("철컥! 문이 열렸어요. 파란 문으로 가요");
      } else say(`열쇠 ${keysGot}/${maze.keys.length}를 찾았어요 (+20)`);
    }
  }
  if (doorOpen && idx === maze.door) {
    score += 100;
    const px = cellPx(hamster.cx, hamster.cy);
    burst(px.x, px.y, "#5ec8f2", 18, 200);
    if (stage >= STAGES.length) {
      const bonus = Math.floor(timeLeft) * 5; score += bonus;
      say(`모두 탈출! 남은 시간 보너스 +${bonus}`);
      endGame("5스테이지를 모두 탈출했어요!");
    } else {
      beep(784, 0.1, "triangle", 0.09); beep(988, 0.1, "triangle", 0.09, 0.1); beep(1318, 0.18, "triangle", 0.09, 0.2);
      wipeT = 0.8; wipeBuilt = false;
      say(`스테이지 ${stage} 클리어! (+100)`);
    }
  }
}

function update(dt) {
  updateFx(dt);
  if (overT > 0) overT -= dt;
  if (state !== "play" || paused) return;
  time += dt;
  if (msgT > 0) msgT -= dt;
  if (wipeT > 0) {
    wipeT -= dt;
    if (!wipeBuilt && wipeT <= 0.4) { stage++; buildStage(); wipeBuilt = true; }
    return;
  }
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; endGame("시간이 끝났어요"); return; }
  if (bufT > 0) bufT -= dt;
  if (hamster.invuln > 0) hamster.invuln -= dt;
  const h = hamster;
  // 칸 사이를 부드럽게 이동
  let tx = h.cx, ty = h.cy;
  if (h.fx !== tx || h.fy !== ty) {
    const step = STEP_SPEED * dt;
    const dx = tx - h.fx, dy = ty - h.fy, dist = Math.hypot(dx, dy);
    if (dist <= step) { h.fx = tx; h.fy = ty; arrive(); if (state !== "play" || wipeT > 0) return; }
    else { h.fx += dx / dist * step; h.fy += dy / dist * step; }
  }
  if (h.fx === h.cx && h.fy === h.cy) {
    let d = bufT > 0 ? bufDir : -1;
    if (d < 0) d = heldDir();
    if (d >= 0) {
      if (!(maze.walls[h.cy * maze.cols + h.cx] & BIT[d])) {
        h.cx += DX[d]; h.cy += DY[d]; beep(300 + (h.cx + h.cy) % 3 * 40, 0.03, "triangle", 0.03);
      } else if (bufT > 0) { bufT = 0; bufDir = -1; }
      if (bufT > 0 && d === bufDir) { bufT = 0; bufDir = -1; }
    }
  }
  updateAnts(dt);
  if (h.invuln <= 0) {
    for (const a of antList) {
      if (Math.hypot(a.x - h.fx, a.y - h.fy) < 0.4) {
        const px = cellPx(h.fx, h.fy);
        burst(px.x + 0, px.y + 0, "#222", 10, 160); burst(px.x, px.y, "#f59e0b", 8, 140);
        shake(7, 0.22); beep(150, 0.2, "sawtooth", 0.1);
        h.cx = h.cy = h.fx = h.fy = 0; h.invuln = 1.2; bufDir = -1; bufT = 0;
        timeLeft -= HIT_PENALTY;
        say("개미에게 닿았어요! 시작 칸으로, -5초");
        if (timeLeft <= 0) { timeLeft = 0; endGame("시간이 끝났어요"); }
        break;
      }
    }
  }
}

/* ===== 그리기 ===== */
function drawHamster(px, py, r) {
  ctx.fillStyle = "#8a5a2b";
  ctx.beginPath(); ctx.arc(px - r * 0.62, py - r * 0.72, r * 0.32, 0, 6.2832); ctx.arc(px + r * 0.62, py - r * 0.72, r * 0.32, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#b9803f";
  ctx.beginPath(); ctx.arc(px, py, r, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#f6d9b0";
  ctx.beginPath(); ctx.arc(px - r * 0.55, py + r * 0.3, r * 0.38, 0, 6.2832); ctx.arc(px + r * 0.55, py + r * 0.3, r * 0.38, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.arc(px - r * 0.35, py - r * 0.2, r * 0.12, 0, 6.2832); ctx.arc(px + r * 0.35, py - r * 0.2, r * 0.12, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#e07a7a";
  ctx.beginPath(); ctx.arc(px, py + r * 0.05, r * 0.11, 0, 6.2832); ctx.fill();
}
function drawKey(px, py, cs) {
  const bob = Math.sin(time * 4 + px) * cs * 0.04;
  ctx.save(); ctx.translate(px, py + bob); ctx.rotate(-0.5);
  ctx.strokeStyle = "#e0a100"; ctx.fillStyle = "#e0a100"; ctx.lineWidth = Math.max(2, cs * 0.1); ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(-cs * 0.2, 0, cs * 0.14, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-cs * 0.06, 0); ctx.lineTo(cs * 0.28, 0); ctx.moveTo(cs * 0.2, 0); ctx.lineTo(cs * 0.2, cs * 0.14); ctx.moveTo(cs * 0.3, 0); ctx.lineTo(cs * 0.3, cs * 0.12); ctx.stroke();
  ctx.strokeStyle = "#fde68a"; ctx.lineWidth = Math.max(1, cs * 0.03);
  ctx.beginPath(); ctx.arc(-cs * 0.2, 0, cs * 0.14, 3.6, 5.2); ctx.stroke();
  ctx.restore();
}
function drawAnt(a, cs) {
  const px = L.ox + (a.x + 0.5) * cs, py = L.oy + (a.y + 0.5) * cs;
  const hl = Math.hypot(a.hx, a.hy) || 1, ux = a.hx / hl, uy = a.hy / hl;
  ctx.strokeStyle = "#222"; ctx.lineWidth = Math.max(1, cs * 0.04);
  ctx.beginPath();
  for (let i = -1; i <= 1; i++) {
    const cx = px + ux * i * cs * 0.17, cy = py + uy * i * cs * 0.17;
    ctx.moveTo(cx - uy * cs * 0.2, cy + ux * cs * 0.2); ctx.lineTo(cx + uy * cs * 0.2, cy - ux * cs * 0.2);
  }
  ctx.stroke();
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath();
  ctx.arc(px - ux * cs * 0.17, py - uy * cs * 0.17, cs * 0.09, 0, 6.2832);
  ctx.arc(px, py, cs * 0.1, 0, 6.2832);
  ctx.arc(px + ux * cs * 0.17, py + uy * cs * 0.17, cs * 0.11, 0, 6.2832);
  ctx.fill();
}

function drawHud() {
  const f = W < 360 ? 15 : 17;
  text(`스테이지 ${stage}/${STAGES.length}`, 10, 28, f, "left", "bold");
  text(maze ? `열쇠 ${keysGot}/${maze.keys.length}` : "", Math.round(W * 0.43), 28, f, "center", "bold", "#fcd34d");
  const sec = Math.ceil(Math.max(0, timeLeft));
  text(`${sec}초`, W - 66, 28, f + 2, "right", "bold", sec <= 20 ? "#ff8a80" : "#fff");
  // 안내 자리: HUD 바로 아래 한 줄 (한 번에 하나)
  const idle = `점수 ${score}`;
  textFit(msgT > 0 ? msg : idle, W / 2, 68, W - 16, 16, "center", "normal", msgT > 0 ? "#bfe9ff" : "#d9cdb8");
}

function drawMaze() {
  const cs = L.cs, ox = L.ox, oy = L.oy, w = maze.cols * cs, mh = maze.rows * cs;
  ctx.fillStyle = "#fff3c4"; ctx.fillRect(ox, oy, w, mh);
  ctx.fillStyle = "#cfeefb"; ctx.fillRect(ox, oy, cs, cs); // 시작 칸
  // 문
  const dx = ox + (maze.door % maze.cols) * cs, dy = oy + ((maze.door / maze.cols) | 0) * cs;
  if (doorOpen) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 6);
    ctx.fillStyle = `rgba(94,200,242,${0.25 + pulse * 0.3})`; ctx.fillRect(dx - cs * 0.15, dy - cs * 0.15, cs * 1.3, cs * 1.3);
    ctx.fillStyle = "#5ec8f2"; ctx.fillRect(dx + cs * 0.1, dy + cs * 0.1, cs * 0.8, cs * 0.8);
    ctx.fillStyle = "#fff"; ctx.fillRect(dx + cs * 0.3, dy + cs * 0.3, cs * 0.4, cs * 0.4);
  } else {
    ctx.fillStyle = "#2b6fb5"; ctx.fillRect(dx + cs * 0.1, dy + cs * 0.1, cs * 0.8, cs * 0.8);
    ctx.fillStyle = "#fcd34d"; ctx.fillRect(dx + cs * 0.36, dy + cs * 0.44, cs * 0.28, cs * 0.24);
    ctx.strokeStyle = "#fcd34d"; ctx.lineWidth = Math.max(1.5, cs * 0.05);
    ctx.beginPath(); ctx.arc(dx + cs * 0.5, dy + cs * 0.44, cs * 0.09, Math.PI, 0); ctx.stroke();
  }
  // 열쇠
  for (let i = 0; i < maze.keys.length; i++) if (!keyGot[i]) {
    const k = maze.keys[i]; drawKey(ox + ((k % maze.cols) + 0.5) * cs, oy + (((k / maze.cols) | 0) + 0.5) * cs, cs);
  }
  // 벽
  ctx.strokeStyle = "#7b4b22"; ctx.lineWidth = Math.max(3, cs * 0.12); ctx.lineCap = "round";
  ctx.beginPath();
  for (let y = 0; y < maze.rows; y++) for (let x = 0; x < maze.cols; x++) {
    const wl = maze.walls[y * maze.cols + x], px = ox + x * cs, py = oy + y * cs;
    if (wl & 1) { ctx.moveTo(px, py); ctx.lineTo(px + cs, py); }
    if (wl & 8) { ctx.moveTo(px, py); ctx.lineTo(px, py + cs); }
    if (x === maze.cols - 1 && (wl & 2)) { ctx.moveTo(px + cs, py); ctx.lineTo(px + cs, py + cs); }
    if (y === maze.rows - 1 && (wl & 4)) { ctx.moveTo(px, py + cs); ctx.lineTo(px + cs, py + cs); }
  }
  ctx.stroke();
  for (const a of antList) drawAnt(a, cs);
  const h = hamster;
  if (h.invuln <= 0 || Math.floor(h.invuln * 10) % 2 === 0) {
    const p = cellPx(h.fx, h.fy); drawHamster(p.x, p.y, cs * 0.34);
  }
}

function draw() {
  ctx.fillStyle = "#2a2118"; ctx.fillRect(0, 0, W, H);
  if (state === "title") { drawTitleScreen(); return; }
  computeLayout();
  beginShake();
  drawMaze();
  if (wipeT > 0) {
    const p = 1 - wipeT / 0.8, cs = L.cs, w = maze.cols * cs;
    ctx.fillStyle = "#5ec8f2";
    if (p < 0.5) ctx.fillRect(L.ox, L.oy, w * p * 2, maze.rows * cs);
    else ctx.fillRect(L.ox + w * (p - 0.5) * 2, L.oy, w * (1 - (p - 0.5) * 2), maze.rows * cs);
  }
  endShake();
  drawFx();
  drawButtons();
  drawHud();
  if (paused && state === "play") {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, W, H);
    textFit("잠깐 멈췄어요", W / 2, H / 2 - 20, W - 20, 28, "center", "bold");
    textFit("탭하거나 스페이스를 눌러 계속해요", W / 2, H / 2 + 20, W - 20, 16, "center", "bold", "#fcd34d");
  }
  if (state === "over") {
    ctx.fillStyle = "rgba(0,0,0,.62)"; ctx.fillRect(0, 0, W, H);
    textFit(overMsg, W / 2, H / 2 - 80, W - 20, 18, "center", "bold", "#bfe9ff");
    text("게임 끝", W / 2, H / 2 - 40, fitSize(32), "center", "bold");
    text(`점수 ${score} · 최고 ${best}`, W / 2, H / 2, fitSize(18));
    textFit("탭하거나 스페이스를 눌러 다시 하기", W / 2, H / 2 + 44, W - 20, 16, "center", "bold", "#f59e0b");
  }
}
function drawTitleScreen() {
  const cy = H / 2;
  drawHamster(W / 2 - 34, cy - 100, 26);
  drawKey(W / 2 + 34, cy - 100, 56);
  textFit("열쇠 찾아 노라라 미로", W / 2, cy - 40, W - 24, 32, "center", "bold");
  textFit("방향키·십자 버튼·스와이프로 움직여요", W / 2, cy, W - 20, 16);
  textFit("열쇠를 모아 문을 열어요 (150초)", W / 2, cy + 26, W - 20, 16, "center", "normal", "#bfe9ff");
  textFit("탭하거나 스페이스를 눌러 시작", W / 2, cy + 64, W - 20, 16, "center", "bold", "#f59e0b");
}

/* ===== 메인 루프 ===== */
function pauseGame() { if (state === "play" && !paused) { paused = true; for (const b of buttons) { b.down = false; b.pid = null; } keys.clear(); } }
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseGame(); });
window.addEventListener("blur", pauseGame);
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
