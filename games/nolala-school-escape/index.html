<script>
/* ===== 게임 SDK: 리더보드 + 멀티 (public/sdk.js와 같은 코드. 지우지 마세요) ===== */
/* 멀티 게임 쓰는 법은 games/README.md의 "멀티 게임"을 보세요 */
(function () {
  var sent = false;
  var standalone = window.parent === window; // 파일을 직접 열었을 때
  var listeners = { message: [], players: [], emote: [], error: [] };
  var room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
  var waiting = [];

  function post(msg) {
    if (!standalone) window.parent.postMessage(msg, "*");
  }
  function emit(name, a, b) {
    var list = listeners[name] || [];
    for (var i = 0; i < list.length; i++) {
      try { list[i](a, b); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }
  function settle(ok, value) {
    var list = waiting;
    waiting = [];
    for (var i = 0; i < list.length; i++) {
      clearTimeout(list[i].timer);
      ok ? list[i].resolve(value) : list[i].reject(new Error(value));
    }
  }

  window.addEventListener("message", function (event) {
    if (standalone || event.source !== window.parent) return; // 바깥 플레이 페이지에서 온 것만
    var m = event.data;
    if (!m || typeof m !== "object") return;
    if (m.type === "GAMESDK_MP_JOINED") {
      room = { joined: true, roomId: m.roomId, me: m.me, players: m.players || [], hostId: m.hostId, maxPlayers: m.maxPlayers };
      settle(true, { roomId: room.roomId, me: room.me, players: room.players, hostId: room.hostId, maxPlayers: room.maxPlayers });
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_PLAYERS") {
      room.players = m.players || [];
      room.hostId = m.hostId;
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_MESSAGE") {
      emit("message", m.data, m.from);
    } else if (m.type === "GAMESDK_MP_EMOTE") {
      emit("emote", m.key, m.from);
    } else if (m.type === "GAMESDK_MP_ERROR") {
      if (!room.joined) settle(false, m.message);
      emit("error", m.message);
    }
  });

  window.GameSDK = {
    submitScore: function (score) {
      if (sent) return; // 한 판에 한 번만
      if (typeof score !== "number" || !isFinite(score)) return;
      sent = true;
      post({ type: "GAMESDK_SCORE", score: score });
    },
    // 새 판을 시작할 때 부르면 다시 점수를 보낼 수 있어요.
    newRound: function () {
      sent = false;
      post({ type: "GAMESDK_NEW_ROUND" });
    },
    multi: {
      join: function () {
        return new Promise(function (resolve, reject) {
          if (standalone) return reject(new Error("사이트 밖에서는 멀티를 쓸 수 없어요"));
          var w = { resolve: resolve, reject: reject, timer: 0 };
          w.timer = setTimeout(function () {
            waiting = waiting.filter(function (x) { return x !== w; });
            reject(new Error("방에 들어가지 못했어요 (응답 없음)"));
          }, 8000);
          waiting.push(w);
          post({ type: "GAMESDK_MP_JOIN" });
        });
      },
      send: function (data) { if (room.joined) post({ type: "GAMESDK_MP_SEND", data: data }); },
      emote: function (key) { if (room.joined) post({ type: "GAMESDK_MP_EMOTE", key: key }); },
      lock: function (locked) { if (room.joined) post({ type: "GAMESDK_MP_LOCK", locked: locked !== false }); },
      leave: function () {
        if (!room.joined) return;
        room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
        post({ type: "GAMESDK_MP_LEAVE" });
      },
      on: function (name, fn) { if (listeners[name] && typeof fn === "function") listeners[name].push(fn); },
      me: function () { return room.me; },
      players: function () { return room.players.slice(); },
      hostId: function () { return room.hostId; },
      isHost: function () { return !!room.me && room.me.id === room.hostId; },
    },
  };
})();

/* ===== 화면 크기 (고해상도 화면 대응) ===== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 0; H = window.innerHeight || 0;
  canvas.width = Math.max(1, Math.round(W * DPR)); canvas.height = Math.max(1, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  doLayout();
}
window.addEventListener("resize", resize);

/* ===== 소리 (Web Audio로 직접 만들어요. 첫 입력 뒤에 켜져요) ===== */
let audio = null, muted = false, noiseBuf = null;
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === "suspended") audio.resume();
  if (audio && !noiseBuf) {
    try {
      noiseBuf = audio.createBuffer(1, Math.floor(audio.sampleRate * 0.5), audio.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { noiseBuf = null; }
  }
}
function tone(freq, dur, type, vol, delay, to) {
  if (!audio || muted) return;
  const t0 = audio.currentTime + (delay || 0);
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol, delay, freq, q) {
  if (!audio || muted || !noiseBuf) return;
  const t0 = audio.currentTime + (delay || 0);
  const s = audio.createBufferSource(); s.buffer = noiseBuf;
  const f = audio.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq || 1500; f.Q.value = q || 1;
  const g = audio.createGain();
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(audio.destination);
  s.start(t0); s.stop(t0 + dur + 0.02);
}
const BTN_F = [523, 659, 784, 988];
const sfx = {
  tok() { tone(760, 0.06, "sine", 0.14); },
  nav() { tone(1150, 0.03, "sine", 0.05); },
  ding() { tone(1320, 0.12, "sine", 0.12); tone(1760, 0.3, "sine", 0.12, 0.08); },
  pop() { tone(380, 0.16, "triangle", 0.13, 0, 1100); },
  whistle() { tone(2300, 0.42, "square", 0.03); tone(2390, 0.42, "sine", 0.06); tone(2300, 0.14, "sine", 0.05, 0.46); },
  boing() { tone(330, 0.16, "sine", 0.18, 0, 140); tone(300, 0.16, "sine", 0.14, 0.17, 130); },
  wrong() { tone(220, 0.1, "square", 0.07); tone(165, 0.18, "square", 0.07, 0.12); },
  clack() { noise(0.05, 0.35, 0, 3200, 2); tone(130, 0.07, "square", 0.08, 0.01); noise(0.06, 0.3, 0.08, 2000, 2); },
  dingdong() { tone(784, 0.55, "sine", 0.13); tone(659, 0.55, "sine", 0.13, 0.22); tone(523, 0.9, "sine", 0.13, 0.44); },
  click() { tone(1700, 0.03, "square", 0.04); },
  snap() { noise(0.04, 0.4, 0, 3500, 3); tone(95, 0.06, "square", 0.09); },
  tick() { tone(2100, 0.025, "square", 0.03); },
  whoosh() { noise(0.35, 0.16, 0, 700, 0.7); },
  screw() { for (let i = 0; i < 4; i++) noise(0.03, 0.25, i * 0.07, 2600, 4); },
  hint() { tone(988, 0.1, "triangle", 0.1); tone(1319, 0.18, "triangle", 0.1, 0.08); },
  btn(i) { tone(BTN_F[i], 0.14, "triangle", 0.12); },
  start() { tone(523, 0.1, "triangle", 0.1); tone(784, 0.16, "triangle", 0.1, 0.09); },
  fanfare() { tone(523, 0.14, "triangle", 0.12); tone(659, 0.14, "triangle", 0.12, 0.13); tone(784, 0.14, "triangle", 0.12, 0.26); tone(1047, 0.55, "triangle", 0.13, 0.39); },
  bell() { tone(659, 0.5, "sine", 0.13); tone(523, 0.5, "sine", 0.13, 0.42); tone(587, 0.5, "sine", 0.13, 0.84); tone(392, 1.0, "sine", 0.13, 1.26); },
};
function toggleMute() { muted = !muted; if (!muted) { unlockAudio(); sfx.tok(); } }

/* ===== 기본 도우미 ===== */
const TAU = Math.PI * 2;
const FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
const C = {
  cream: "#FFF4D6", brown: "#3B2A1A", yellow: "#FFD34D", brownMid: "#8B5A2B", slot: "#5A4330",
  mat: "#4A7BD0", wood: "#C98B4F", mint: "#D8F0E6", board: "#2F5D50", steel: "#B8C2CC", dark: "#1B2240",
  hero: "#F4A04B", heroDark: "#DC8836", belly: "#FFF1D6", pink: "#FFB3B3",
  door: "#8B5A2B", doorDark: "#5E3B1B", red: "#FF6B5B",
};
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function ri(n) { return Math.floor(Math.random() * n); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function range(n) { const a = []; for (let i = 0; i < n; i++) a.push(i); return a; }
function rrPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rr(x, y, w, h, r, fill, stroke, lw) {
  rrPath(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function circle(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, rot) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot || 0, 0, TAU);
  ctx.fillStyle = fill; ctx.fill();
}
function line(x1, y1, x2, y2, color, lw) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw || 2; ctx.stroke();
}
function setFont(size, weight) { ctx.font = (weight || "normal") + " " + size + "px " + FONT; }
function txt(s, x, y, size, color, align, weight) {
  setFont(size, weight);
  ctx.fillStyle = color; ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}
function inR(r, x, y) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
// 글자 줄바꿈 (결과를 기억해 두고 다시 써요)
const wrapCache = new Map();
function wrap(s, maxW, size, weight) {
  const key = s + "|" + Math.round(maxW) + "|" + size + "|" + weight;
  const got = wrapCache.get(key);
  if (got) return got;
  setFont(size, weight);
  const lines = [];
  const paras = s.split("\n");
  for (let p = 0; p < paras.length; p++) {
    const words = paras[p].split(" ");
    let cur = "";
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      const t = cur ? cur + " " + w : w;
      if (ctx.measureText(t).width <= maxW) { cur = t; continue; }
      if (cur) { lines.push(cur); cur = ""; }
      if (ctx.measureText(w).width <= maxW) { cur = w; continue; }
      for (const ch of w) {
        if (cur && ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; } else cur += ch;
      }
    }
    lines.push(cur);
  }
  if (wrapCache.size > 500) wrapCache.clear();
  wrapCache.set(key, lines);
  return lines;
}
function fmtTime(s) {
  s = Math.round(Math.max(0, s) * 10) / 10;
  const m = Math.floor(s / 60);
  const r = (s - m * 60).toFixed(1);
  return m > 0 ? m + "분 " + r + "초" : r + "초";
}
// 숫자로 끝나는 말 뒤 '이에요/예요'
function yo(d) { return d === 2 || d === 4 || d === 5 || d === 9 ? "예요" : "이에요"; }

/* ===== 레이아웃 =====
   장면은 360×360 논리 좌표 정사각형이고 화면에 맞춰 키워요.
   stack1: 위 HUD / 장면 / 아래 한 줄(말풍선 + 가방·힌트)  — PC
   stack2: 위 HUD / 장면 / 말풍선 / 가방·힌트          — 세로 휴대폰
   side  : 왼쪽 장면 / 오른쪽 HUD·말풍선·가방·힌트       — 가로 휴대폰 */
function R() { return { x: 0, y: 0, w: 0, h: 0 }; }
function setR(r, x, y, w, h) { r.x = x; r.y = y; r.w = w; r.h = h; }
const L = {
  ok: false, ver: 0, mode: "stack2", pad: 8, S: 360, sc: 1, sx: 0, sy: 0,
  hud: R(), row: R(), bubble: R(), bag: R(), slots: [R(), R(), R()], hint: R(), mute: R(),
  faceX: 0, faceY: 0, faceR: 20, hudFont: 16, clockFont: 22,
};
function bagWidth(bh) { const slot = Math.min(bh - 12, 72); return 12 + 3 * (slot + 8) + Math.max(slot * 1.4, 76); }
function setScene(x, y, S) { L.sx = Math.round(x); L.sy = Math.round(y); L.S = S; L.sc = S / 360; }
function doLayout() {
  L.ver++;
  L.ok = W >= 100 && H >= 100;
  if (!L.ok) return;
  const pad = clamp(Math.min(W, H) * 0.014, 4, 12);
  L.pad = pad;
  const hudH = W >= 700 && H >= 560 ? 54 : 48;
  const oneRow = W >= 600;
  const rowH = H >= 560 ? 80 : 68;
  let bubbleH = 54, bagH = 62;
  const stackS = oneRow ? Math.min(W - 2 * pad, H - hudH - rowH - 4 * pad)
                        : Math.min(W - 2 * pad, H - hudH - bubbleH - bagH - 5 * pad);
  const sideS = Math.min(H - 2 * pad, W - 280 - 3 * pad);
  if (W >= H && stackS < 360 && sideS > stackS) {
    L.mode = "side";
    const S = Math.floor(sideS);
    const pw = Math.min(W - S - 3 * pad, 440);
    const gx = (W - (S + pad + pw)) / 2, gy = (H - S) / 2;
    setScene(gx, gy, S);
    const px = gx + S + pad;
    setR(L.hud, px, gy, pw, hudH);
    const bh = clamp(S * 0.2, 62, 76);
    setR(L.bag, px, gy + S - bh, pw, bh);
    const top = gy + hudH + pad, bot = gy + S - bh - pad;
    const bH = Math.min(bot - top, 140);
    setR(L.row, px, top + (bot - top - bH) / 2, pw, bH);
  } else if (oneRow) {
    L.mode = "stack1";
    const S = Math.floor(Math.max(stackS, 60));
    const cw = Math.min(W - 2 * pad, Math.max(S, 720));
    const gh = hudH + S + rowH + 2 * pad;
    const gy = Math.max(pad, (H - gh) / 2), gx = (W - cw) / 2;
    setR(L.hud, gx, gy, cw, hudH);
    setScene((W - S) / 2, gy + hudH + pad, S);
    const ry = gy + hudH + pad + S + pad;
    const bw = bagWidth(rowH);
    setR(L.bag, gx + cw - bw, ry, bw, rowH);
    setR(L.row, gx, ry, cw - bw - pad, rowH);
  } else {
    L.mode = "stack2";
    const S = Math.floor(Math.max(stackS, 60));
    let extra = H - hudH - bubbleH - bagH - 5 * pad - S;
    if (extra > 0) {
      const g1 = Math.min(extra * 0.4, 40); bubbleH += g1; extra -= g1;
      const g2 = Math.min(extra * 0.3, 14); bagH += g2;
    }
    const cw = Math.min(W - 2 * pad, 560);
    const gh = hudH + S + bubbleH + bagH + 3 * pad;
    const gy = Math.max(pad, (H - gh) / 2), gx = (W - cw) / 2;
    setR(L.hud, gx, gy, cw, hudH);
    setScene((W - S) / 2, gy + hudH + pad, S);
    setR(L.row, gx, gy + hudH + pad + S + pad, cw, bubbleH);
    setR(L.bag, gx, L.row.y + bubbleH + pad, cw, bagH);
  }
  setR(L.mute, L.hud.x + L.hud.w - L.hud.h, L.hud.y, L.hud.h, L.hud.h);
  const r = L.row;
  L.faceR = clamp(Math.min(r.h * 0.4, r.w * 0.09), 18, 34);
  L.faceX = r.x + L.faceR + 2; L.faceY = r.y + r.h / 2;
  const bx = L.faceX + L.faceR + 12;
  setR(L.bubble, bx, r.y, r.x + r.w - bx, r.h);
  const b = L.bag, bi = 6;
  const slot = Math.min(b.h - 12, 72);
  const sy = b.y + (b.h - slot) / 2;
  for (let i = 0; i < 3; i++) setR(L.slots[i], b.x + bi + i * (slot + 8), sy, slot, slot);
  const hw = Math.max(slot * 1.4, 76);
  setR(L.hint, b.x + b.w - bi - hw, sy, hw, slot);
  L.hudFont = L.hud.w < 360 ? 15 : 17;
  L.clockFont = L.hud.w < 360 ? 20 : 24;
}
// 장면 안 글자 크기: 실제 화면에서 14px(숫자는 18px) 아래로 내려가지 않게 해요
function lf(n) { return Math.max(n, 14.5 / L.sc); }
function nf(n) { return Math.max(n, 18.5 / L.sc); }
function scrX(lx) { return L.sx + lx * L.sc; }
function scrY(ly) { return L.sy + ly * L.sc; }

/* ===== 판 데이터 (판마다 새로 정해요) ===== */
const TOTAL = 210; // 5교시 종까지 3분 30초
const BALL_COLORS = ["#E5484D", "#3D7BE0", "#F5C518"];
const BALL_NAMES = ["빨강", "파랑", "노랑"];
const BK_COLORS = ["#E5484D", "#3D7BE0", "#F5C518", "#3FAF5F"];
const BK_NAMES = ["빨강", "파랑", "노랑", "초록"];
const BK_SHAPES = ["●", "▲", "■", "★"];
const DISHES = ["김밥", "계란말이", "떡볶이", "미역국", "사과", "우유"];
const DISH_DOT = ["#2B3A2F", "#FFD84D", "#E5484D", "#3E8E5A", "#E5484D", "#FFFFFF"];
const COIN_SPOTS = ["apron", "spoon", "milk"];
const COIN_PLACE = { apron: "앞치마 주머니", spoon: "수저통", milk: "우유 상자" };
const LEVEL_SLOTS = [0.15, 0.34, 0.535, 0.725, 0.92];
function makePuzzle() {
  // 방 1: 공 개수(색마다 1~6, 서로 다름)와 쪽지 색 순서
  const nums = shuffle([1, 2, 3, 4, 5, 6]);
  const counts = [nums[0], nums[1], nums[2]];
  const order = shuffle([0, 1, 2]);
  const code1 = [counts[order[0]], counts[order[1]], counts[order[2]]];
  const balls = []; for (let i = 0; i < 18; i++) balls.push(-1);
  const cells = shuffle(range(18));
  let k = 0;
  for (let c = 0; c < 3; c++) for (let i = 0; i < counts[c]; i++) balls[cells[k++]] = c;
  const jx = [], jy = [];
  for (let i = 0; i < 18; i++) { jx.push(Math.random() * 8 - 4); jy.push(Math.random() * 8 - 4); }
  // 방 2: 비커 물 높이(서로 15% 넘게 차이), 선반 자리, 칠판 규칙, 서랍 버튼 자리
  const ls = shuffle(range(5));
  const levels = [];
  for (let c = 0; c < 4; c++) levels.push(LEVEL_SLOTS[ls[c]] + (Math.random() * 0.03 - 0.015));
  const shelf = shuffle([0, 1, 2, 3]);
  const many = Math.random() < 0.5;
  const drawerOrder = [0, 1, 2, 3].sort((a, b) => (many ? levels[b] - levels[a] : levels[a] - levels[b]));
  const drawerBtns = shuffle([0, 1, 2, 3]);
  // 방 3: 동전 자리, 배식대 칸(반찬·숫자표), 식단표
  const coinAt = COIN_SPOTS[ri(3)];
  const trays = shuffle(range(6));
  const tags = shuffle(range(10)).slice(0, 6);
  const menu = shuffle(range(6)).slice(0, 4);
  let code3 = "";
  for (let i = 0; i < 4; i++) code3 += tags[trays.indexOf(menu[i])];
  return { counts, order, code1, balls, jx, jy, levels, shelf, many, drawerOrder, drawerBtns, coinAt, trays, tags, menu, code3 };
}

/* ===== 효과 (파티클·점수 팝업·날아가는 물건) — 미리 만들어 둔 것만 다시 써요 ===== */
const PARTS = []; for (let i = 0; i < 80; i++) PARTS.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 4, color: "#fff", star: false });
const POPS = []; for (let i = 0; i < 8; i++) POPS.push({ on: false, x: 0, y: 0, t: 0, s: "", color: "#fff", size: 18, vy: -40 });
const FLY = []; for (let i = 0; i < 3; i++) FLY.push({ on: false, type: "", slot: 0, sx: 0, sy: 0, t: 0 });
function burst(x, y, n, color, star, speed) {
  const k = clamp(L.sc, 0.8, 1.6);
  for (let i = 0; i < PARTS.length && n > 0; i++) {
    const p = PARTS[i];
    if (p.on) continue;
    n--;
    const a = Math.random() * TAU, s = speed * (0.5 + Math.random() * 0.7) * k;
    p.on = true; p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s - speed * 0.4 * k;
    p.life = 0; p.max = 0.55 + Math.random() * 0.35; p.size = (star ? 7 : 4) * k * (0.8 + Math.random() * 0.5);
    p.color = color; p.star = star;
  }
}
function popup(s, x, y, color, size, vy) {
  for (let i = 0; i < POPS.length; i++) {
    const p = POPS[i];
    if (p.on) continue;
    p.on = true; p.s = s; p.x = x; p.y = y; p.t = 0; p.color = color || C.yellow; p.size = size || 20; p.vy = vy || -40;
    return;
  }
}
function flyingSlot(i) { for (let k = 0; k < FLY.length; k++) if (FLY[k].on && FLY[k].slot === i) return true; return false; }
function give(type, lx, ly) {
  let slot = -1;
  for (let i = 0; i < 3; i++) if (!G.bag[i]) { slot = i; break; }
  if (slot < 0) slot = 2;
  G.bag[slot] = type;
  const sx = scrX(lx), sy = scrY(ly);
  for (let k = 0; k < FLY.length; k++) {
    const f = FLY[k];
    if (f.on) continue;
    f.on = true; f.type = type; f.slot = slot; f.sx = sx; f.sy = sy; f.t = 0;
    break;
  }
  burst(sx, sy, 8, C.yellow, true, 140);
  sfx.ding(); sfx.pop();
}
function removeItem(type) { for (let i = 0; i < 3; i++) if (G.bag[i] === type) G.bag[i] = null; }
function clearFX() {
  for (const p of PARTS) p.on = false;

/* ===== 진행 단계와 힌트 ===== */
function stageKey() {

  if (G.room === 1) return G.keyGot ? "r2d" : !G.boardSeen ? "r2a" : !G.beakersSeen ? "r2b" : "r2c";
  if (!G.coinGot && !G.boxOpen) return "r3a";
  if (!G.boxOpen) return "r3b";

}
function drawerAnswer() {
  let s = "서랍 순서: ";
  for (let i = 0; i < 4; i++) { const c = P.drawerOrder[i]; s += (i ? " → " : "") + BK_SHAPES[c] + BK_NAMES[c]; }

}
function hintText(key, lv) {
  const c1 = P.code1.join(" ");
  const a1 = "정답은 " + c1 + yo(P.code1[2]) + ". 문 자물쇠에 맞춰요.";
  const a3 = "도어락 번호는 " + P.code3 + yo(+P.code3[3]) + ".";
  switch (key) {

    case "r1b": return lv < 2 ? "공 바구니 속 공을 색깔별로 세어 봐요." : a1;
    case "r1c": return lv < 2 ? "쪽지 순서대로 공 개수를 자물쇠에 맞춰요." : a1;
    case "r2a": return lv < 2 ? "칠판에 서랍 여는 방법이 적혀 있어요." : drawerAnswer();
    case "r2b": return lv < 2 ? "선반 위 비커의 물 높이를 비교해 봐요." : drawerAnswer();
    case "r2c": return lv < 2 ? "칠판 규칙대로 비커 색 순서로 서랍 버튼을 눌러요." : drawerAnswer();
    case "r2d": return lv < 2 ? "열쇠를 얻었어요! 열쇠 구멍이 있는 문을 눌러요." : "오른쪽 문을 누르면 열쇠가 저절로 써져요.";
    case "r3a": return lv < 2 ? "벽의 회색 상자를 열 납작한 물건을 찾아봐요." : "동전은 " + COIN_PLACE[P.coinAt] + "에 있어요.";
    case "r3b": return lv < 2 ? "동전으로 벽의 회색 분전함 나사를 돌려 봐요." : "위쪽 벽의 회색 분전함을 눌러요.";
    case "r3c": return lv < 2 ? "분전함 속 큰 스위치를 올려 봐요." : "분전함을 눌러 손잡이를 위로 올려요.";
    case "r3d": return lv < 2 ? "식단표 반찬을 배식대 번호표에서 찾아봐요." : a3 + " 식단표 순서예요.";
    default: return lv < 2 ? "식단표 순서대로 반찬 번호를 도어락에 넣어요." : a3;

}
// 같은 정답을 쓰는 단계끼리 묶어요 (방 1: 쪽지·공 → 다이얼 번호, 방 2: 칠판·비커 → 서랍 순서, 방 3: 식단표·배식대 → 도어락 번호)
function answerGroup(key) {
  if (key === "r1b" || key === "r1c") return "a1";
  if (key === "r2a" || key === "r2b" || key === "r2c") return "a2";
  if (key === "r3d" || key === "r3e") return "a3";
  return key;
}
function useHint() {
  if (state !== "play" || G.busy || trans) return;
  const key = stageKey(), grp = answerGroup(key);
  // 이미 본 정답과 같은 정답은 단계가 바뀌어도 다시 보여주기만 하고 시간을 빼지 않아요
  if (G.shown[grp]) { G.hintStage = key; G.hintLevel = 2; say(hintText(key, 2)); sfx.tok(); return; }
  if (G.hintStage !== key) { G.hintStage = key; G.hintLevel = 0; }
  G.hintLevel++;
  if (G.hintLevel >= 2) G.shown[grp] = true;
  G.hints++;
  G.timeLeft -= 10;
  G.lastProgress = elapsed();
  say(hintText(key, G.hintLevel));
  sfx.hint();
  popup("-10초", L.mute.x - 40, L.hud.y + L.hud.h + 16, C.red, 18, 30);
  burst(L.hint.x + L.hint.w / 2, L.hint.y + L.hint.h / 2, 6, C.yellow, true, 90);
  if (G.timeLeft <= 0) { G.timeLeft = 0; finishFail(); }
}

/* ===== 확대 화면·자물쇠 화면 ===== */
const OV_TITLE = { note: "쪽지", balls: "공 바구니", dial: "숫자 자물쇠", board: "칠판", beakers: "비커 선반", drawer: "서랍 자물쇠", breaker: "분전함", menu: "식단표", counter: "배식대", keypad: "" };
function openOverlay(type) {
  if (!ov) { sK = fK; sRef = fRef; sIdx = fIdx; }
  ov = { type, t: 0, shake: 0, done: false, doneT: 0, flash: -1, flashT: 9 };

  if (type === "drawer") G.drawerSeq.length = 0;

  if (type === "board") G.boardSeen = true;
  if (type === "beakers") G.beakersSeen = true;
  if (type === "menu") G.menuSeen = true;

}
function closeOverlay() {

function wrongLock() {
  if (ov) { ov.shake = 0.25; }

function lockOK(lx, ly) {

}
function checkDial(typed) {
  const d = G.dial, c = P.code1;
  if (d[0] === c[0] && d[1] === c[1] && d[2] === c[2]) {
    lockOK(180, 96);
    say("철컥! 자물쇠가 열렸어요!", 1);
    later(0.8, () => { closeOverlay(); openDoorSeq(); });
  } else if (typed && G.dialPos === 0) wrongLock();
}
function drawerPress(i) {
  if (G.drawerOpen) return;
  const color = P.drawerBtns[i];
  G.drawerSeq.push(color);
  ov.flash = i; ov.flashT = 0;
  sfx.btn(i);
  burst(scrX(180 + (i - 1.5) * 82), scrY(206), 4, BK_COLORS[color], false, 90);
  if (G.drawerSeq.length < 4) return;
  let ok = true;
  for (let k = 0; k < 4; k++) if (G.drawerSeq[k] !== P.drawerOrder[k]) ok = false;
  if (ok) {

    lockOK(180, 124);
    say("서랍이 열렸어요! 안에 열쇠가 있어요.", 1);

  } else {
    G.drawerSeq.length = 0;

}
function keypadPress(d) {
  if (G.pad.length >= 4) return;
  G.pad += d;
  sfx.click();
  if (G.pad.length < 4) return;
  if (G.pad === P.code3) {
    G.stopped = true; // 시계를 멈춰요. 기록 = 3:30 − 남은 시간

function flipSwitch() {
  if (G.power) { say("불이 켜져 있어요."); return; }
  G.power = true; G.lightT = 0; G.busy = true;
  sfx.snap();
  ov.done = true; ov.doneT = 0;
  burst(scrX(180), scrY(150), 12, "#FFF2A8", true, 150);
  mood = 1; moodT = 1.8;
  say("딸깍! 불이 켜졌어요. 도어락도 켜졌어요!", 1);
  later(0.55, () => { closeOverlay(); G.busy = false; });
}
function lockDigit(d) {
  if (!ov || G.busy || G.block > 0) return;
  if (ov.type === "dial") {
    const c = G.dialPos;
    G.dial[c] = d; ov.flash = 3 + c; ov.flashT = 0;
    G.dialPos = (c + 1) % 3;
    sfx.click();
    checkDial(true);
  } else if (ov.type === "keypad") {
    ov.flash = d === 0 ? 10 : d - 1; ov.flashT = 0;
    keypadPress(d);
  } else if (ov.type === "drawer" && d >= 1 && d <= 4) drawerPress(d - 1);
}
function lockBack() {
  if (!ov || G.busy || G.block > 0) return;
  if (ov.type === "dial") {
    G.dialPos = (G.dialPos + 2) % 3; G.dial[G.dialPos] = 0; sfx.click();
  } else if (ov.type === "keypad") {
    if (G.pad.length) { G.pad = G.pad.slice(0, -1); sfx.click(); }
    ov.flash = 9; ov.flashT = 0;
  }
}
function ovButton(i) {
  if (!ov || G.busy) return;
  const lock = ov.type === "dial" || ov.type === "keypad" || ov.type === "drawer";
  if (lock && G.block > 0) { tone(150, 0.06, "square", 0.04); return; }
  switch (ov.type) {
    case "dial": {
      const c = i % 3;
      G.dial[c] = (G.dial[c] + (i < 3 ? 1 : 9)) % 10;
      ov.flash = i; ov.flashT = 0;
      sfx.click();
      checkDial(false);
      break;
    }
    case "drawer": drawerPress(i); break;
    case "keypad":
      ov.flash = i; ov.flashT = 0;
      if (i < 9) keypadPress(i + 1); else if (i === 9) lockBack(); else if (i === 10) keypadPress(0);
      break;
    case "breaker": flipSwitch(); break;
  }
}

/* ===== 누를 곳 목록 (매 프레임 다시 채워요. 새 객체는 만들지 않아요) ===== */
const K_OBJ = 1, K_BAG = 2, K_HINT = 3, K_MUTE = 4, K_CLOSE = 5, K_BTN = 6;
const TG = []; for (let i = 0; i < 40; i++) TG.push({ kind: 0, ref: null, idx: 0, x: 0, y: 0, w: 0, h: 0 });
let nTG = 0;
function addT(kind, ref, idx, x, y, w, h) {
  if (nTG >= TG.length) return;
  const t = TG[nTG++];
  t.kind = kind; t.ref = ref; t.idx = idx; t.x = x; t.y = y; t.w = w; t.h = h;
}
function addTL(kind, ref, idx, lx, ly, lw, lh) { addT(kind, ref, idx, scrX(lx), scrY(ly), lw * L.sc, lh * L.sc); }
function addR(kind, idx, r) { addT(kind, null, idx, r.x, r.y, r.w, r.h); }
function buildTargets() {
  nTG = 0;
  if (!L.ok || state !== "play") return;
  if (ov) {
    const t = ov.type;
    if (t === "dial") {
      for (let i = 0; i < 3; i++) addTL(K_BTN, null, i, 62 + i * 86, 110, 64, 60);
      for (let i = 0; i < 3; i++) addTL(K_BTN, null, 3 + i, 62 + i * 86, 240, 64, 60);
    } else if (t === "drawer") {
      for (let i = 0; i < 4; i++) addTL(K_BTN, null, i, 180 + (i - 1.5) * 82 - 38, 168, 76, 76);
    } else if (t === "keypad") {
      for (let i = 0; i < 11; i++) addTL(K_BTN, null, i, 34 + (i % 3) * 100, 76 + Math.floor(i / 3) * 70, 92, 64);
    } else if (t === "breaker") {
      addTL(K_BTN, null, 0, 110, 92, 140, 226);
    }
    addTL(K_CLOSE, null, 0, 288, 8, 62, 62);
  } else if (!trans) {
    const objs = ROOMS[G.room].objs;
    for (let i = 0; i < objs.length; i++) { const o = objs[i]; addTL(K_OBJ, o, 0, o.x, o.y, o.w, o.h); }
  }
  for (let i = 0; i < 3; i++) if (G.bag[i] && !flyingSlot(i)) addR(K_BAG, i, L.slots[i]);
  addR(K_HINT, 0, L.hint);
  addR(K_MUTE, 0, L.mute);
}
function sameT(t, k, ref, idx) {
  if (t.kind !== k) return false;

}
function findT(k, ref, idx) { for (let i = 0; i < nTG; i++) if (sameT(TG[i], k, ref, idx)) return i; return -1; }
function setFocus(t) { fK = t.kind; fRef = t.ref; fIdx = t.idx; }
function navOK(t) { return ov ? t.kind === K_CLOSE || t.kind === K_BTN : true; }
function focusDefault() {
  buildTargets();
  let bi = -1, bd = 1e9;
  const cx = L.sx + L.S / 2, cy = L.sy + L.S / 2;
  for (let i = 0; i < nTG; i++) {
    const t = TG[i];
    if (ov ? t.kind !== K_BTN : t.kind !== K_OBJ) continue;
    const d = ov ? i : Math.hypot(t.x + t.w / 2 - cx, t.y + t.h / 2 - cy);
    if (d < bd) { bd = d; bi = i; }
  }
  if (bi < 0) for (let i = 0; i < nTG; i++) if (navOK(TG[i])) { bi = i; break; }
  if (bi >= 0) setFocus(TG[bi]); else { fK = 0; fRef = null; }
}
function nav(dx, dy) {
  buildTargets();
  const wasHidden = !kbVisible;
  kbVisible = true;
  const cur = findT(fK, fRef, fIdx);
  if (cur < 0 || !navOK(TG[cur]) || wasHidden) { if (cur < 0 || !navOK(TG[cur])) focusDefault(); sfx.nav(); return; }
  const c = TG[cur], cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  let bi = -1, bs = 1e9;
  for (let i = 0; i < nTG; i++) {
    if (i === cur) continue;
    const t = TG[i];
    if (!navOK(t)) continue;
    const vx = t.x + t.w / 2 - cx, vy = t.y + t.h / 2 - cy;
    const along = vx * dx + vy * dy;

    const perp = Math.abs(vx * dy - vy * dx);

}
function inPanel(x, y) { return x >= scrX(6) && x <= scrX(354) && y >= scrY(6) && y <= scrY(354); }
function activate(t) {
  switch (t.kind) {
    case K_OBJ: pressObj(t.ref); break;
    case K_BAG: pressBag(t.idx); break;
    case K_HINT: useHint(); break;
    case K_MUTE: toggleMute(); break;
    case K_CLOSE: if (ov && !G.busy) { closeOverlay(); sfx.tok(); } break;
    case K_BTN: ovButton(t.idx); break;
  }
}

/* ===== 입력 (키보드 + 터치/마우스) ===== */
window.addEventListener("keydown", (e) => {
  const k = e.key || "", code = e.code || "";
  if (k === " " || code === "Space" || k.indexOf("Arrow") === 0 || k === "Backspace" || k === "Enter") e.preventDefault();
  unlockAudio();
  if (code === "KeyM" || k === "m" || k === "M") { if (!e.repeat) toggleMute(); return; }
  const act = k === " " || code === "Space" || k === "Enter" || code === "NumpadEnter";
  if (state === "title") { if (act && !e.repeat) startGame(); return; }
  if (state === "over") { if (act && !e.repeat && overT > 1) startGame(); return; }
  let dx = 0, dy = 0;
  if (k === "ArrowUp" || code === "KeyW") dy = -1;
  else if (k === "ArrowDown" || code === "KeyS") dy = 1;
  else if (k === "ArrowLeft" || code === "KeyA") dx = -1;
  else if (k === "ArrowRight" || code === "KeyD") dx = 1;
  if (dx || dy) { nav(dx, dy); return; }
  if (e.repeat) return;
  if (act) {
    buildTargets();
    const i = findT(fK, fRef, fIdx);
    if (i < 0 || !navOK(TG[i])) { kbVisible = true; focusDefault(); return; }
    if (!kbVisible) { kbVisible = true; return; }
    activate(TG[i]);
    return;
  }
  if (k === "Escape") { if (ov && !G.busy) { closeOverlay(); sfx.tok(); } return; }
  if (code === "KeyH" || k === "h" || k === "H") { useHint(); return; }
  if (k === "Backspace") { lockBack(); return; }
  let d = -1;
  if (code.length === 6 && code.indexOf("Digit") === 0) d = code.charCodeAt(5) - 48;
  else if (code.length === 7 && code.indexOf("Numpad") === 0) d = code.charCodeAt(6) - 48;
  else if (k.length === 1 && k >= "0" && k <= "9") d = k.charCodeAt(0) - 48;
  if (d >= 0 && d <= 9) lockDigit(d);
});
// preventDefault를 부르지 않아요: 사이트 iframe 안에서 클릭할 때 키보드 포커스가 게임으로 넘어와야 해요
canvas.addEventListener("pointerdown", (e) => {
  unlockAudio();
  if (!L.ok) return;
  const x = e.clientX, y = e.clientY;
  if (inR(L.mute, x, y)) { toggleMute(); return; }
  if (state === "title") { startGame(); return; }
  if (state === "over") { if (overT > 1) startGame(); return; }
  buildTargets();
  const i = hitTarget(x, y);
  if (i >= 0) { const t = TG[i]; setFocus(t); activate(t); return; }
  if (ov && !G.busy && !inPanel(x, y)) { closeOverlay(); sfx.tok(); }
});
canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  buildTargets();
  const i = hitTarget(e.clientX, e.clientY);

// 화면이 가려지면 시계를 멈추고, 다시 보이면 가려져 있던 시간은 빼고 이어 가요

/* ===== 진행 (매 프레임) =====
   dt  : 애니메이션용 (한 프레임 최대 0.05초)
   cdt : 시계·기록용 실제 경과 시간 (한 프레임 최대 1초). 느린 기기에서도 시계가 실제 시간대로 가요 */
function update(dt, cdt) {
  animT += dt;
  updFX(dt);
  if (state === "over") { overT += dt; return; }
  if (state !== "play") return;
  if (!hidden && !G.stopped) {
    G.timeLeft -= cdt;
    if (G.timeLeft < 60 && G.timeLeft > 0) {
      tickAcc += cdt;
      if (tickAcc >= (G.timeLeft < 20 ? 0.5 : 1)) { tickAcc = 0; sfx.tick(); }
    }
    if (G.timeLeft <= 0) { G.timeLeft = 0; finishFail(); return; }
  }
  G.roomT += dt;
  for (let i = 0; i < timers.length;) {
    const tm = timers[i];
    tm.t -= dt;
    if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); if (state !== "play") return; }
    else i++;
  }
  const objs = ROOMS[G.room].objs;
  for (let i = 0; i < objs.length; i++) { objs[i].pt += dt; objs[i].at += dt; }
  if (ov) { ov.t += dt; ov.flashT += dt; if (ov.shake > 0) ov.shake = Math.max(0, ov.shake - dt); if (ov.done) ov.doneT += dt; }
  if (G.block > 0) G.block = Math.max(0, G.block - dt);
  if (trans) { trans.t += dt; if (trans.t >= 0.5) endSlide(); }
  if (G.power) G.lightT += dt;
  const sk = stageKey();
  if (sk !== G.lastStage) { G.lastStage = sk; G.lastProgress = elapsed(); }
}
function updFX(dt) {
  for (let i = 0; i < PARTS.length; i++) {
    const p = PARTS[i];
    if (!p.on) continue;
    p.life += dt;
    if (p.life >= p.max) { p.on = false; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.vx *= 0.98;
  }
  for (let i = 0; i < POPS.length; i++) { const p = POPS[i]; if (!p.on) continue; p.t += dt; if (p.t > 0.9) p.on = false; }
  for (let i = 0; i < FLY.length; i++) { const f = FLY[i]; if (!f.on) continue; f.t += dt; if (f.t >= 0.6) f.on = false; }
  if (flashA > 0) flashA = Math.max(0, flashA - dt * 2.2);
  if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
  if (moodT > 0) { moodT -= dt; if (moodT <= 0) mood = 0; }
  msgT += dt;
}

/* ===== 그리기 도우미 ===== */
function pressScale(o) {
  const t = o.pt;
  if (t >= 0.15) return 1;
  if (t < 0.05) return 1 - 0.1 * (t / 0.05);

  ctx.globalAlpha = 1;
}

    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r * 1.08;
      const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;

}
function drawCursor() {
  if (state !== "play" || G.busy || trans) return;
  buildTargets();
  const hi = hK ? findT(hK, hRef, hIdx) : -1;
  const fi = kbVisible && fK ? findT(fK, fRef, fIdx) : -1;
  if (hi >= 0 && hi !== fi) drawSel(TG[hi], false);
  // 확대 화면 속 버튼은 테두리만 (▼ 표시가 숫자 칸을 가리지 않게)
  if (fi >= 0 && navOK(TG[fi])) drawSel(TG[fi], TG[fi].kind !== K_BTN && TG[fi].kind !== K_CLOSE);
}
function drawFX() {
  for (let i = 0; i < PARTS.length; i++) {
    const p = PARTS[i];
    if (!p.on) continue;
    const a = 1 - p.life / p.max;
    if (p.star) sparkle(p.x, p.y, p.size, a);
    else { ctx.globalAlpha = a; circle(p.x, p.y, p.size, p.color); ctx.globalAlpha = 1; }
  }
  for (let i = 0; i < FLY.length; i++) {
    const f = FLY[i];
    if (!f.on) continue;
    const s = L.slots[f.slot], ex = s.x + s.w / 2, ey = s.y + s.h / 2;
    const t = f.t / 0.6, e = t * t * (3 - 2 * t);
    const x = f.sx + (ex - f.sx) * e, y = f.sy + (ey - f.sy) * e - Math.sin(t * Math.PI) * 90;
    drawItem(f.type, x, y, s.w * (0.9 - 0.28 * t));
  }
  for (let i = 0; i < POPS.length; i++) {
    const p = POPS[i];
    if (!p.on) continue;
    const a = p.t < 0.6 ? 1 : 1 - (p.t - 0.6) / 0.3;
    ctx.globalAlpha = Math.max(0, a);
    const y = p.y + p.t * p.vy;
    setFont(p.size, "bold"); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 4; ctx.strokeStyle = C.brown; ctx.strokeText(p.s, p.x, y);
    ctx.fillStyle = p.color; ctx.fillText(p.s, p.x, y);
    ctx.globalAlpha = 1;
  }
}

/* ===== 시작·끝 화면 ===== */
function cardLine(s, size, weight, color, gap) { return { s, size, weight, color, gap: gap || 6 }; }
let titleLines = null, titleVer = -1;
function getTitleLines() {
  if (titleLines && titleVer === L.ver) return titleLines;
  titleVer = L.ver;
  const k = clamp(Math.min(W, H * 1.2) / 480, 0.8, 1.25);
  titleLines = [
    { face: true, size: Math.round(30 * k), gap: 10 },
    cardLine("종 치기 전에!", Math.round(22 * k), "bold", "#B5651D", 2),
    cardLine("노라라 학교 탈출", Math.round(32 * k), "bold", C.brown, 12),
    cardLine("체육 창고에 갇힌 햄스터 도토리를 도와 5교시 종(3분 30초)이 치기 전에 세 방을 빠져나가요.", 15, "normal", C.brown, 10),
    cardLine("물건을 탭하거나, 방향키로 고르고 스페이스로 눌러요", 15, "bold", "#8B5A2B", 14),
    cardLine("탭하거나 스페이스를 눌러 시작", 18, "bold", "#D9480F", 6),
  ];
  return titleLines;
}
function buildOverLines() {
  const r = result;
  const lines = [];
  if (r.ok) {
    lines.push(cardLine("탈출 성공!", 30, "bold", "#2E7D32", 4));
    lines.push(cardLine("5교시 종 치기 전에 교실에 도착했어요", 15, "normal", C.brown, 10));
    lines.push(cardLine("기록 " + fmtTime(r.rec), 26, "bold", "#B5371F", 4));
    lines.push(cardLine(r.isBest ? "새 최고 기록이에요!" : "최고 기록 " + fmtTime(best), 16, "bold", r.isBest ? "#D9480F" : C.brown, 10));
    // 방 이름과 시간은 줄이 바뀌어도 떨어지지 않게 붙임 공백( )으로 이어요
    const nb = (s) => s.replace(/ /g, " ");
    lines.push(cardLine(nb("체육 창고 " + fmtTime(r.times[0])) + " · " + nb("과학실 " + fmtTime(r.times[1])) + " · " + nb("급식실 " + fmtTime(r.times[2])), 15, "normal", C.brown, 4));
    lines.push(cardLine(r.hints ? "힌트 " + r.hints + "번 (+" + r.hints * 10 + "초)" : "힌트 없이 탈출했어요", 15, "normal", C.brown, 10));
  } else {
    lines.push(cardLine("딩동댕… 종이 울렸어요", 26, "bold", "#B5371F", 6));
    lines.push(cardLine(ROOM_TAG[r.room] + " " + ROOMS[r.room].name + "까지 왔어요", 17, "bold", C.brown, 4));
    lines.push(cardLine(r.hints ? "힌트 " + r.hints + "번 썼어요" : "힌트는 안 썼어요", 15, "normal", C.brown, 4));
    lines.push(cardLine(best ? "최고 기록 " + fmtTime(best) : "아직 탈출 기록이 없어요", 15, "normal", C.brown, 10));
  }
  lines.push(cardLine("다시 하면 번호와 순서가 바뀌어요", 15, "normal", "#7A5634", 12));
  lines.push(cardLine("탭하거나 스페이스를 눌러 다시 하기", 17, "bold", "#D9480F", 6));
  overLines = lines;
}
function drawCard(lines, promptIdx) {
  const cw = Math.min(W - 2 * L.pad - 8, 460), maxW = cw - 36;
  let h = 32;
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (ln.face) h += ln.size * 2.2 + ln.gap;
    else h += wrap(ln.s, maxW, ln.size, ln.weight).length * Math.round(ln.size * 1.3) + ln.gap;
  }
  const x = (W - cw) / 2;
  let y = Math.max(L.pad, (H - h) / 2);
  rr(x, y, cw, h, 18, C.cream, C.brown, 4);
  y += 16;
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (ln.face) { drawFace(W / 2, y + ln.size * 1.15, ln.size, 1); y += ln.size * 2.2 + ln.gap; continue; }
    const ls = wrap(ln.s, maxW, ln.size, ln.weight), lh = Math.round(ln.size * 1.3);
    let a = 1;
    if (i === promptIdx) a = state === "over" && overT < 1 ? 0.3 : 0.65 + 0.35 * Math.sin(animT * 4);
    ctx.globalAlpha = a;
    for (let j = 0; j < ls.length; j++) txt(ls[j], W / 2, y + lh / 2 + j * lh, ln.size, ln.color, "center", ln.weight);
    ctx.globalAlpha = 1;
    y += ls.length * lh + ln.gap;
  }
}
function drawTitle() {
  ctx.fillStyle = "rgba(27,20,12,.62)"; ctx.fillRect(0, 0, W, H);
  const tl = getTitleLines();
  drawCard(tl, tl.length - 1);
  if (best) txt("최고 기록 " + fmtTime(best), W / 2, H - L.pad - 12, 15, C.cream, "center", "bold");
  const m = L.mute;
  rr(m.x + 5, m.y + 5, m.w - 10, m.h - 10, 10, "rgba(255,255,255,.18)");
  drawSpeaker(m.x + m.w / 2 - 2, m.y + m.h / 2, 8, muted);
}
function drawOver() {
  const a = Math.min(1, overT / 0.4);
  ctx.globalAlpha = a; ctx.fillStyle = "rgba(27,20,12,.6)"; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  if (!overLines) buildOverLines();
  drawCard(overLines, overLines.length - 1);
}

/* ===== 한 프레임 그리기 ===== */
function draw() {
  if (!L.ok) { ctx.fillStyle = C.brown; ctx.fillRect(0, 0, Math.max(1, W), Math.max(1, H)); return; }
  ctx.fillStyle = ROOMS[G.room].wall; ctx.fillRect(0, 0, W, H);
  if (G.room === 2) { const dk = darkness(); if (dk > 0) { ctx.globalAlpha = 0.65 * dk; ctx.fillStyle = C.dark; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  // 장면
  let ox = 0, oy = 0;
  if (shakeT > 0) { ox = (Math.random() * 2 - 1) * shakeMag; oy = (Math.random() * 2 - 1) * shakeMag; }
  ctx.save();
  ctx.translate(L.sx + ox, L.sy + oy); ctx.scale(L.sc, L.sc);
  rrPath(0, 0, 360, 360, 12); ctx.clip();
  if (trans) {
    const t = Math.min(1, trans.t / 0.5), p = t * t * (3 - 2 * t);
    ctx.save(); ctx.translate(-p * 360, 0); drawRoom(trans.from); ctx.restore();
    ctx.save(); ctx.translate((1 - p) * 360, 0); drawRoom(G.room); ctx.restore();
  } else drawRoom(G.room);
  if (ov) drawOverlay();
  if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, 360, 360); ctx.globalAlpha = 1; }
  ctx.restore();
  rr(L.sx + ox - 1.5, L.sy + oy - 1.5, L.S + 3, L.S + 3, 13, null, C.brown, 3);
  drawHUD();
  drawBubble();
  drawBag();
  drawCursor();
  drawFX();
  if (state === "title") drawTitle();
  else if (state === "over") drawOver();
}

/* ===== 메인 루프 (애니메이션은 한 번에 0.05초까지만, 시계는 실제 경과 시간(최대 1초)으로 진행) ===== */
resize();
lastFrame = performance.now();
function loop(now) {
  const raw = Math.max(0, (now - lastFrame) / 1000);
  lastFrame = now;
  const cdt = Math.min(1, raw), dt = Math.min(0.05, raw);
  // iframe 크기가 늦게 잡히면 resize 이벤트가 안 올 수 있어서 매 프레임 확인해요
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  update(dt, cdt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
