<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>도시락 반찬 받기</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff4df; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #mute {
    position: fixed; top: 10px; right: 10px; width: 44px; height: 44px; border: 0; border-radius: 12px;
    background: rgba(90, 50, 20, .14); color: #5a3214; font-size: 20px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" aria-label="소리 끄기">🔊</button>
<script>
/* ===== 리더보드 SDK (public/sdk.js와 같은 코드) ===== */
(function () {
  var sent = false;
  window.GameSDK = {
    submitScore: function (score) {
      if (sent) return;
      if (typeof score !== "number" || !isFinite(score)) return;
      sent = true;
      window.parent.postMessage({ type: "GAMESDK_SCORE", score: score }, "*");
    },
    newRound: function () {
      sent = false;
      window.parent.postMessage({ type: "GAMESDK_NEW_ROUND" }, "*");
    },
  };
})();

/* ===== 화면 ===== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, U = 1; // U: 화면 크기에 맞춘 기본 단위
const box = { x: 0, y: 0, w: 0, h: 0, targetX: null, squash: 0 };
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W, H) / 100;
  box.w = Math.max(100, Math.min(210, W * 0.26));
  box.h = box.w * 0.42;
  box.y = H - box.h - Math.max(28, H * 0.07);
  if (!box.x) box.x = W / 2;
  box.x = clamp(box.x, box.w / 2, W - box.w / 2);
}
window.addEventListener("resize", resize);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
resize();

/* ===== 소리 ===== */
let audio = null, muted = false;
function tone(freq, dur = 0.08, type = "triangle", vol = 0.08, when = 0) {
  if (!audio || muted) return;
  const t = audio.currentTime + when;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === "suspended") audio.resume();
}
const sfx = {
  catch: (c) => tone(520 + Math.min(c, 20) * 28, 0.08, "triangle", 0.09),
  bad: () => { tone(160, 0.28, "sawtooth", 0.07); tone(120, 0.3, "square", 0.04, 0.05); },
  miss: () => tone(300, 0.06, "sine", 0.04),
  gold: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.12, "triangle", 0.07, i * 0.06)),
  full: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, "square", 0.05, i * 0.08)),
  start: () => [440, 660].forEach((f, i) => tone(f, 0.1, "triangle", 0.07, i * 0.08)),
  over: () => [392, 330, 262].forEach((f, i) => tone(f, 0.22, "triangle", 0.08, i * 0.16)),
};
const muteBtn = document.getElementById("mute");
muteBtn.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  muted = !muted;
  muteBtn.textContent = muted ? "🔇" : "🔊";
  muteBtn.setAttribute("aria-label", muted ? "소리 켜기" : "소리 끄기");
});

/* ===== 입력 ===== */
const keys = new Set();
let pointerDown = false;
window.addEventListener("keydown", (e) => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
  if (!keys.has(e.key) && (e.key === " " || e.key === "Enter")) onPress();
  keys.add(e.key);
  if (["ArrowLeft", "ArrowRight", "a", "d", "A", "D"].includes(e.key)) box.targetX = null;
});
window.addEventListener("keyup", (e) => keys.delete(e.key));
canvas.addEventListener("pointerdown", (e) => {
  pointerDown = true;
  if (state === "play") box.targetX = e.clientX;
  onPress();
});
canvas.addEventListener("pointermove", (e) => {
  // 마우스는 누르지 않아도 따라오고, 손가락은 누른 채 끌 때 따라와요
  if (state === "play" && (pointerDown || e.pointerType === "mouse")) box.targetX = e.clientX;
});
window.addEventListener("pointerup", () => { pointerDown = false; });
window.addEventListener("pointercancel", () => { pointerDown = false; });

/* ===== 반찬 ===== */
// good: 받으면 점수, bad: 상한 반찬(받으면 하트 -1), gold: 반짝 계란말이(하트 회복 또는 큰 점수)
const DISHES = [
  { id: "egg", name: "계란말이", color: "#f6c945" },
  { id: "sausage", name: "소시지", color: "#e2553f" },
  { id: "kimbap", name: "김밥", color: "#2d2d2d" },
  { id: "shrimp", name: "새우튀김", color: "#e59a3a" },
  { id: "riceball", name: "주먹밥", color: "#ffffff" },
  { id: "tomato", name: "방울토마토", color: "#e8323a" },
];

let state = "title"; // title | play | over
let score = 0, best = 0, hearts = 3, combo = 0, bestCombo = 0;
let caughtCount = 0, boxesDone = 0, elapsed = 0, spawnTimer = 0, overAt = 0;
let lastSpawnX = -999, lastSpawnT = -999;
let inBox = []; // 도시락에 담긴 반찬 (그림용, 최대 10개)
let items = [], particles = [], popups = [];
let shake = 0, flash = 0, banner = null;

function onPress() {
  unlockAudio();
  if (state === "title") startGame();
  else if (state === "over" && performance.now() - overAt > 700) startGame();
}

function startGame() {
  if (state === "over") GameSDK.newRound();
  state = "play";
  score = 0; hearts = 3; combo = 0; bestCombo = 0; caughtCount = 0; boxesDone = 0;
  elapsed = 0; spawnTimer = 0.6; lastSpawnT = -999;
  inBox = []; items = []; particles = []; popups = [];
  shake = 0; flash = 0; banner = null;
  box.x = W / 2; box.targetX = null;
  sfx.start();
}

function endGame() {
  state = "over";
  overAt = performance.now();
  best = Math.max(best, score);
  GameSDK.submitScore(score);
  sfx.over();
}

function itemSize() { return clamp(U * 5.2, 17, 30); }

function spawn() {
  const t = elapsed;
  const r = itemSize();
  // 처음 15초는 상한 반찬이 적게 나오고, 그 뒤로 천천히 늘어요
  const badChance = t < 15 ? 0.07 : Math.min(0.35, 0.07 + (t - 15) * 0.004);
  const roll = Math.random();
  const kind = roll < 0.03 ? "gold" : roll < 0.03 + badChance ? "bad" : "good";
  let x = rnd(r + 8, W - r - 8);
  // 바로 전에 떨어진 것과 너무 붙어 있으면 옆으로 비켜요 (피할 수 없는 상황 방지)
  if (elapsed - lastSpawnT < 0.5 && Math.abs(x - lastSpawnX) < r * 3) {
    x = clamp(x + (x < W / 2 ? 1 : -1) * r * 4, r + 8, W - r - 8);
  }
  lastSpawnX = x; lastSpawnT = elapsed;
  const speed = H * Math.min(0.85, 0.28 + t * 0.0055) * rnd(0.88, 1.12);
  items.push({
    kind, x, y: -r * 1.5, r, vy: speed,
    dish: DISHES[Math.floor(Math.random() * DISHES.length)],
    rot: rnd(-0.4, 0.4), spin: rnd(-1.5, 1.5),
    sway: t > 40 && Math.random() < Math.min(0.5, (t - 40) * 0.01) ? rnd(0.6, 1.4) : 0,
    swayBase: x, phase: rnd(0, Math.PI * 2),
  });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n && particles.length < 140; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(60, 260);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: rnd(0.4, 0.8), max: 0.8, color, size: rnd(2.5, 5) });
  }
}
function popup(x, y, text, color, size = 18) {
  if (popups.length >= 20) return;
  // 거의 동시에 뜬 글자끼리 겹치지 않게 위로 쌓아요
  for (const p of popups) if (p.life > 0.55 && Math.abs(p.x - x) < 120 && Math.abs(p.y - y) < size * 1.2) y = p.y - size * 1.3;
  popups.push({ x, y, text, color, size, life: 0.9 });
}

function catchItem(it) {
  box.squash = 1;
  if (it.kind === "bad") {
    hearts--; combo = 0;
    shake = 0.35; flash = 0.25;
    burst(it.x, box.y, "#8a9a4a", 18);
    popup(it.x, box.y - 20, "으악, 상했어요!", "#7a4fa0", 18);
    sfx.bad();
    if (hearts <= 0) endGame();
    return;
  }
  if (it.kind === "gold") {
    if (hearts < 3) { hearts++; popup(it.x, box.y - 20, "하트 +1", "#e2553f", 20); }
    else { score += 50; popup(it.x, box.y - 20, "+50", "#d99a00", 22); }
    burst(it.x, box.y, "#ffd34d", 26);
    sfx.gold();
    return;
  }
  combo++; bestCombo = Math.max(bestCombo, combo);
  const mult = 1 + Math.floor(combo / 5);
  const gain = 10 * mult;
  score += gain; caughtCount++;
  popup(it.x, box.y - 20, mult > 1 ? `+${gain} ×${mult}` : `+${gain}`, "#5a3214", 18);
  burst(it.x, box.y, it.dish.color === "#ffffff" ? "#e9e2d0" : it.dish.color, 10);
  sfx.catch(combo);
  inBox.push(it.dish.id);
  if (inBox.length >= 10) {
    boxesDone++; score += 100; inBox = [];
    banner = { text: "도시락 완성! +100", life: 1.4 };
    burst(box.x, box.y, "#f6c945", 30); burst(box.x, box.y, "#e2553f", 20);
    sfx.full();
  }
}

/* ===== 업데이트 ===== */
function update(dt) {
  // 효과는 게임 오버 뒤에도 조금 더 움직여요
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }
  particles = particles.filter((p) => p.life > 0);
  for (const p of popups) { p.y -= 50 * dt; p.life -= dt; }
  popups = popups.filter((p) => p.life > 0);
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt);
  box.squash = Math.max(0, box.squash - dt * 5);
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  if (state !== "play") return;

  elapsed += dt;

  // 도시락 움직이기
  let dir = 0;
  if (keys.has("ArrowLeft") || keys.has("a") || keys.has("A")) dir -= 1;
  if (keys.has("ArrowRight") || keys.has("d") || keys.has("D")) dir += 1;
  const speed = Math.max(420, W * 1.15);
  if (dir) box.x += dir * speed * dt;
  else if (box.targetX !== null) {
    const d = box.targetX - box.x;
    box.x += clamp(d * 14 * dt, -speed * 1.4 * dt, speed * 1.4 * dt);
  }
  box.x = clamp(box.x, box.w / 2, W - box.w / 2);

  // 반찬 떨어뜨리기
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawn();
    spawnTimer = Math.max(0.33, 0.95 - elapsed * 0.011) * rnd(0.8, 1.2);
  }

  const left = box.x - box.w / 2, right = box.x + box.w / 2;
  for (const it of items) {
    it.y += it.vy * dt;
    it.rot += it.spin * dt;
    if (it.sway) { it.phase += dt * 2.2; it.x = clamp(it.swayBase + Math.sin(it.phase) * W * 0.06 * it.sway, it.r, W - it.r); }
    // 받기 판정: 도시락 윗면을 지날 때, 가장자리는 조금 너그럽게
    if (!it.done && it.y + it.r * 0.6 >= box.y && it.y - it.r < box.y + box.h * 0.5) {
      const margin = it.kind === "bad" ? -it.r * 0.35 : it.r * 0.5;
      if (it.x >= left - margin && it.x <= right + margin) { it.done = true; catchItem(it); if (state !== "play") return; }
    }
    if (!it.done && it.y - it.r > H) {
      it.done = true;
      if (it.kind === "good") { if (combo >= 3) popup(it.x, H - 30, "콤보 끊김", "#9a8a70", 15); combo = 0; sfx.miss(); }
    }
  }
  items = items.filter((it) => !it.done);
}

/* ===== 그리기 ===== */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#ffe3b8"); g.addColorStop(1, "#fff6e6");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 햇살
  ctx.fillStyle = "rgba(255,255,255,.35)";
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(W * (0.15 + i * 0.27), H * 0.18 + (i % 2) * 30, U * 9, 0, Math.PI * 2); ctx.fill(); }
  // 돗자리 (빨강·하양 체크)
  const top = box.y + box.h * 0.75, cell = Math.max(18, U * 5);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, top, W, H - top);
  ctx.fillStyle = "rgba(226,85,63,.55)";
  for (let x = 0; x < W; x += cell * 2) ctx.fillRect(x, top, cell, H - top);
  ctx.fillStyle = "rgba(226,85,63,.35)";
  for (let y = top; y < H; y += cell * 2) ctx.fillRect(0, y, W, cell);
}

function drawDish(dish, x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.lineWidth = Math.max(1.5, r * 0.09); ctx.strokeStyle = "rgba(60,30,10,.55)";
  switch (dish.id) {
    case "egg": // 계란말이: 노란 직사각형 + 말린 줄
      roundRect(-r, -r * 0.62, r * 2, r * 1.24, r * 0.3, "#f6c945"); ctx.stroke();
      ctx.strokeStyle = "#e0a91c";
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * r * 0.55, -r * 0.5); ctx.lineTo(i * r * 0.55, r * 0.5); ctx.stroke(); }
      break;
    case "sausage": // 소시지: 빨간 타원 + 칼집
      ctx.fillStyle = "#e2553f"; ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.55, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#ffd2c4";
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * r * 0.45 - r * 0.12, -r * 0.3); ctx.lineTo(i * r * 0.45 + r * 0.12, r * 0.3); ctx.stroke(); }
      break;
    case "kimbap": // 김밥: 검은 테두리, 흰 밥, 알록달록 속
      circle(0, 0, r, "#22262a"); circle(0, 0, r * 0.78, "#fbfaf4");
      circle(-r * 0.25, -r * 0.2, r * 0.2, "#f6c945"); circle(r * 0.25, -r * 0.15, r * 0.18, "#e85d3a");
      circle(0, r * 0.25, r * 0.2, "#4caf50"); circle(r * 0.05, -r * 0.02, r * 0.12, "#c45bb0");
      break;
    case "shrimp": // 새우튀김: 주황 몸통 + 빨간 꼬리
      ctx.fillStyle = "#e59a3a"; ctx.beginPath(); ctx.ellipse(-r * 0.1, 0, r * 0.85, r * 0.42, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#e2553f"; ctx.beginPath(); ctx.moveTo(r * 0.7, 0); ctx.lineTo(r * 1.1, -r * 0.4); ctx.lineTo(r * 1.1, r * 0.4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#c97a22"; for (let i = 0; i < 4; i++) circle(-r * 0.6 + i * r * 0.35, -r * 0.12 + (i % 2) * r * 0.2, r * 0.08, "#c97a22");
      break;
    case "riceball": // 주먹밥: 흰 삼각형 + 김
      ctx.fillStyle = "#ffffff"; ctx.beginPath();
      ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 1.15, r * 0.85, 0, r * 0.85); ctx.quadraticCurveTo(-r * 1.15, r * 0.85, 0, -r);
      ctx.fill(); ctx.stroke();
      roundRect(-r * 0.42, r * 0.2, r * 0.84, r * 0.65, r * 0.08, "#20302a");
      break;
    case "tomato": // 방울토마토: 빨간 원 + 초록 꼭지 + 반짝
      circle(0, r * 0.05, r * 0.85, "#e8323a"); ctx.beginPath(); ctx.arc(0, r * 0.05, r * 0.85, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#3f9a3a"; for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2; ctx.beginPath(); ctx.ellipse(Math.cos(a) * r * 0.22, -r * 0.7 + Math.sin(a) * r * 0.1, r * 0.22, r * 0.08, a, 0, Math.PI * 2); ctx.fill(); }
      circle(-r * 0.3, -r * 0.15, r * 0.14, "rgba(255,255,255,.7)");
      break;
  }
  ctx.restore();
}

function drawBad(x, y, r, rot, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  // 상한 반찬: 칙칙한 초록 덩어리 + 얼룩
  ctx.fillStyle = "#8a9a4a"; ctx.beginPath();
  for (let i = 0; i <= 10; i++) { const a = (i / 10) * Math.PI * 2, rr = r * (0.82 + 0.16 * Math.sin(i * 2.3)); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.lineWidth = Math.max(1.5, r * 0.09); ctx.strokeStyle = "#5d6a2a"; ctx.stroke();
  circle(-r * 0.3, -r * 0.2, r * 0.2, "#6b7a30"); circle(r * 0.3, r * 0.25, r * 0.16, "#6b7a30"); circle(r * 0.15, -r * 0.35, r * 0.1, "#a3a35a");
  // 찡그린 얼굴
  ctx.strokeStyle = "#3a4418"; ctx.lineWidth = Math.max(1.5, r * 0.1);
  ctx.beginPath(); ctx.moveTo(-r * 0.4, -r * 0.05); ctx.lineTo(-r * 0.15, r * 0.05); ctx.moveTo(r * 0.4, -r * 0.05); ctx.lineTo(r * 0.15, r * 0.05); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, r * 0.45, r * 0.25, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.restore();
  // 냄새 물결과 파리 (회전 없이)
  ctx.strokeStyle = "rgba(122,79,160,.75)"; ctx.lineWidth = 2;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    for (let k = 0; k <= 8; k++) { const yy = y - r * 1.1 - k * r * 0.12, xx = x + i * r * 0.5 + Math.sin(k * 0.9 + t * 6 + i) * r * 0.12; k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
    ctx.stroke();
  }
  for (let i = 0; i < 2; i++) {
    const a = t * 7 + i * Math.PI;
    const fx = x + Math.cos(a) * r * 1.25, fy = y - r * 0.2 + Math.sin(a * 1.3) * r * 0.6;
    circle(fx, fy, Math.max(2, r * 0.1), "#1d1d1d");
    ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.beginPath(); ctx.ellipse(fx - 2, fy - 3, 2.5, 1.5, -0.5, 0, Math.PI * 2); ctx.fill();
  }
}

function drawGold(x, y, r, rot, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = "#ffd34d"; ctx.shadowBlur = 16;
  roundRect(-r, -r * 0.62, r * 2, r * 1.24, r * 0.3, "#ffc928");
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#e09a00"; ctx.lineWidth = Math.max(1.5, r * 0.09);
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * r * 0.55, -r * 0.5); ctx.lineTo(i * r * 0.55, r * 0.5); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = "#fff8c8";
  for (let i = 0; i < 3; i++) {
    const a = t * 3 + (i * Math.PI * 2) / 3, sx = x + Math.cos(a) * r * 1.4, sy = y + Math.sin(a) * r * 1.1, s = r * 0.22;
    ctx.beginPath(); ctx.moveTo(sx, sy - s); ctx.lineTo(sx + s * 0.3, sy); ctx.lineTo(sx, sy + s); ctx.lineTo(sx - s * 0.3, sy); ctx.closePath(); ctx.fill();
  }
}

function drawBox() {
  const sq = box.squash * 0.12;
  const w = box.w * (1 + sq), h = box.h * (1 - sq);
  const x = box.x - w / 2, y = box.y + (box.h - h);
  // 담긴 반찬이 위로 살짝 보여요
  const r = box.w / 12;
  for (let i = 0; i < inBox.length; i++) {
    const col = i % 5, row = Math.floor(i / 5);
    const dish = DISHES.find((d) => d.id === inBox[i]);
    drawDish(dish, x + w * (0.14 + col * 0.18), y + h * 0.12 - row * r * 0.9, r, (i % 3 - 1) * 0.2);
  }
  // 나무 도시락통
  roundRect(x, y, w, h, h * 0.22, "#b0703a");
  roundRect(x + w * 0.04, y + h * 0.1, w * 0.92, h * 0.25, h * 0.1, "#8a5326");
  ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(x + w * 0.06, y + h * 0.48, w * 0.88, h * 0.08);
  ctx.strokeStyle = "#6e3f1a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + w / 2, y + h * 0.4); ctx.lineTo(x + w / 2, y + h * 0.9); ctx.stroke();
  // 칸 표시 (몇 개 담았는지)
  const dots = 10, dw = w * 0.72 / dots;
  for (let i = 0; i < dots; i++) circle(x + w * 0.14 + dw * (i + 0.5), y + h * 0.72, Math.max(2.5, dw * 0.22), i < inBox.length ? "#f6c945" : "rgba(255,255,255,.35)");
}

function drawHearts() {
  const s = Math.max(14, U * 3.4), gap = s * 1.5, x0 = W / 2 - gap, y = Math.max(30, s * 1.6);
  for (let i = 0; i < 3; i++) heart(x0 + i * gap, y, s, i < hearts ? "#e2553f" : "rgba(90,50,20,.18)");
}

function drawHud() {
  const fs = clamp(U * 4.6, 16, 26);
  const y = Math.max(30, fs * 1.4);
  text(`${score}점`, 16, y, fs, "left", "800", "#5a3214");
  drawHearts();
  if (combo >= 3) {
    const mult = 1 + Math.floor(combo / 5);
    text(mult > 1 ? `콤보 ${combo} · ×${mult}` : `콤보 ${combo}`, 16, y + fs * 1.15, clamp(fs * 0.7, 14, 18), "left", "800", "#c2410c");
  }
}

function drawTitle() {
  ctx.fillStyle = "rgba(255,246,230,.82)"; ctx.fillRect(0, 0, W, H);
  const big = clamp(Math.min(W, H) * 0.09, 28, 54);
  const r = clamp(U * 6, 20, 34);
  const fs = clamp(U * 4, 15, 20);
  // 제목 → 반찬 그림(상한 반찬 냄새 물결이 제목에 닿지 않게 간격을 둬요) → 설명 → 시작 안내
  const titleY = Math.max(big, H / 2 - (big * 0.5 + r * 3.2 + r * 2.2 + fs * 5.6) / 2 + big * 0.5);
  text("도시락 반찬 받기", W / 2, titleY, big, "center", "900", "#5a3214");
  const iconY = titleY + big * 0.5 + r * 3.2;
  drawDish(DISHES[0], W / 2 - r * 3, iconY, r, -0.2);
  drawDish(DISHES[2], W / 2, iconY, r, 0);
  drawBad(W / 2 + r * 3, iconY, r, 0.2, performance.now() / 1000);
  const howY = iconY + r * 2.2;
  text(W < 520 ? "손가락으로 도시락통을 끌어서" : "←/→ 방향키나 마우스로 도시락통을 움직여", W / 2, howY, fs, "center", "600", "#5a3214");
  text("반찬을 받아요. 초록 상한 반찬은 피해요!", W / 2, howY + fs * 1.5, fs, "center", "600", "#5a3214");
  const pulse = 0.85 + Math.sin(performance.now() / 300) * 0.15;
  text("탭하거나 스페이스를 눌러 시작", W / 2, howY + fs * 4, fs * 1.1 * pulse + fs * 0.1, "center", "800", "#c2410c");
}

function drawOver() {
  ctx.fillStyle = "rgba(60,30,10,.6)"; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W - 32, 380), ph = Math.min(H - 40, 300), px = (W - pw) / 2, py = (H - ph) / 2;
  roundRect(px, py, pw, ph, 20, "#fff6e6");
  const fs = clamp(Math.min(pw, ph) * 0.1, 22, 34);
  text("점심시간 끝!", W / 2, py + ph * 0.17, fs, "center", "900", "#5a3214");
  text(`${score}점`, W / 2, py + ph * 0.38, fs * 1.35, "center", "900", "#c2410c");
  const sm = clamp(fs * 0.55, 14, 18);
  text(`최고 ${best}점`, W / 2, py + ph * 0.55, sm, "center", "700", "#5a3214");
  text(`받은 반찬 ${caughtCount}개 · 완성 도시락 ${boxesDone}개 · 최고 콤보 ${bestCombo}`, W / 2, py + ph * 0.67, Math.max(14, sm * 0.85), "center", "500", "#7a5a3a");
  if (performance.now() - overAt > 700) text("탭하거나 스페이스를 눌러 다시 하기", W / 2, py + ph * 0.86, sm, "center", "800", "#c2410c");
}

function draw() {
  const t = performance.now() / 1000;
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 22, rnd(-1, 1) * shake * 22);
  drawBackground();
  for (const it of items) {
    if (it.kind === "bad") drawBad(it.x, it.y, it.r, it.rot, t);
    else if (it.kind === "gold") drawGold(it.x, it.y, it.r, it.rot, t);
    else drawDish(it.dish, it.x, it.y, it.r, it.rot);
  }
  drawBox();
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); circle(p.x, p.y, p.size, p.color); }
  ctx.globalAlpha = 1;
  for (const p of popups) { ctx.globalAlpha = Math.min(1, p.life * 2); text(p.text, p.x, p.y, p.size, "center", "800", p.color); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(160,40,30,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (state !== "title") drawHud();
  if (banner) { ctx.globalAlpha = Math.min(1, banner.life * 2); text(banner.text, W / 2, H * 0.4, clamp(U * 7, 24, 40), "center", "900", "#c2410c"); ctx.globalAlpha = 1; }
  if (state === "title") drawTitle();
  if (state === "over") drawOver();
}

/* ===== 그리기 도구 ===== */
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function roundRect(x, y, w, h, r, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
}
function heart(x, y, s, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.45, y - s * 1.0, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.0, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  ctx.fill();
}
function text(s, x, y, size, align = "center", weight = "normal", color = "#fff") {
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  ctx.fillText(s, x, y);
}

/* ===== 메인 루프 ===== */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
