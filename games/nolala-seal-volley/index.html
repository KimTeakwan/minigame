<style>

<script>
/* ===== 게임 SDK: 리더보드 + 멀티 (public/sdk.js와 같은 코드. 지우지 마세요) ===== */
/* 멀티 게임 쓰는 법은 games/README.md의 "멀티 게임"을 보세요 */
(function () {
  var sent = false;
  var standalone = window.parent === window; // 파일을 직접 열었을 때
  var listeners = { message: [], players: [], emote: [], error: [] };
  var room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
  var waiting = [];

  function post(msg) {
    if (!standalone) window.parent.postMessage(msg, "*");
  }
  function emit(name, a, b) {
    var list = listeners[name] || [];
    for (var i = 0; i < list.length; i++) {
      try { list[i](a, b); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }
  function settle(ok, value) {
    var list = waiting;
    waiting = [];
    for (var i = 0; i < list.length; i++) {
      clearTimeout(list[i].timer);
      ok ? list[i].resolve(value) : list[i].reject(new Error(value));
    }
  }

  window.addEventListener("message", function (event) {
    if (standalone || event.source !== window.parent) return; // 바깥 플레이 페이지에서 온 것만
    var m = event.data;
    if (!m || typeof m !== "object") return;
    if (m.type === "GAMESDK_MP_JOINED") {
      room = { joined: true, roomId: m.roomId, me: m.me, players: m.players || [], hostId: m.hostId, maxPlayers: m.maxPlayers };
      settle(true, { roomId: room.roomId, me: room.me, players: room.players, hostId: room.hostId, maxPlayers: room.maxPlayers });
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_PLAYERS") {
      room.players = m.players || [];
      room.hostId = m.hostId;
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_MESSAGE") {
      emit("message", m.data, m.from);
    } else if (m.type === "GAMESDK_MP_EMOTE") {
      emit("emote", m.key, m.from);
    } else if (m.type === "GAMESDK_MP_ERROR") {
      if (!room.joined) settle(false, m.message);
      emit("error", m.message);
    }
  });

  window.GameSDK = {
    submitScore: function (score) {
      if (sent) return; // 한 판에 한 번만
      if (typeof score !== "number" || !isFinite(score)) return;
      sent = true;
      post({ type: "GAMESDK_SCORE", score: score });
    },
    // 새 판을 시작할 때 부르면 다시 점수를 보낼 수 있어요.
    newRound: function () {
      sent = false;
      post({ type: "GAMESDK_NEW_ROUND" });
    },
    multi: {
      join: function () {
        return new Promise(function (resolve, reject) {
          if (standalone) return reject(new Error("사이트 밖에서는 멀티를 쓸 수 없어요"));
          var w = { resolve: resolve, reject: reject, timer: 0 };
          w.timer = setTimeout(function () {
            waiting = waiting.filter(function (x) { return x !== w; });
            reject(new Error("방에 들어가지 못했어요 (응답 없음)"));
          }, 8000);
          waiting.push(w);
          post({ type: "GAMESDK_MP_JOIN" });
        });
      },
      send: function (data) { if (room.joined) post({ type: "GAMESDK_MP_SEND", data: data }); },
      emote: function (key) { if (room.joined) post({ type: "GAMESDK_MP_EMOTE", key: key }); },
      lock: function (locked) { if (room.joined) post({ type: "GAMESDK_MP_LOCK", locked: locked !== false }); },
      leave: function () {
        if (!room.joined) return;
        room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
        post({ type: "GAMESDK_MP_LEAVE" });
      },
      on: function (name, fn) { if (listeners[name] && typeof fn === "function") listeners[name].push(fn); },
      me: function () { return room.me; },
      players: function () { return room.players.slice(); },
      hostId: function () { return room.hostId; },
      isHost: function () { return !!room.me && room.me.id === room.hostId; },
    },
  };
})();

/* =====================================================================
   콩콩 노라라 물범 배구 — 머리로 공을 넘기는 1대1 모래 배구 (최대 2명)
   - 계산은 세계 좌표 800×450 하나로 해요. 화면에는 비율을 지켜 맞추고 남는 곳은 하늘·모래로 채워요.
   - 모드: 혼자(컴퓨터 1~5단) · 온라인 1대1 · 한 기기 둘이. 물리·규칙·그리기는 같고 "누가 움직이나"만 달라요.
   멀티 구조
   - 방장은 왼쪽(0), 손님은 오른쪽(1). 손님 화면은 좌우를 뒤집어 그려서 누구나 자기가 왼쪽 빨간 물범이에요.
   - 방장: 대기실·카운트다운·서브·3분 시계·점수 확정·결과, 컴퓨터 물범, 방장 쪽 바닥 판정 → 상태 "s".
   - 공 터치는 친 물범의 기기가 판정해서 친 직후 공 상태를 "h"로 보내요. 터치 사이에는 중력·벽·네트로만
     움직이니(+ − × ÷ √만 써요) 받은 쪽이 같은 계산으로 똑같이 이어 그려요. 시간은 랠리마다 0부터 세는 틱이에요.
   - 손님은 자기 물범 "p"(1초 5번)와 자기 쪽 바닥에 떨어짐 "d"(0.25초 확인 뒤)를 보내요.
   ===================================================================== */
const WW = 800, WH = 450, GROUND = 400, NET_X = 400, NET_HW = 6, NET_TOP = 260;
const SEAL_R = 32, SEAL_Y = GROUND - SEAL_R, SEAL_SPD = 300, JUMP_V = 620, SEAL_G = 1400;
const XMIN = [SEAL_R, NET_X + NET_HW + SEAL_R], XMAX = [NET_X - NET_HW - SEAL_R, WW - SEAL_R];
const HOME = [200, 600];
const BALL_R = 22, BALL_G = 900, BALL_VMAX = 1100, NET_E = 0.8;
const HIT_R = SEAL_R + BALL_R + 4;           // 보이는 모양보다 4만큼 너그럽게 받아요
const TPS = 120, TICK = 1 / TPS;
const SERVE_HOLD = 72, HIT_COOL = 36, SPIKE_WIN = 30; // 0.6초, 0.3초, 0.25초 (틱)
const NET_PUSH = 150;
const MATCH_MS = 180000, WIN_PTS = 7, MAXP = 2;
const COUNT_MS = 3000, POINT_MS = 1500, RESULT_MS = 6000, SOLO_WAIT = 10000, DUO_WAIT = 3000;
const CONFIRM_MS = 250, FLOOR_WAIT = 1500, SILENT_MS = 3000;
const RED_CAP = "#ff5a4e", BLUE_CAP = "#3b6fe0", RED_BODY = "#f4f1ec", BLUE_BODY = "#a9b5c2", LINE = "#5a4a42";
// 컴퓨터 단계: 반응 지연(틱), 이동 속도, 떨어질 자리 오차, 스파이크 확률
const AI = [null,
  { react: 48, spd: 0.7, err: 70, sp: 0 },
  { react: 36, spd: 0.8, err: 50, sp: 0.15 },
  { react: 26, spd: 0.9, err: 35, sp: 0.3 },
  { react: 18, spd: 1, err: 20, sp: 0.45 },
  { react: 12, spd: 1, err: 10, sp: 0.6 }];
const EMO = { hi: "👋", gg: "🤝", again: "🔁", wow: "😮", oops: "😅", thanks: "🙏" };
const PHASES = ["lobby", "count", "play", "point", "result"];
const FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
let T = performance.now();

/* ===== 화면 ===== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const HUD_H = 72;
let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0, PAD_T = 0, PAD_H = 0, skyGrad = null;
const PAD_DOTS = new Float32Array(90);
const SAND_DOTS = new Float32Array(120);
for (let i = 0; i < 40; i++) {
  SAND_DOTS[i * 3] = -320 + ((i * 337) % 1440); SAND_DOTS[i * 3 + 1] = 408 + ((i * 53) % 38); SAND_DOTS[i * 3 + 2] = 1.6 + (i % 3) * 0.8;
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.max(1, Math.round(W * DPR)); canvas.height = Math.max(1, Math.round(H * DPR));
  S = Math.max(0.05, Math.min(W / WW, H / WH));
  const free = H - WH * S;
  // 세로 화면: 경기장을 점수판 바로 아래에 붙이고 남는 아래쪽은 터치 패드로 써요
  OY = free >= HUD_H ? clamp(free / 2, HUD_H, 78) : Math.max(0, free / 2);
  OX = (W - WW * S) / 2;
  PAD_T = OY + WH * S; PAD_H = H - PAD_T;
  skyGrad = ctx.createLinearGradient(0, 0, 0, Math.max(2, OY + 250 * S));
  skyGrad.addColorStop(0, "#9fdcff"); skyGrad.addColorStop(1, "#dff4ff");
  let seed = 11;
  for (let i = 0; i < 30; i++) {
    seed = (seed * 16807) % 2147483647; const a = seed / 2147483647;
    seed = (seed * 16807) % 2147483647; const b = seed / 2147483647;
    PAD_DOTS[i * 3] = a * W; PAD_DOTS[i * 3 + 1] = PAD_T + 30 * S + b * Math.max(0, PAD_H - 30 * S); PAD_DOTS[i * 3 + 2] = 1.5 + (i % 3);
  }
  layoutButtons();
}
const sxw = (x) => OX + (G.flip ? WW - x : x) * S;   // 게임 요소 (손님은 좌우가 뒤집혀요)
const syw = (y) => OY + y * S;

/* ===== 소리 (Web Audio로 직접 만들어요. 첫 입력 뒤에 켜져요) ===== */
let audio = null, muted = false, noiseBuf = null;
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === "suspended") audio.resume();
  if (audio && !noiseBuf) {
    try {
      const len = Math.floor(audio.sampleRate * 0.3);
      noiseBuf = audio.createBuffer(1, len, audio.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { noiseBuf = null; }
  }
}
function tone(freq, dur, type, vol, when, freq2) {
  if (!audio || muted) return;
  const t0 = audio.currentTime + (when || 0), o = audio.createOscillator(), g = audio.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
  if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol || 0.08, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol, cut) {
  if (!audio || muted || !noiseBuf) return;
  const t0 = audio.currentTime, src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  src.buffer = noiseBuf; f.type = "lowpass"; f.frequency.value = cut || 1800;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(audio.destination); src.start(t0); src.stop(t0 + dur + 0.02);
}
const sfx = {
  pong: (k) => tone(523.25 * Math.pow(2, Math.min(k, 12) / 12), 0.13, "sine", 0.14),
  spike: () => { tone(150, 0.22, "square", 0.07, 0, 50); noise(0.14, 0.2, 2400); },
  jump: () => tone(330, 0.09, "sine", 0.045, 0, 560),
  thud: () => noise(0.12, 0.12, 900),
  gain: () => { tone(523, 0.14, "triangle", 0.08); tone(659, 0.14, "triangle", 0.08, 0.09); tone(784, 0.22, "triangle", 0.08, 0.18); },
  lose: () => { tone(392, 0.16, "triangle", 0.07); tone(294, 0.28, "triangle", 0.07, 0.14); },
  tick: () => tone(660, 0.1, "square", 0.04),
  go: () => { tone(1480, 0.08, "square", 0.04); tone(1480, 0.24, "square", 0.04, 0.11); },
  win: () => { const f = [523, 659, 784, 1047]; for (let i = 0; i < 4; i++) tone(f[i], 0.22, "triangle", 0.08, i * 0.11); },
  sad: () => { tone(392, 0.25, "sine", 0.07); tone(349, 0.25, "sine", 0.07, 0.17); tone(311, 0.4, "sine", 0.07, 0.34); },
  join: () => tone(740, 0.1, "sine", 0.05),
  pop: () => tone(880, 0.06, "sine", 0.05),
};
const muteBtn = document.getElementById("mute");
function toggleMute() {
  muted = !muted;
  muteBtn.textContent = muted ? "🔇" : "🔊";
  muteBtn.setAttribute("aria-label", muted ? "소리 켜기" : "소리 끄기");
}
muteBtn.addEventListener("pointerdown", (e) => { e.stopPropagation(); e.preventDefault(); unlockAudio(); toggleMute(); });

/* ===== 이모티콘 버튼 (방에 다른 사람이 있을 때만 보여요) ===== */
const emoBtn = document.getElementById("emo"), emoPanel = document.getElementById("emoPanel");
let emoOpen = false, emoShown = false, lastEmote = -1e9;
function setEmoOpen(v) { emoOpen = v; emoPanel.style.display = v ? "grid" : "none"; }
emoBtn.addEventListener("pointerdown", (e) => { e.stopPropagation(); e.preventDefault(); unlockAudio(); setEmoOpen(!emoOpen); });
emoPanel.addEventListener("pointerdown", (e) => {
  e.stopPropagation(); e.preventDefault();
  const b = e.target && e.target.closest ? e.target.closest("button") : null;
  if (b) sendEmote(b.getAttribute("data-k"));
  setEmoOpen(false);
});
function layoutButtons() {
  const narrow = W < 430;
  emoBtn.style.top = narrow ? "62px" : "8px"; emoBtn.style.right = narrow ? "8px" : "62px";
  emoPanel.style.top = narrow ? "116px" : "62px";
}
function sendEmote(k) {
  if (!EMO[k] || !online || T - lastEmote < 1500) return; // 1.5초에 한 번 (메시지 한도를 같이 써요)
  lastEmote = T;
  MP.emote(k);
  showEmote(myId, k);
}
function showEmote(id, k) {
  const icon = EMO[k];
  if (!icon) return;
  for (const s of seals) if (s.type === 0 && s.id === id && G.ph !== "lobby") { s.emote = icon; s.emoteUntil = T + 2500; return; }
  note(`${id === myId ? "나" : nameCache[id] || "상대"} ${icon}`);
}

/* ===== 멀티 연결 ===== */
const MP = GameSDK.multi;
let online = false, joinState = "pending";   // pending | ok | fail
let myId = "me", myName = "나", hostId = "me";
let humans = [{ id: "me", name: "나" }];
const nameCache = {};
const amHost = () => hostId === myId;
function cleanName(n) { return String(n == null ? "" : n).replace(/[\u0000-\u001f\u007f]/g, "").trim().slice(0, 12) || "플레이어"; }

GameSDK.multi.join().then((room) => {
  online = true; joinState = "ok";
  const old = myId;
  myId = String(room.me && room.me.id != null ? room.me.id : "me").slice(0, 64);
  myName = cleanName(room.me && room.me.name);
  for (const s of seals) {
    if (s.id === old) { s.id = myId; if (s.type === 0) s.name = myName; }
    else if (s.id === old + "~2") s.id = myId + "~2";
  }
  if (hostId === old) hostId = myId;
  applyPlayers(room.players, room.hostId);
  if (!amHost()) {
    // 이미 누가 있는 방: 혼자 시작한 판은 접고 방장의 판을 따라가요
    G.n = -1; G.ph = "lobby"; G.mode = "watch"; G.mySide = -1; G.flip = false;
    for (const s of seals) { s.ctl = "net"; placeHome(s); }
    serveBall(0); ptrMap.clear();
    G.lastHostMsg = T;
  }
}).catch(() => { joinState = "fail"; online = false; });

MP.on("players", (players, host) => { if (online) applyPlayers(players, host); });
MP.on("message", (data, from) => onNet(data, String(from)));
MP.on("emote", (key, from) => showEmote(String(from), key));

function applyPlayers(players, host) {
  const before = humans.length;
  const list = [];
  if (Array.isArray(players)) {
    for (const p of players) {
      if (!p || p.id == null) continue;
      const id = String(p.id).slice(0, 64), name = cleanName(p.name);
      nameCache[id] = name;
      list.push({ id, name });
      if (list.length >= 8) break;
    }
  }
  if (!list.some((h) => h.id === myId)) list.unshift({ id: myId, name: myName });
  humans = list;
  const was = amHost();
  hostId = host != null ? String(host) : myId;
  if (humans.length > before && before > 0) {
    sfx.join();
    const nw = humans[humans.length - 1];
    if (nw.id !== myId) note(G.ph === "lobby" ? `${nw.name}님이 들어왔어요` : `${nw.name}님이 들어왔어요 · 이 판이 끝나면 1대1을 해요`);
  }
  for (const s of seals) if (s.type === 0 && s.id !== myId && nameCache[s.id]) s.name = nameCache[s.id];
  if (!was && amHost()) takeOver();
  if (G.ph === "lobby" && humans.length !== before) G.duoSince = -1;
}

/* ===== 게임 상태 ===== */
const G = {
  ph: "lobby", mode: "solo", n: 0, r: 0, k: 0, sv: 0, sc: [0, 0], ss: [0, 0], mt: MATCH_MS, timeUp: false, mtFlag: 0,
  lv: 1, mul: 1, phEnd: 0, lobbySince: T, duoSince: -1, tick: 0, acc: 0, mySide: 0, flip: false,
  lp: [0, 0, 0], lpSeen: 0, dirty: false, lastS: -1e9, lastP: -1e9, lastHostMsg: T, myTouchK: -1, myTouchAt: 0,
  locked: false, resultAt: 0, matches: 0, guideDone: false, lastWin: false, lastScore: 0, lastMul: 1, lastSolo: true,
  goAt: -1e9, countNum: 0,
};
function makeSeal(side) {
  return {
    side, id: "", type: 0, ctl: "none", name: "", lvl: 3,
    x: HOME[side], y: SEAL_Y, vx: 0, vy: 0, ground: true, spikeUsed: false, spikeT: 0, cool: 0,
    dir: 0, tx: -1, jumpReq: false,
    dx: HOME[side], dy: SEAL_Y, dvy: 0, squash: 0, hitT: 0, swingT: 0, swNet: 0, air: false,
    nx: HOME[side], ny: SEAL_Y, nvx: 0, nvy: 0, nAt: 0, offX: 0, offY: 0, seen: 0,
    emote: "", emoteUntil: 0,
    aiKey: -1, aiAt: 0, aiPlanned: false, aiTx: HOME[side], aiJump: -1, aiSpike: -1,
  };

    if (!(G.mtFlag & 2) && G.mt <= 0 && G.sc[0] === G.sc[1]) { G.mtFlag |= 2; showBanner("골든 포인트! 다음 1점이 이겨요", "#ffd23f"); }

      ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 2; ctx.stroke();

  }
}
function drawPops() {
  for (const p of pops) {
    if (!p.on) continue;
    ctx.globalAlpha = clamp(p.life * 2.5, 0, 1);
    textO(p.text, sxw(p.x), syw(p.y), Math.max(16, p.size * Math.min(1, S + 0.25)), p.color, "900", 4);
  }
  ctx.globalAlpha = 1;
}
function fmtTime(ms) { const s = Math.ceil(Math.max(0, ms) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function scoreBox(cx, y, val, color, pop) {
  const k = 1 + 0.3 * pop, w = 46 * k, h = 42 * k;
  rr(cx - w / 2, y + 21 - h / 2, w, h, 10); ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 2; ctx.stroke();
  text(String(val), cx, y + 23, Math.round(32 * k), "#ffffff", "center", "900");
}
function drawHud() {
  if (G.ph === "lobby" || (G.ph === "result" && T - G.resultAt > 600)) return; // 결과 카드에 점수가 나와요
  const cx = W / 2, ls = G.flip ? 1 : 0;
  scoreBox(cx - 36, 6, G.sc[ls], RED_CAP, scorePop[0]);
  scoreBox(cx + 36, 6, G.sc[1 - ls], BLUE_CAP, scorePop[1]);
  textO(":", cx, 27, 28, "#ffffff", "900", 4);
  const last = G.mt <= 60000;
  const tstr = G.mt <= 0 ? (G.sc[0] === G.sc[1] ? "골든 포인트" : "0:00") : fmtTime(G.mt);
  setFont(16, "800");
  const tw = ctx.measureText(tstr).width + 18;
  rr(cx - tw / 2, 52, tw, 22, 11); ctx.fillStyle = last ? "rgba(255,90,78,0.9)" : "rgba(30,60,90,0.45)"; ctx.fill();
  text(tstr, cx, 64, 16, "#ffffff", "center", "800");
  if (W >= 560) {
    const maxW = Math.max(60, cx - 70 - 130);
    const ln = seals[ls], rn = seals[1 - ls];
    const lt = ln.ctl === "me" && online ? `${myName} (나)` : tagLabel(ln);
    textNameO(lt, cx - 70, 27, "right", maxW);
    textNameO(tagLabel(rn), cx + 70, 27, "left", maxW);

}
function textNameO(s, x, y, align, maxW) {
  setFont(16, "800");
  const v = fitStr(s, maxW);
  ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  ctx.lineWidth = 4; ctx.strokeStyle = "rgba(30,60,90,0.6)"; ctx.strokeText(v, x, y);
  ctx.fillStyle = "#ffffff"; ctx.fillText(v, x, y);
}
function drawMarker() {
  // 공이 화면 위로 나가면 위쪽 가장자리에 ▼로 위치를 보여줘요
  if (G.ph !== "play") return;
  const y = syw(DBY);
  if (y + BALL_R * S > 0) return;
  const x = clamp(sxw(DBX), 12, W - 12);
  ctx.fillStyle = "#ff5a4e"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 10, 4); ctx.lineTo(x + 10, 4); ctx.lineTo(x, 20); ctx.closePath(); ctx.fill(); ctx.stroke();
}
function bannerY() { return Math.max(HUD_H + 22, syw(92)); }
function pill(cx, cy, label, size, bg, fg, maxW) {
  setFont(size, "800");
  const w = Math.min(maxW || W - 20, ctx.measureText(label).width + 28), h = size + 16;
  rr(cx - w / 2, cy - h / 2, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  text(label, cx, cy + 1, size, fg, "center", "800", w - 18);
}
function bottomInfo(label, sub) {
  const y = PAD_H >= 90 ? PAD_T + 40 : H - (sub ? 46 : 28);
  pill(W / 2, y, label, 15, "rgba(30,60,90,0.82)", "#ffffff");
  if (sub) pill(W / 2, y + 30, sub, 14, "rgba(30,60,90,0.65)", "#ffe9a8");
}
function drawPlayInfo() {
  const me = mySeal(), active = G.ph === "count" || G.ph === "play" || G.ph === "point";
  if (banner.until > T) {
    ctx.globalAlpha = clamp((banner.until - T) / 300, 0, 1);
    pill(W / 2, bannerY(), banner.text, 18, "rgba(30,60,90,0.85)", banner.color);
    ctx.globalAlpha = 1;
  } else if (G.ph === "play" && me && !G.guideDone && T - G.goAt >= 700) { // "시작!"이 사라진 뒤에 보여줘요
    pill(W / 2, bannerY(), "공 밑으로 가서 톡!", 17, "rgba(255,255,255,0.92)", "#e2453a");
  }
  // 세로 화면 터치 패드
  if (active && PAD_H >= 120) {
    if (G.mode === "local2") {
      ctx.strokeStyle = "rgba(150,110,60,0.5)"; ctx.lineWidth = 3; ctx.setLineDash([10, 10]);
      ctx.beginPath(); ctx.moveTo(W / 2, PAD_T + 16); ctx.lineTo(W / 2, H - 16); ctx.stroke(); ctx.setLineDash([]);
      text("왼쪽 물범", W / 4, PAD_T + PAD_H / 2, 16, "rgba(140,90,40,0.85)", "center", "800");
      text("오른쪽 물범", W * 3 / 4, PAD_T + PAD_H / 2, 16, "rgba(140,90,40,0.85)", "center", "800");
    } else if (me && G.matches === 0 && (isTouch || H > W)) {
      const cy = PAD_T + PAD_H / 2;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "rgba(255,255,255,0.35)"; rr(W / 2 - Math.min(150, W / 2 - 14), cy - 54, Math.min(300, W - 28), 108, 20); ctx.fill();
      ctx.globalAlpha = 1;
      const sw = Math.sin(T / 400) * 26;
      ctx.fillStyle = "rgba(140,90,40,0.75)";
      circle(W / 2 + sw, cy - 22, 9); rr(W / 2 + sw - 9, cy - 22, 18, 22, 7); ctx.fill();
      text("◀", W / 2 - 60, cy - 18, 18, "rgba(140,90,40,0.75)"); text("▶", W / 2 + 60, cy - 18, 18, "rgba(140,90,40,0.75)");
      text("여기를 끌어서 움직이고,", W / 2, cy + 16, 16, "#7a4f26", "center", "800", W - 40);
      text("톡 하면 점프해요", W / 2, cy + 38, 16, "#7a4f26", "center", "800", W - 40);
    }
  }
  if (!active) return;
  if (G.mode === "watch") {
    const hn = nameCache[hostId] || "방장";
    bottomInfo("구경 중", `이 판이 끝나면 ${hn}님과 1대1을 해요`);
  } else if (online && !amHost() && humans.length >= 2 && T - G.lastHostMsg > 3000) {
    bottomInfo("연결을 기다리는 중…", "");
  }
}
function drawCount() {
  if (G.ph === "count") {
    const left = Math.ceil((G.phEnd - T) / 1000);
    if (left >= 1 && left <= 3) {
      const f = (G.phEnd - T) / 1000 - (left - 1);
      textO(String(left), W / 2, syw(175), clamp(Math.min(W, H) * 0.2, 56, 130) * (0.85 + f * 0.25), "#ffffff", "900", 7);
    }
  } else if (G.ph === "play" && T - G.goAt < 700) {
    const k = (T - G.goAt) / 700;
    ctx.globalAlpha = 1 - k;
    textO("시작!", W / 2, syw(175), clamp(Math.min(W, H) * 0.13, 40, 90) * (1 + k * 0.2), "#ffd23f", "900", 7);
    ctx.globalAlpha = 1;
  }
}
function cardRect(ch) {
  const need = ch + 58;                         // 카드 + 아래 버튼 자리 (간격 10 + 버튼 48)
  const narrow = W < 430;
  const rw = emoShown && !narrow ? 118 : 62;    // 오른쪽 위 버튼(음소거·😊)이 차지하는 폭
  const rh = emoShown && narrow ? 116 : 62;     // 오른쪽 위 버튼이 차지하는 높이
  let cw = Math.min(W - 24, 440), top;
  if (PAD_H >= need + 12) top = PAD_T + Math.max(8, (PAD_H - need - 2) / 2);
  else top = clamp(OY + (300 * S - ch) / 2, 8, Math.max(8, H - need - 8));
  if ((W - cw) / 2 < rw && top < rh) {
    // 오른쪽 위 버튼과 겹치지 않게: 아래로 내릴 자리가 있으면 내리고, 없으면(낮은 가로 화면) 카드 폭을 줄여요
    if (rh + need <= H - 8) top = rh;
    else cw = Math.max(200, W - 2 * rw);
  }
  return { x: W / 2 - cw / 2, y: top, w: cw, h: ch };
}
function drawRotateHint() {
  // 세로 휴대폰: 경기장이 폭에 맞춰 작아져서, 아래 모래 패드 맨 밑에 한 줄 알려줘요
  if (!(H > W && PAD_H >= 200) || G.mode === "local2") return;
  if (notes[0].until > T || notes[1].until > T) return; // 알림과 겹치지 않게
  if (BTN2.on && BTN2.y + BTN2.h > H - 36) return;      // 카드 아래 버튼과 겹치면 안 그려요
  if (BTNL.on && BTNL.y + BTNL.h > H - 36) return;
  text("휴대폰을 가로로 돌리면 더 크게 보여요", W / 2, H - 22, 14, "rgba(122,79,38,0.8)", "center", "700", W - 32);
}
function card(r) {
  rr(r.x, r.y, r.w, r.h, 20); ctx.fillStyle = "rgba(255,255,255,0.93)"; ctx.fill();
  ctx.strokeStyle = "#e2c48a"; ctx.lineWidth = 3; ctx.stroke();
}
function button(b, label, cx, y, w) {
  b.on = true; b.w = w; b.h = 48; b.x = cx - w / 2; b.y = y;
  rr(b.x, b.y, b.w, b.h, 14); ctx.fillStyle = "#3b6fe0"; ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  text(label, cx, y + 25, 16, "#ffffff", "center", "800", w - 16);
}
function drawLobby() {
  BTN2.on = false;

  text("콩콩 노라라 물범 배구", cx, r.y + 36, 27, "#e2453a", "center", "900", mw);

  const l1 = isTouch ? "화면을 끌어서 이동 · 톡 하면 점프" : "←/→ 이동 · ↑·스페이스 점프";
  const l2 = isTouch ? "공중에서 한 번 더 톡 하면 스파이크" : "공중에서 한 번 더 누르면 스파이크";

  else if (joinState === "fail") { st = "혼자 모드 · 컴퓨터 물범과 해요"; sub = `다음 상대: 컴퓨터 ${aiLevel}단`; prompt = "탭하거나 스페이스를 눌러 시작"; }
  else if (host && humans.length < 2) {

    st = `다른 플레이어를 기다리는 중 (${humans.length}/${MAXP})`; sub = `${left}초 뒤 컴퓨터 ${aiLevel}단과 시작해요`; prompt = "탭하거나 스페이스를 눌러 시작";
  } else if (host) {
    const op = otherHuman(), left = Math.max(1, Math.ceil(((G.duoSince >= 0 ? G.duoSince : T) + DUO_WAIT - T) / 1000));
    st = `${op ? op.name : "상대"}님과 1대1! (${humans.length}/${MAXP})`; sub = `곧 시작해요 (${left}초)`; prompt = "탭하거나 스페이스를 눌러 바로 시작";
  } else {
    const left = Math.max(1, Math.ceil((G.phEnd - T) / 1000));
    st = `${nameCache[hostId] || "방장"}님과 1대1! (${humans.length}/${MAXP})`; sub = `곧 시작해요 (${left}초)`;
  }
  text(st, cx, r.y + 152, 16, "#1d5f9a", "center", "800", mw);
  text(sub, cx, r.y + 176, 14, "#6a7f95", "center", "700", mw);
  if (prompt) text(prompt, cx, r.y + 216, 18 * (1 + Math.sin(T / 260) * 0.04), "#e2453a", "center", "900", mw);
  else text("방장이 곧 시작해요", cx, r.y + 216, 17, "#6a7f95", "center", "800", mw);

}
function drawResult() {
  BTN2.on = false; BTNL.on = false;
  const since = T - G.resultAt;

    l1 = "둘이 한 기기 판은 리더보드에 올라가지 않아요";
  } else if (G.mySide < 0) {
    title = "이번 판 결과";

  } else {
    title = G.lastWin ? "이겼어요!" : "아쉬워요";
    l1 = `이번 점수 ${G.lastScore.toLocaleString("ko-KR")}점`;
    l2 = `최고 점수 ${best.toLocaleString("ko-KR")}점`;
    l3 = G.lastSolo ? `다음 상대: 컴퓨터 ${aiLevel}단` : "사람과 한 판이라 점수 ×3이에요";
  }

  scoreBox(cx - 36, r.y + 54, a, RED_CAP, 0);
  scoreBox(cx + 36, r.y + 54, b, BLUE_CAP, 0);

  if (G.mySide >= 0 && G.mode !== "local2") {

    text(l2, cx, r.y + 148, 15, "#6a7f95", "center", "700", mw);
    text(l3, cx, r.y + 172, 15, "#1d5f9a", "center", "800", mw);

  const solo = amHost() && humans.length < 2;
  if (solo) {

    text("탭하거나 스페이스를 눌러 다시 하기", cx, r.y + 214, 17, ready ? "#e2453a" : "rgba(226,69,58,0.4)", "center", "900", mw);
  } else {

  }

  ctx.globalAlpha = 1;
}
function drawNotes() {
  let row = 0;
  for (let i = 0; i < 2; i++) {
    const nn = notes[i];
    if (nn.until <= T) continue;
    ctx.globalAlpha = clamp((nn.until - T) / 300, 0, 1);
    pill(W / 2, H - 24 - row * 36, nn.text, 15, "rgba(30,60,90,0.85)", "#ffffff", W - 16);
    row++;

}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  let shx = 0, shy = 0;
  if (shakeT > 0) { const k = shakeT / 0.18; shx = (Math.random() * 2 - 1) * 5 * k; shy = (Math.random() * 2 - 1) * 5 * k; } // 흔들림은 그리기에만
  drawBg(shx, shy);
  ctx.setTransform(DPR * S * (G.flip ? -1 : 1), 0, 0, DPR * S, DPR * (OX + shx + (G.flip ? WW * S : 0)), DPR * (OY + shy));

  drawShadows();
  const me = mySeal();
  for (const s of seals) if (s !== me) drawSeal(s);
  if (me) drawSeal(me);
  drawBall();
  drawParts();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawTags();
  drawPops();
  drawHud();
  drawMarker();
  BTN2.on = false; BTNL.on = false;

  else {
    drawPlayInfo();
    drawCount();
    if (G.ph === "result") drawResult();
  }
  drawRotateHint();
  drawNotes();
}

/* ===== 메인 루프 (iframe 크기가 늦게 잡혀도 매 프레임 확인해요) ===== */
resize();
let last = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now; T = now;
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
