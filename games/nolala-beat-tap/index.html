<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>톡톡 노라라 박자 놀이</title>
<style>
  /* 창을 꽉 채우고 스크롤·선택·길게 누르기 메뉴를 막아요 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #CDEBFF; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #mute {
    position: fixed; top: 6px; right: 6px; width: 48px; height: 48px; border: 0; border-radius: 10px;
    background: rgba(255,255,255,.7); color: #333; font-size: 18px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" aria-label="소리 끄기">🔊</button>
<script>
/* ===== 게임 SDK: 리더보드 + 멀티 (public/sdk.js와 같은 코드. 지우지 마세요) ===== */
/* 멀티 게임 쓰는 법은 games/README.md의 "멀티 게임"을 보세요 */
(function () {
  var sent = false;
  var standalone = window.parent === window; // 파일을 직접 열었을 때
  var listeners = { message: [], players: [], emote: [], error: [] };
  var room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
  var waiting = [];

  function post(msg) {
    if (!standalone) window.parent.postMessage(msg, "*");
  }
  function emit(name, a, b) {
    var list = listeners[name] || [];
    for (var i = 0; i < list.length; i++) {
      try { list[i](a, b); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }
  function settle(ok, value) {
    var list = waiting;
    waiting = [];
    for (var i = 0; i < list.length; i++) {
      clearTimeout(list[i].timer);
      ok ? list[i].resolve(value) : list[i].reject(new Error(value));
    }
  }

  window.addEventListener("message", function (event) {
    if (standalone || event.source !== window.parent) return; // 바깥 플레이 페이지에서 온 것만
    var m = event.data;
    if (!m || typeof m !== "object") return;
    if (m.type === "GAMESDK_MP_JOINED") {
      room = { joined: true, roomId: m.roomId, me: m.me, players: m.players || [], hostId: m.hostId, maxPlayers: m.maxPlayers };
      settle(true, { roomId: room.roomId, me: room.me, players: room.players, hostId: room.hostId, maxPlayers: room.maxPlayers });
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_PLAYERS") {
      room.players = m.players || [];
      room.hostId = m.hostId;
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_MESSAGE") {
      emit("message", m.data, m.from);
    } else if (m.type === "GAMESDK_MP_EMOTE") {
      emit("emote", m.key, m.from);
    } else if (m.type === "GAMESDK_MP_ERROR") {
      if (!room.joined) settle(false, m.message);
      emit("error", m.message);
    }
  });

  window.GameSDK = {
    submitScore: function (score) {
      if (sent) return; // 한 판에 한 번만
      if (typeof score !== "number" || !isFinite(score)) return;
      sent = true;
      post({ type: "GAMESDK_SCORE", score: score });
    },
    // 새 판을 시작할 때 부르면 다시 점수를 보낼 수 있어요.
    newRound: function () {
      sent = false;
      post({ type: "GAMESDK_NEW_ROUND" });
    },
    multi: {
      join: function () {
        return new Promise(function (resolve, reject) {
          if (standalone) return reject(new Error("사이트 밖에서는 멀티를 쓸 수 없어요"));
          var w = { resolve: resolve, reject: reject, timer: 0 };
          w.timer = setTimeout(function () {
            waiting = waiting.filter(function (x) { return x !== w; });
            reject(new Error("방에 들어가지 못했어요 (응답 없음)"));
          }, 8000);
          waiting.push(w);
          post({ type: "GAMESDK_MP_JOIN" });
        });
      },
      send: function (data) { if (room.joined) post({ type: "GAMESDK_MP_SEND", data: data }); },
      emote: function (key) { if (room.joined) post({ type: "GAMESDK_MP_EMOTE", key: key }); },
      lock: function (locked) { if (room.joined) post({ type: "GAMESDK_MP_LOCK", locked: locked !== false }); },
      leave: function () {
        if (!room.joined) return;
        room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
        post({ type: "GAMESDK_MP_LEAVE" });
      },
      on: function (name, fn) { if (listeners[name] && typeof fn === "function") listeners[name].push(fn); },
      me: function () { return room.me; },
      players: function () { return room.players.slice(); },
      hostId: function () { return room.hostId; },
      isHost: function () { return !!room.me && room.me.id === room.hostId; },
    },
  };
})();

/* ===== 화면 크기 (고해상도 화면 대응) ===== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ===== 소리 (Web Audio로 직접 만들어요. 첫 입력 뒤에 켜져요) ===== */
let audio = null, muted = false;
function beep(freq, dur = 0.08, type = "square", vol = 0.08) {
  if (!audio || muted) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur);
}
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === "suspended") audio.resume();
}
const muteBtn = document.getElementById("mute");
muteBtn.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  muted = !muted;
  muteBtn.textContent = muted ? "🔇" : "🔊";
  muteBtn.setAttribute("aria-label", muted ? "소리 켜기" : "소리 끄기");
});

/* ===== 입력 (키보드 + 터치/마우스) ===== */
const keys = new Set();
const pointer = { down: false, x: 0, y: 0 };
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Space"].includes(e.key)) e.preventDefault();
  const k = e.code === "KeyA" ? "a" : e.code === "KeyS" ? "s" : e.code === "KeyD" ? "d" : e.key; // 한글 자판에서도 돼요
  if (!keys.has(k) && e !== resumeEvt) onPress(k); // 멈춘 판을 이어간 키는 판정에 안 써요
  keys.add(k);
});
window.addEventListener("keyup", (e) => { keys.delete(e.key); keys.delete(e.code === "KeyA" ? "a" : e.code === "KeyS" ? "s" : e.code === "KeyD" ? "d" : e.key); });
canvas.addEventListener("pointerdown", (e) => {
  if (e === resumeEvt) return; // 멈춘 판을 이어간 탭은 판정에 안 써요
  if (pressButtonAt(e)) return; // 화면 버튼(부품 상자)을 누른 거면 버튼만 처리해요
  pointer.down = true; pointer.x = e.clientX; pointer.y = e.clientY;
  onPress("pointer");
});
canvas.addEventListener("pointermove", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
window.addEventListener("pointerup", (e) => { releaseButton(e); pointer.down = false; });
window.addEventListener("pointercancel", (e) => { releaseButton(e); pointer.down = false; });

/* ===== 부품 상자 (검증된 공통 부품. 필요한 것만 쓰고, 안 쓰는 건 지워도 돼요) =====
   - 화면 버튼:   addButton("jump", "점프", (W, H) => ({ x: W - 90, y: H - 90, w: 72, h: 72 }));
                  buttonDown("jump") → 누르고 있는 동안 true. 누른 순간에는 onPress("btn:jump")가 불려요.
                  버튼 위치는 함수라서 화면 크기가 바뀌면 다시 계산돼요. 크기는 최소 48px로 맞춰져요.
   - 파티클:      burst(x, y, "#f59e0b", 12)   (전체 최대 MAX_PARTICLES개, 넘으면 오래된 것부터 재사용)
   - 점수 팝업:   popup(x, y, "+1", "#fff")     (최대 MAX_POPUPS개)
   - 화면 흔들림: shake(6, 0.15)               (세기 px, 시간 초)
   - 시작/끝 화면: drawTitle(제목, 조작법 한 줄), drawOver(score, best)
   update에서 updateFx(dt), draw 시작에 beginShake(), 끝에 endShake() → drawFx() → drawButtons() 순서로 불러요. */
const buttons = [];
function addButton(id, label, layout) { buttons.push({ id, label, layout, down: false, pid: null }); }
function buttonRect(b) {
  const r = b.layout(W, H);
  const w = Math.max(48, r.w), h = Math.max(48, r.h);
  return { x: r.x - (w - r.w) / 2, y: r.y - (h - r.h) / 2, w, h };
}
function buttonDown(id) { for (const b of buttons) if (b.id === id) return b.down; return false; }
function pressButtonAt(e) {
  if (state !== "play") return false; // 시작·끝 화면에서는 아무 데나 탭하면 시작해요
  for (const b of buttons) {
    const r = buttonRect(b);
    if (e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h) {
      b.down = true; b.pid = e.pointerId;
      onPress("btn:" + b.id);
      return true;
    }
  }
  return false;
}
function releaseButton(e) { for (const b of buttons) if (b.pid === e.pointerId) { b.down = false; b.pid = null; } }
function drawButtons() {
  if (state !== "play") return;
  for (const b of buttons) {
    const r = buttonRect(b);
    ctx.fillStyle = b.down ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.16)";
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(r.x, r.y, r.w, r.h, 14); else ctx.rect(r.x, r.y, r.w, r.h); ctx.fill();
    text(b.label, r.x + r.w / 2, r.y + r.h / 2, 16, "center", "bold");
  }
}

const MAX_PARTICLES = 120, MAX_POPUPS = 12;
const particles = []; let particleNext = 0; // 미리 만든 객체를 돌려 써요 (매 프레임 새로 만들지 않아요)
const popups = []; let popupNext = 0;
for (let i = 0; i < MAX_PARTICLES; i++) particles.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, color: "#fff", size: 3 });
for (let i = 0; i < MAX_POPUPS; i++) popups.push({ x: 0, y: 0, life: 0, text: "", color: "#fff" });
function burst(x, y, color = "#fff", n = 10, speed = 180) {
  for (let i = 0; i < n; i++) {
    const p = particles[particleNext]; particleNext = (particleNext + 1) % MAX_PARTICLES;
    const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.6);
    p.x = x; p.y = y; p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v;
    p.max = p.life = 0.35 + Math.random() * 0.3; p.color = color; p.size = 2 + Math.random() * 3;
  }
}
function popup(x, y, s, color = "#fff") {
  const p = popups[popupNext]; popupNext = (popupNext + 1) % MAX_POPUPS;
  p.x = x; p.y = y; p.life = 0.7; p.text = s; p.color = color;
}
let shakeTime = 0, shakePower = 0;
function shake(power = 6, time = 0.15) { shakePower = Math.max(shakePower, power); shakeTime = Math.max(shakeTime, time); }
function updateFx(dt) {
  for (const p of particles) if (p.life > 0) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; }
  for (const p of popups) if (p.life > 0) { p.life -= dt; p.y -= 50 * dt; }
  if (shakeTime > 0) { shakeTime -= dt; if (shakeTime <= 0) shakePower = 0; }
}
function beginShake() {
  ctx.save();
  if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 2 * shakePower, (Math.random() - 0.5) * 2 * shakePower);
}
function endShake() { ctx.restore(); }
function drawFx() {
  for (const p of particles) if (p.life > 0) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  for (const p of popups) if (p.life > 0) {
    ctx.globalAlpha = Math.min(1, p.life / 0.3);
    text(p.text, p.x, p.y, 18, "center", "bold", p.color);
  }
  ctx.globalAlpha = 1;
}
function clearFx() {
  for (const p of particles) p.life = 0;
  for (const p of popups) p.life = 0;
  shakeTime = 0; shakePower = 0;
  for (const b of buttons) { b.down = false; b.pid = null; }
}
// 화면이 좁으면 글자를 줄이되 14px 밑으로는 안 내려가요
function fitSize(size) { return Math.max(14, Math.round(size * Math.min(1, W / 420))); }
function drawTitle(title, howto) {
  text(title, W / 2, H / 2 - 30, fitSize(36), "center", "bold");
  text(howto, W / 2, H / 2 + 10, fitSize(16));
  text("탭하거나 스페이스를 눌러 시작", W / 2, H / 2 + 50, fitSize(16), "center", "bold", "#f59e0b");
}
function drawOver(score, best) {
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, W, H);
  text("게임 끝", W / 2, H / 2 - 40, fitSize(32), "center", "bold");
  text(`점수 ${score} · 최고 ${best}`, W / 2, H / 2, fitSize(18));
  text("탭하거나 스페이스를 눌러 다시 하기", W / 2, H / 2 + 44, fitSize(16), "center", "bold", "#f59e0b");
}

/* ===== 게임 상태 ===== */
let state = "title"; // title | play | over
let score = 0, best = 0; // 최고 점수는 변수에만 저장해요

// ---- 규칙 상수 (game.json 설명과 같은 값이에요) ----
const SONG_LEN = 60;        // 노래 길이(초)
const PERFECT_WIN = 0.07;   // 완벽 판정 범위(초)
const GOOD_WIN = 0.15;      // 좋아요 판정 범위(초), 지나친 뒤 놓침 기준도 같아요
const PERFECT_PTS = 300, GOOD_PTS = 100;
const COMBO_BONUS_AT = 10, COMBO_MULT = 1.5;
const START_HEARTS = 5, HEART_BONUS = 500;
const BEAT = 0.75, HALF = 0.375;
const LANE_COLORS = ["#FF8FB1", "#FFD84D", "#6FE3B5"];
const LANE_FREQ = [261.63, 329.63, 392.0]; // 도 미 솔
const BASS = [130.81, 110.0, 87.31, 98.0];
const MAX_NOTES = 160;
const nT = new Float32Array(MAX_NOTES), nFall = new Float32Array(MAX_NOTES);
const nLane = new Uint8Array(MAX_NOTES), nSt = new Uint8Array(MAX_NOTES); // 0 대기 1 맞춤 2 놓침
let nCount = 0;

let pausedAt = 0, songStart = 0, song = -1, hearts = START_HEARTS, combo = 0, maxCombo = 0;
let judgeText = "", judgeColor = "#fff", judgeLife = 0;
let heartShake = 0, edgeFlash = 0, nalaJump = 0, overAt = 0, beatIdx = 0, overMsg = "";
const laneFlash = [0, 0, 0];

// 화면 배치 (매 프레임 계산)
let lw = 100, x0 = 0, bh = 64, btnTop = 0, lineY = 0, noteR = 22;
function geo() {
  lw = Math.min(W / 3, 120); x0 = (W - lw * 3) / 2;
  const small = H < 400;
  bh = small ? 52 : 64; btnTop = H - 10 - bh; lineY = btnTop - (small ? 44 : 56);
  noteR = Math.min(lw * 0.3, 24);
}
geo();
function laneX(i) { return x0 + lw * (i + 0.5); }
for (let i = 0; i < 3; i++) addButton("l" + i, "", () => ({ x: x0 + i * lw + 4, y: btnTop, w: lw - 8, h: bh }));

function buildChart() {
  let seed = 12345;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  nCount = 0;
  let t = 2.0, prev = 1;
  while (t <= 57.5 && nCount < MAX_NOTES) {
    let lane = Math.floor(rnd() * 3);
    if (lane === prev && rnd() < 0.6) lane = (lane + 1 + Math.floor(rnd() * 2)) % 3;
    nT[nCount] = t; nLane[nCount] = lane; nSt[nCount] = 0;
    nFall[nCount] = t < 30 ? 1.8 : 1.2; // 30초 뒤부터 빨라져요
    nCount++; prev = lane;
    if (t < 30) t += BEAT;
    else if (t < 45) t += rnd() < 0.5 ? HALF : BEAT;
    else t += rnd() < 0.8 ? HALF : BEAT;
  }
}

function onPress(key) {
  unlockAudio();
  if (state === "title") return startGame();
  if (state === "over") { if (performance.now() - overAt > 800) startGame(); return; }
  let lane = -1;
  if (key === "ArrowLeft" || key === "a" || key === "A") lane = 0;
  else if (key === "ArrowDown" || key === "s" || key === "S") lane = 1;
  else if (key === "ArrowRight" || key === "d" || key === "D") lane = 2;
  else if (key.startsWith("btn:l")) lane = +key.slice(5);
  else if (key === "pointer") lane = Math.max(0, Math.min(2, Math.floor((pointer.x - x0) / lw)));
  if (lane >= 0 && !pausedAt) hitLane(lane, (performance.now() - songStart) / 1000);
}

function pauseGame() { if (state === "play" && !pausedAt) pausedAt = performance.now(); }
// 멈춘 판을 이어간 탭·키(resumeEvt)는 음표 판정으로 넘기지 않아요
let resumeEvt = null;
function resumeGame(e) {
  if (!pausedAt) return;
  if (e && e.target === muteBtn) return; // 소리 버튼은 이어가기가 아니에요
  songStart += performance.now() - pausedAt; pausedAt = 0;
  resumeEvt = e && (e.type === "pointerdown" || e.type === "keydown") ? e : null;
}
document.addEventListener("visibilitychange", () => { document.hidden ? pauseGame() : resumeGame(); });
window.addEventListener("blur", pauseGame);
window.addEventListener("focus", () => resumeGame());
window.addEventListener("pointerdown", resumeGame, true);
window.addEventListener("keydown", resumeGame, true);

function setJudge(s, c) { judgeText = s; judgeColor = c; judgeLife = 0.5; }

function hitLane(lane, tNow) {
  beep(LANE_FREQ[lane], 0.22, "sine", 0.14); // 누를 때마다 도·미·솔
  let bi = -1, bd = 9;
  for (let i = 0; i < nCount; i++) {
    if (nSt[i] !== 0 || nLane[i] !== lane) continue;
    const d = Math.abs(nT[i] - tNow);
    if (d <= GOOD_WIN && d < bd) { bd = d; bi = i; }
  }
  laneFlash[lane] = Math.max(laneFlash[lane], 0.08);
  if (bi < 0) return; // 음표 없는 줄은 감점 없어요
  nSt[bi] = 1; combo++; if (combo > maxCombo) maxCombo = combo;
  const perfect = bd <= PERFECT_WIN;
  let pts = perfect ? PERFECT_PTS : GOOD_PTS;
  if (combo >= COMBO_BONUS_AT) pts = Math.round(pts * COMBO_MULT);
  score += pts;
  setJudge((perfect ? "완벽! +" : "좋아요 +") + pts, perfect ? "#E0457B" : "#2E9E78");
  if (perfect) { laneFlash[lane] = 0.3; burst(laneX(lane), lineY, "#FFD84D", 10, 220); burst(laneX(lane), lineY, "#FFFFFF", 6, 160); }
  else burst(laneX(lane), lineY, LANE_COLORS[lane], 6, 140);
  shake(2, 0.06);
  if (combo === 10 || combo === 20 || combo === 30) { edgeFlash = 0.35; nalaJump = 0.4; beep(784, 0.15, "triangle", 0.1); }
}

function missNote(i) {
  nSt[i] = 2; combo = 0; hearts--;
  setJudge("놓침", "#777");
  heartShake = 0.4; shake(5, 0.2); beep(150, 0.18, "sawtooth", 0.07);
}

function startGame() {
  if (state === "over") GameSDK.newRound();
  state = "play"; score = 0; hearts = START_HEARTS; combo = 0; maxCombo = 0;
  judgeLife = 0; heartShake = 0; edgeFlash = 0; nalaJump = 0; beatIdx = 0; overMsg = "";
  laneFlash[0] = laneFlash[1] = laneFlash[2] = 0;
  clearFx();
  buildChart();
  pausedAt = 0;
  songStart = performance.now() + 1000; // 1.8초 뒤에 노래가 시작돼요 (그 사이 안내를 보여줘요)
  song = -1;
  beep(523, 0.1, "triangle", 0.1);
}

function endGame(cleared) {
  state = "over"; overAt = performance.now();
  if (cleared) {
    const bonus = hearts * HEART_BONUS;
    score += bonus;
    overMsg = "노래를 끝까지 마쳤어요! 하트 보너스 +" + bonus;
    beep(784, 0.3, "triangle", 0.12);
  } else { overMsg = "하트를 모두 잃었어요"; beep(220, 0.3, "sawtooth", 0.08); shake(8, 0.25); }
  best = Math.max(best, score);
  GameSDK.submitScore(score);
}

function playMusicBeat(idx) { // 반주 루프: 한 박자마다 베이스, 반 박자 뒤에 짧은 소리
  if (idx % 2 === 0) beep(BASS[Math.floor(idx / 8) % 4], 0.3, "triangle", 0.08);
  else beep(1400, 0.04, "square", 0.015);
}

function update(dt) {
  updateFx(dt);
  geo();
  for (let i = 0; i < 3; i++) if (laneFlash[i] > 0) laneFlash[i] -= dt;
  if (judgeLife > 0) judgeLife -= dt;
  if (heartShake > 0) heartShake -= dt;
  if (edgeFlash > 0) edgeFlash -= dt;
  if (nalaJump > 0) nalaJump -= dt;
  if (state !== "play" || pausedAt) return;
  song = (performance.now() - songStart) / 1000; // 판정은 이 시계 하나로만 재요
  while (song >= 0 && beatIdx * HALF <= song && beatIdx * HALF < SONG_LEN) { playMusicBeat(beatIdx); beatIdx++; }
  for (let i = 0; i < nCount; i++) {
    if (nSt[i] === 0 && song > nT[i] + GOOD_WIN) { missNote(i); if (hearts <= 0) return endGame(false); }
  }
  if (song >= SONG_LEN) endGame(true);
}

function noteY(i) { return lineY - ((nT[i] - song) / nFall[i]) * (lineY + noteR); }
function drawJelly(x, y, r, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.ellipse(x - r * 0.3, y - r * 0.35, r * 0.28, r * 0.18, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }

function drawNala(x, y, r) {
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#7aa6c4"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.35, r * 1.15, r * 0.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#333";
  ctx.beginPath(); ctx.arc(x - r * 0.38, y - r * 0.1, r * 0.1, 0, Math.PI * 2); ctx.arc(x + r * 0.38, y - r * 0.1, r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.15, r * 0.14, r * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,143,177,.7)";
  ctx.beginPath(); ctx.arc(x - r * 0.62, y + r * 0.25, r * 0.16, 0, Math.PI * 2); ctx.arc(x + r * 0.62, y + r * 0.25, r * 0.16, 0, Math.PI * 2); ctx.fill();
}

// 판정 글자 자리: 판정선과 아래 버튼 사이, 가운데 노라라의 오른쪽. 판정선 위 음표 길과 겹치지 않아요
function judgeBox() {
  const left = W / 2 + 26, room = W - 6 - left;
  const measure = (s) => { ctx.font = `bold ${s}px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`; return ctx.measureText(judgeText).width; };
  let size = 18, tw = measure(size);
  if (tw + 20 > room) { size = 14; tw = measure(size); }
  const ph = size + 10;
  return { x: left, y: (lineY + 3 + btnTop) / 2 - ph / 2, w: Math.min(room, tw + 20), h: ph, size };
}
function drawJudge() {
  const b = judgeBox(), cy = b.y + b.h / 2;
  ctx.globalAlpha = Math.min(1, judgeLife * 4);
  ctx.fillStyle = "rgba(255,255,255,.92)";
  rr(b.x, b.y, b.w, b.h, b.h / 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(b.x + 2, cy - 5); ctx.lineTo(b.x - 6, cy); ctx.lineTo(b.x + 2, cy + 5); ctx.fill(); // 노라라 쪽 꼬리
  text(judgeText, b.x + b.w / 2, cy + 1, b.size, "center", "bold", judgeColor);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = "#CDEBFF"; ctx.fillRect(0, 0, W, H);
  if (state === "title") {
    drawNala(W / 2, H / 2 - Math.min(110, H * 0.3), H < 400 ? 16 : 24);
    text("톡톡 노라라 박자 놀이", W / 2, H / 2 - 30, fitSize(34), "center", "bold", "#E0457B");
    text("음표가 흰 선에 닿을 때 눌러요", W / 2, H / 2 + 8, fitSize(16), "center", "normal", "#333");
    text("키보드는 ← ↓ → (또는 A S D)", W / 2, H / 2 + 32, 14, "center", "normal", "#333");
    text("탭하거나 스페이스를 눌러 시작", W / 2, H / 2 + 62, fitSize(16), "center", "bold", "#C77A00");
    return;
  }
  beginShake();
  // 줄 바탕
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i % 2 ? "rgba(255,255,255,.25)" : "rgba(255,255,255,.4)";
    ctx.fillRect(x0 + i * lw, 0, lw, H);
    if (laneFlash[i] > 0) { ctx.fillStyle = LANE_COLORS[i]; ctx.globalAlpha = Math.min(0.6, laneFlash[i] * 2); ctx.fillRect(x0 + i * lw, 0, lw, lineY + 6); ctx.globalAlpha = 1; }
  }
  // 판정선
  ctx.fillStyle = "#fff"; ctx.fillRect(x0, lineY - 3, lw * 3, 6);
  // 판정 글자: 판정선 아래, 노라라 오른쪽 말풍선. 음표보다 먼저 그려서 음표를 가리지 않아요
  if (judgeLife > 0 && state === "play") drawJudge();
  // 음표
  for (let i = 0; i < nCount; i++) {
    if (nSt[i] === 1) continue;
    const y = noteY(i);
    if (y < -noteR || y > H + noteR) continue;
    drawJelly(laneX(nLane[i]), y, noteR, LANE_COLORS[nLane[i]], nSt[i] === 2 ? 0.3 : 1);
  }
  // 노라라
  const bob = Math.sin(Math.max(0, song) * Math.PI * 2 / BEAT) * 3;
  const jump = nalaJump > 0 ? Math.sin((1 - nalaJump / 0.4) * Math.PI) * 22 : 0;
  drawNala(W / 2, lineY + 24 + bob - jump, 15);
  endShake();
  drawFx();
  // 화면 버튼 (세 칸)
  for (let i = 0; i < 3; i++) {
    const r = buttonRect(buttons[i]);
    ctx.fillStyle = LANE_COLORS[i]; ctx.globalAlpha = buttons[i].down ? 1 : 0.75;
    rr(r.x, r.y, r.w, r.h, 14); ctx.fill(); ctx.globalAlpha = 1;
    text(["←", "↓", "→"][i], r.x + r.w / 2, r.y + r.h / 2, 24, "center", "bold", "#fff");
  }
  // 모서리 번쩍
  if (edgeFlash > 0) { ctx.strokeStyle = "#FFD84D"; ctx.globalAlpha = Math.min(1, edgeFlash * 3); ctx.lineWidth = 10; ctx.strokeRect(5, 5, W - 10, H - 10); ctx.globalAlpha = 1; }
  // HUD
  ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.fillRect(0, 0, W, 4);
  ctx.fillStyle = "#FF8FB1"; ctx.fillRect(0, 0, W * Math.max(0, Math.min(1, song / SONG_LEN)), 4);
  const sh = heartShake > 0 ? Math.sin(heartShake * 60) * 4 : 0;
  for (let i = 0; i < START_HEARTS; i++) text(i < hearts ? "♥" : "♡", 14 + i * 20 + sh, 24, 20, "center", "bold", i < hearts ? "#E0457B" : "#8a9bb0");
  text("점수 " + score, 8, 52, 16, "left", "bold", "#333");
  if (combo >= 2) {
    text(String(combo), W / 2, 30, 26, "center", "bold", combo >= COMBO_BONUS_AT ? "#E0457B" : "#333");
    text("콤보", W / 2, 54, 14, "center", "bold", "#333");
  }
  if (state === "play" && song < 0.1) text("흰 선에 닿을 때 눌러요!", W / 2, H * 0.4, 18, "center", "bold", "#333");
  if (pausedAt && state === "play") { ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(0, 0, W, H); text("잠시 멈췄어요. 탭하면 이어져요", W / 2, H / 2, 18, "center", "bold", "#fff"); }
  if (state === "over") {
    drawOver(score, best);
    text(overMsg, W / 2, H / 2 + 22, 14, "center", "normal", "#fff");
  }
}
// ---- 여기까지 ----

function text(s, x, y, size, align = "center", weight = "normal", color = "#fff") {
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  ctx.fillText(s, x, y);
}

/* ===== 메인 루프 (프레임 사이 시간이 길어져도 한 번에 0.05초까지만 진행) ===== */
let last = performance.now();
function loop(now) {
  const gap = now - last;
  if (gap > 250 && state === "play" && !pausedAt) songStart += gap - 16; // 한 프레임이 크게 튀면 그만큼 노래 시계를 밀어요
  const dt = Math.min(0.05, gap / 1000);
  last = now;
  // iframe 크기가 늦게 잡히면 resize 이벤트가 안 올 수 있어서 매 프레임 확인해요
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
