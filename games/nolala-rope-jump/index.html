<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>폴짝폴짝 노라라 줄넘기 대회</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fdcff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;

  .btn {

  #mute { right: 8px; }
  #emo { right: 62px; display: none; }
  #emoPanel {
    position: fixed; top: 58px; right: 8px; display: none; grid-template-columns: 1fr 1fr; gap: 4px;
    padding: 6px; border-radius: 14px; background: rgba(255,255,255,.94); box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  #emoPanel button {
    height: 48px; min-width: 116px; border: 0; border-radius: 10px; background: #eef4fa; color: #223;

<body>
<canvas id="game"></canvas>
<button id="mute" class="btn" aria-label="소리 끄기">🔊</button>
<button id="emo" class="btn" aria-label="이모티콘">😊</button>
<div id="emoPanel">
  <button data-k="hi">👋 안녕!</button><button data-k="gg">🤝 GG</button>
  <button data-k="again">🔁 한 판 더</button><button data-k="wow">😮 대단해요</button>
  <button data-k="oops">😅 앗</button><button data-k="thanks">🙏 고마워요</button>
</div>
<script>
/* ===== 게임 SDK: 리더보드 + 멀티 (public/sdk.js와 같은 코드. 지우지 마세요) ===== */
/* 멀티 게임 쓰는 법은 games/README.md의 "멀티 게임"을 보세요 */
(function () {
  var sent = false;
  var standalone = window.parent === window; // 파일을 직접 열었을 때
  var listeners = { message: [], players: [], emote: [], error: [] };
  var room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
  var waiting = [];

  function post(msg) {
    if (!standalone) window.parent.postMessage(msg, "*");
  }
  function emit(name, a, b) {
    var list = listeners[name] || [];
    for (var i = 0; i < list.length; i++) {
      try { list[i](a, b); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }
  function settle(ok, value) {
    var list = waiting;
    waiting = [];
    for (var i = 0; i < list.length; i++) {
      clearTimeout(list[i].timer);
      ok ? list[i].resolve(value) : list[i].reject(new Error(value));
    }
  }

  window.addEventListener("message", function (event) {
    if (standalone || event.source !== window.parent) return; // 바깥 플레이 페이지에서 온 것만
    var m = event.data;
    if (!m || typeof m !== "object") return;
    if (m.type === "GAMESDK_MP_JOINED") {
      room = { joined: true, roomId: m.roomId, me: m.me, players: m.players || [], hostId: m.hostId, maxPlayers: m.maxPlayers };
      settle(true, { roomId: room.roomId, me: room.me, players: room.players, hostId: room.hostId, maxPlayers: room.maxPlayers });
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_PLAYERS") {
      room.players = m.players || [];
      room.hostId = m.hostId;
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_MESSAGE") {
      emit("message", m.data, m.from);
    } else if (m.type === "GAMESDK_MP_EMOTE") {
      emit("emote", m.key, m.from);
    } else if (m.type === "GAMESDK_MP_ERROR") {
      if (!room.joined) settle(false, m.message);
      emit("error", m.message);
    }
  });

  window.GameSDK = {
    submitScore: function (score) {
      if (sent) return; // 한 판에 한 번만
      if (typeof score !== "number" || !isFinite(score)) return;
      sent = true;
      post({ type: "GAMESDK_SCORE", score: score });
    },
    // 새 판을 시작할 때 부르면 다시 점수를 보낼 수 있어요.
    newRound: function () {
      sent = false;
      post({ type: "GAMESDK_NEW_ROUND" });
    },
    multi: {
      join: function () {
        return new Promise(function (resolve, reject) {
          if (standalone) return reject(new Error("사이트 밖에서는 멀티를 쓸 수 없어요"));
          var w = { resolve: resolve, reject: reject, timer: 0 };
          w.timer = setTimeout(function () {
            waiting = waiting.filter(function (x) { return x !== w; });
            reject(new Error("방에 들어가지 못했어요 (응답 없음)"));
          }, 8000);
          waiting.push(w);
          post({ type: "GAMESDK_MP_JOIN" });
        });
      },
      send: function (data) { if (room.joined) post({ type: "GAMESDK_MP_SEND", data: data }); },
      emote: function (key) { if (room.joined) post({ type: "GAMESDK_MP_EMOTE", key: key }); },
      lock: function (locked) { if (room.joined) post({ type: "GAMESDK_MP_LOCK", locked: locked !== false }); },
      leave: function () {
        if (!room.joined) return;
        room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
        post({ type: "GAMESDK_MP_LEAVE" });
      },
      on: function (name, fn) { if (listeners[name] && typeof fn === "function") listeners[name].push(fn); },
      me: function () { return room.me; },
      players: function () { return room.players.slice(); },
      hostId: function () { return room.hostId; },
      isHost: function () { return !!room.me && room.me.id === room.hostId; },
    },
  };
})();

/* ===== 화면 크기 ===== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ===== 소리 (Web Audio) ===== */
let audio = null, muted = false;
function tone(f0, f1, dur, type, vol) {
  if (!audio || muted) return;
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  jump() { tone(380, 760, 0.12, "sine", 0.13); },          // 퐁
  whoosh() { tone(520, 130, 0.1, "triangle", 0.05); },     // 휙
  hit() { tone(170, 55, 0.24, "square", 0.12); },          // 뚝
  other() { tone(220, 110, 0.12, "square", 0.04); },
  combo() { tone(660, 990, 0.1, "square", 0.07); setTimeout(() => tone(990, 1320, 0.14, "square", 0.07), 90); },
  join() { tone(500, 800, 0.1, "sine", 0.08); },
  start() { tone(440, 880, 0.18, "triangle", 0.1); },
};
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === "suspended") audio.resume();
}
const muteBtn = document.getElementById("mute");
muteBtn.addEventListener("pointerdown", (e) => {
  e.stopPropagation(); e.preventDefault(); unlockAudio();
  muted = !muted;
  muteBtn.textContent = muted ? "🔇" : "🔊";
  muteBtn.setAttribute("aria-label", muted ? "소리 켜기" : "소리 끄기");
});

/* ===== 효과 부품 (파티클·점수 팝업·흔들림) ===== */
const MAX_PARTICLES = 100, MAX_POPUPS = 10;
const particles = [], popups = []; let particleNext = 0, popupNext = 0;
for (let i = 0; i < MAX_PARTICLES; i++) particles.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, color: "#fff", size: 3 });
for (let i = 0; i < MAX_POPUPS; i++) popups.push({ x: 0, y: 0, life: 0, text: "", color: "#fff" });
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const p = particles[particleNext]; particleNext = (particleNext + 1) % MAX_PARTICLES;
    const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.6);
    p.x = x; p.y = y; p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v - speed * 0.3;
    p.max = p.life = 0.3 + Math.random() * 0.3; p.color = color; p.size = 2 + Math.random() * 3;
  }
}
function popup(x, y, s, color) {
  const p = popups[popupNext]; popupNext = (popupNext + 1) % MAX_POPUPS;
  p.x = x; p.y = y; p.life = 0.8; p.text = s; p.color = color || "#fff";
}
let shakeTime = 0, shakePower = 0;
function shake(power, time) { shakePower = Math.max(shakePower, power); shakeTime = Math.max(shakeTime, time); }
function updateFx(dt) {
  for (const p of particles) if (p.life > 0) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; }
  for (const p of popups) if (p.life > 0) { p.life -= dt; p.y -= 44 * dt; }
  if (shakeTime > 0) { shakeTime -= dt; if (shakeTime <= 0) shakePower = 0; }
}
function beginShake() {
  ctx.save();
  if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 2 * shakePower, (Math.random() - 0.5) * 2 * shakePower);
}
function endShake() { ctx.restore(); }
function drawFx() {
  for (const p of particles) if (p.life > 0) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  for (const p of popups) if (p.life > 0) {
    ctx.globalAlpha = Math.min(1, p.life / 0.3);
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.45)";
    textLine(p.text, p.x, p.y, 18, "center", "bold", p.color, true);
  }
  ctx.globalAlpha = 1;
}
function textLine(s, x, y, size, align, weight, color, stroke) {
  ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  if (stroke) ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
// 글자가 화면보다 넓으면 14px까지 줄여서 맞춰요
function text(s, x, y, size, align = "center", weight = "normal", color = "#fff", maxW = 0) {
  const lim = maxW || W - 16;
  ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  const w = ctx.measureText(s).width;
  if (w > lim) size = Math.max(14, Math.floor(size * lim / w));
  textLine(s, x, y, size, align, weight, color, false);
}

/* ===== 규칙 상수 ===== */
const AIR = 0.38;            // 점프 체공 시간(초). 가장 빠른 한 바퀴 0.8초의 절반(0.4)보다 짧아요
const LO = 0.1, HI = 0.9;    // 체공 앞뒤 10%는 너그럽게 봐줘요 (그 사이에 줄이 지나가면 통과)
const MAXT = 90;             // 한 판 최대 90초
const PASS0 = 2.2;           // 첫 줄이 바닥을 지나는 시각(초)
const PASS = [], PAIR = [];  // 줄이 바닥을 지나는 시각 / 0 보통, 1 따닥 첫째, 2 따닥 둘째 (모두 같은 값을 각자 계산해요)
function periodAt(t) {
  if (t < 10) return 1.4;
  if (t < 30) return 1.4 - (t - 10) / 20 * 0.4;
  if (t < 60) return 1.0 - (t - 30) / 30 * 0.2;
  return 0.8;
}
(function buildPasses() {
  let t = PASS0, k = 0, prev = 0;
  while (t < MAXT + 3) {
    let kind = 0;
    if (prev === 1) kind = 2;
    else if (t >= 58 && k % 5 === 2) kind = 1;
    PASS.push(t); PAIR.push(kind);
    t += kind === 1 ? 0.5 : kind === 2 ? 0.9 : periodAt(t);
    prev = kind; k++;
  }
})();
const BOT_NAMES = ["몽실", "보리", "콩이"];
const OTHER_COLORS = ["#f472b6", "#38bdf8", "#a78bfa", "#34d399"];
const EMO = { hi: "👋", gg: "🤝", again: "🔁", wow: "😮", oops: "😅", thanks: "🙏" };

/* ===== 상태 ===== */
let state = "title"; // title | lobby | play | over
let best = 0, rounds = 0;
let seed = 1, t0 = 0, gt = -9, passIdx = 0, warned = -1;
let skipT = -1, resumeFlag = false, inputBlock = 0, endAt = -1;
let liveSeen = -1e9, overAt = 0, lobbyAt = 0, lastState = 0, lastSend = 0, lastEmote = -1e9, submitted = false;
let mySlot = 0;
const slots = [];
for (let i = 0; i < 4; i++) slots.push({ id: "", name: "", bot: true, alive: true, score: 0, combo: 0, js: -99, jt: 0, plan: -1, surv: true, did: false, deathAt: 0, starT: 0, emote: "", emoteUntil: 0, buf: -1, cx: 0 });
const rankOrder = [0, 1, 2, 3];

function hash(a, b) {
  let h = (seed ^ Math.imul(a + 1, 0x9e3779b1) ^ Math.imul(b + 1, 0x85ebca6b)) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
const BOT_SKILL = [1, 1.2, 0.8, 1.1];
function botSurvives(i, k) { // 컴퓨터 친구가 이번 줄을 넘는지. 모든 화면이 같은 답을 내요
  const p = (PAIR[k] === 2 ? 0.14 : 0.01 + 0.0005 * k) * BOT_SKILL[i];
  return hash(i, k) >= p;
}

/* ===== 멀티 연결 ===== */
const MP = GameSDK.multi;
let online = false, joinState = "pending"; // pending | ok | fail
let myId = "me", hostId = "me";
let humans = [{ id: "me", name: "나" }];
const nameCache = {};
function cleanName(n) { return String(n == null ? "" : n).replace(/[\u0000-\u001f\u007f]/g, "").trim().slice(0, 6) || "친구"; }
const amHost = () => !online || hostId === myId;
function humanCount() { let n = 0; for (const s of slots) if (!s.bot) n++; return n; }
function netOthers() { return online && humanCount() > 1; }

GameSDK.multi.join().then((room) => {
  online = true; joinState = "ok";
  const old = myId;
  myId = String(room.me && room.me.id != null ? room.me.id : "me").slice(0, 64);
  for (const h of humans) if (h.id === old) h.id = myId;
  if (hostId === old) hostId = myId;
  applyPlayers(room.players, room.hostId);
}).catch(() => { joinState = "fail"; online = false; });
MP.on("players", (players, host) => { if (online) applyPlayers(players, host); });
MP.on("message", (data, from) => onNet(data, String(from)));
MP.on("emote", (key, from) => showEmote(String(from), key));

function applyPlayers(players, host) {
  const before = humans.length;
  const list = [];
  if (Array.isArray(players)) {
    for (const p of players) {
      if (!p || p.id == null) continue;
      const id = String(p.id).slice(0, 64);
      nameCache[id] = cleanName(p.name);
      list.push({ id, name: nameCache[id] });
      if (list.length >= 8) break;
    }
  }
  if (!list.some((h) => h.id === myId)) list.unshift({ id: myId, name: "나" });
  humans = list;
  hostId = host != null ? String(host) : myId;
  if (humans.length > before && before > 0) {
    sfx.join(); lobbyAt = performance.now();
    if (state !== "play") note(`${humans[humans.length - 1].name}님이 들어왔어요`, "", 1800, 1);
  }
  if (state === "play") { // 나간 사람은 걸린 걸로 해요
    for (let i = 0; i < 4; i++) {
      const s = slots[i];
      if (!s.bot && s.alive && i !== mySlot && !humans.some((h) => h.id === s.id)) kill(i, gt, true);
    }
  }
}

function slotOf(id) { for (let i = 0; i < 4; i++) if (!slots[i].bot && slots[i].id === id) return i; return -1; }

function onNet(d, from) {
  if (!d || typeof d !== "object") return;
  if (d.t === "start") {
    if (from !== hostId || !Array.isArray(d.sl)) return;
    applyStart(d.sl, d.seed | 0, Math.max(0, Math.min(5000, +d.d || 1800)));
    return;
  }
  if (d.t === "st" && from === hostId) liveSeen = performance.now();
  if (state === "title" || state === "lobby") return;
  const i = slotOf(from);
  if (i < 0 || i === mySlot) return;
  const s = slots[i];
  if (d.t === "j") {
    if (typeof d.c === "number") s.score = Math.max(s.score, d.c | 0);
    if (state === "play" && s.alive && gt >= s.js + AIR) { s.js = gt - 0.04; burst(s.cx, gy, "#d6c08a", 5, 80); }
  } else if (d.t === "out") {
    if (typeof d.c === "number") s.score = Math.max(s.score, d.c | 0);
    if (s.alive && state === "play") kill(i, typeof d.at === "number" ? d.at : gt, true);
    if (state === "over") computeRank();
  } else if (d.t === "fin") {
    if (typeof d.c === "number") s.score = Math.max(s.score, d.c | 0);
    if (state === "over") computeRank();
  } else if (d.t === "st" && from === hostId && Array.isArray(d.a) && Array.isArray(d.c) && state === "play") {
    for (let k = 0; k < 4 && k < d.a.length; k++) {
      const o = slots[k];
      if (o.bot || k === mySlot) continue;
      if (typeof d.c[k] === "number") o.score = Math.max(o.score, d.c[k] | 0);
      if (d.a[k] === 0 && o.alive) kill(k, gt, true);
    }
  }
}

function showEmote(id, k) {
  const icon = EMO[k];
  if (!icon) return;
  const i = slotOf(id);
  if (i >= 0) { slots[i].emote = icon; slots[i].emoteUntil = performance.now() + 2200; }
}
function sendEmote(k) {
  const now = performance.now();
  if (!EMO[k] || !online || now - lastEmote < 1500) return;
  lastEmote = now; MP.emote(k);
  if (mySlot >= 0) { slots[mySlot].emote = EMO[k]; slots[mySlot].emoteUntil = now + 2200; }
}
const emoBtn = document.getElementById("emo"), emoPanel = document.getElementById("emoPanel");
let emoOpen = false, emoShown = false;
function setEmoOpen(v) { emoOpen = v; emoPanel.style.display = v ? "grid" : "none"; }
emoBtn.addEventListener("pointerdown", (e) => { e.stopPropagation(); e.preventDefault(); unlockAudio(); setEmoOpen(!emoOpen); });
emoPanel.addEventListener("pointerdown", (e) => {
  e.stopPropagation(); e.preventDefault();
  const b = e.target && e.target.closest ? e.target.closest("button") : null;
  if (b) sendEmote(b.getAttribute("data-k"));
  setEmoOpen(false);
});

/* ===== 안내 칸 (HUD 아래 한 곳에 한 번에 하나만) ===== */
let nMain = "", nSub = "", nColor = "#fff", nUntil = 0, nPrio = 0, nBig = false;
function note(main, sub, ms, prio, color, big) {
  const now = performance.now();
  if (now < nUntil && prio < nPrio) return;
  nMain = main; nSub = sub || ""; nUntil = now + ms; nPrio = prio; nColor = color || "#fff"; nBig = !!big;
}

/* ===== 판 시작·진행 ===== */
function resetSlot(s) {
  s.alive = true; s.score = 0; s.combo = 0; s.js = -99; s.jt = 0; s.plan = -1; s.surv = true; s.did = false;
  s.deathAt = 0; s.starT = 0; s.emote = ""; s.emoteUntil = 0; s.buf = -1;
}
function hostStart() {
  if (!amHost()) return;
  const sl = [];
  const list = online ? humans : [{ id: myId, name: "나" }];
  for (const h of list) if (sl.length < 4) sl.push([h.id, h.name]);
  let b = 0;
  while (sl.length < 4) sl.push(["", BOT_NAMES[b++ % 3]]);
  const sd = (Math.random() * 1e9) | 0 || 1;
  if (online) { MP.lock(true); MP.send({ t: "start", d: 1800, seed: sd, sl }); }
  applyStart(sl, sd, 1800);
}
function applyStart(sl, sd, d) {
  if (rounds > 0) GameSDK.newRound();
  rounds++; submitted = false;
  seed = sd; mySlot = -1;
  for (let i = 0; i < 4; i++) {
    const s = slots[i], e = Array.isArray(sl[i]) ? sl[i] : [""];
    resetSlot(s);
    s.id = String(e[0] || "").slice(0, 64); s.bot = !s.id;
    s.name = s.bot ? BOT_NAMES[i % 3] : (s.id === myId ? "나" : nameCache[s.id] || "친구");
    if (s.id === myId) mySlot = i;
  }

function judgePass(k) {
  const P = PASS[k];
  let sound = false;
  for (let i = 0; i < 4; i++) {
    const s = slots[i];
    if (!s.alive) continue;
    if (s.bot) {

      else { s.score++; s.combo++; if (s.combo % 5 === 0) s.score += 2; }
    } else if (i === mySlot) {
      if (P < skipT) continue; // 탭을 오래 떠났다 돌아온 직후는 봐줘요
      sound = true;
      const u = (P - s.js) / AIR;
      if (u >= LO && u <= HI) {

function update(dt) {

  }

  while (passIdx < PASS.length && gt >= PASS[passIdx]) { judgePass(passIdx); passIdx++; }

}

  const cy = HUD_H + (H - HUD_H) * 0.4;
  ctx.fillStyle = "rgba(0,0,0,.72)";
  const pw = Math.min(W - 16, 380), ph = 190;
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(W / 2 - pw / 2, cy - 95, pw, ph, 20); else ctx.rect(W / 2 - pw / 2, cy - 95, pw, ph); ctx.fill();
  const fs = Math.max(24, Math.round(36 * Math.min(1, W / 420)));
  text("폴짝폴짝 노라라", W / 2, cy - 58, fs, "center", "bold", "#fff", pw - 20);
  text("줄넘기 대회", W / 2, cy - 58 + fs * 1.15, fs, "center", "bold", "#fde047", pw - 20);
  text("탭·스페이스로 점프해서 줄을 넘어요", W / 2, cy + 28, 16, "center", "normal", "#fff", pw - 20);
  text("탭하거나 스페이스를 눌러 시작", W / 2, cy + 62, 16, "center", "bold", "#f59e0b", pw - 20);
}
function draw() {
  beginShake();
  drawScene();
  if (state !== "title") drawChars();
  drawRope();
  endShake();
  drawFx();
  if (state !== "title") {
    drawHud();
    if (state === "over") drawResult(); else drawNotice();
  } else drawTitle();
  const wantEmo = online && humans.length > 1 && state !== "title";
  if (wantEmo !== emoShown) { emoShown = wantEmo; emoBtn.style.display = wantEmo ? "block" : "none"; if (!wantEmo) setEmoOpen(false); }
}

/* ===== 메인 루프 ===== */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
layout();
requestAnimationFrame(loop);
</script>
</body>
