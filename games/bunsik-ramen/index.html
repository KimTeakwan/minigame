/* 멀티 게임 쓰는 법은 games/README.md의 "멀티 게임"을 보세요 */
(function () {
  var sent = false;
  var standalone = window.parent === window; // 파일을 직접 열었을 때
  var listeners = { message: [], players: [], emote: [], error: [] };
  var room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
  var waiting = [];

  function post(msg) {
    if (!standalone) window.parent.postMessage(msg, "*");
  }
  function emit(name, a, b) {
    var list = listeners[name] || [];
    for (var i = 0; i < list.length; i++) {
      try { list[i](a, b); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }
  function settle(ok, value) {
    var list = waiting;
    waiting = [];
    for (var i = 0; i < list.length; i++) {
      clearTimeout(list[i].timer);
      ok ? list[i].resolve(value) : list[i].reject(new Error(value));
    }
  }

  window.addEventListener("message", function (event) {
    if (standalone || event.source !== window.parent) return; // 바깥 플레이 페이지에서 온 것만
    var m = event.data;
    if (!m || typeof m !== "object") return;
    if (m.type === "GAMESDK_MP_JOINED") {
      room = { joined: true, roomId: m.roomId, me: m.me, players: m.players || [], hostId: m.hostId, maxPlayers: m.maxPlayers };
      settle(true, { roomId: room.roomId, me: room.me, players: room.players, hostId: room.hostId, maxPlayers: room.maxPlayers });
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_PLAYERS") {
      room.players = m.players || [];
      room.hostId = m.hostId;
      emit("players", room.players, room.hostId);
    } else if (m.type === "GAMESDK_MP_MESSAGE") {
      emit("message", m.data, m.from);
    } else if (m.type === "GAMESDK_MP_EMOTE") {
      emit("emote", m.key, m.from);
    } else if (m.type === "GAMESDK_MP_ERROR") {
      if (!room.joined) settle(false, m.message);
      emit("error", m.message);
    }
  });

  window.GameSDK = {
    submitScore: function (score) {
      if (sent) return; // 한 판에 한 번만
      if (typeof score !== "number" || !isFinite(score)) return;
      sent = true;
      post({ type: "GAMESDK_SCORE", score: score });
    },
    // 새 판을 시작할 때 부르면 다시 점수를 보낼 수 있어요.
    newRound: function () {
      sent = false;
      post({ type: "GAMESDK_NEW_ROUND" });
    },
    multi: {
      join: function () {
        return new Promise(function (resolve, reject) {
          if (standalone) return reject(new Error("사이트 밖에서는 멀티를 쓸 수 없어요"));
          var w = { resolve: resolve, reject: reject, timer: 0 };
          w.timer = setTimeout(function () {
            waiting = waiting.filter(function (x) { return x !== w; });
            reject(new Error("방에 들어가지 못했어요 (응답 없음)"));
          }, 8000);
          waiting.push(w);
          post({ type: "GAMESDK_MP_JOIN" });
        });
      },
      send: function (data) { if (room.joined) post({ type: "GAMESDK_MP_SEND", data: data }); },
      emote: function (key) { if (room.joined) post({ type: "GAMESDK_MP_EMOTE", key: key }); },
      lock: function (locked) { if (room.joined) post({ type: "GAMESDK_MP_LOCK", locked: locked !== false }); },
      leave: function () {
        if (!room.joined) return;
        room = { joined: false, roomId: null, me: null, players: [], hostId: null, maxPlayers: 0 };
        post({ type: "GAMESDK_MP_LEAVE" });
      },
      on: function (name, fn) { if (listeners[name] && typeof fn === "function") listeners[name].push(fn); },
      me: function () { return room.me; },
      players: function () { return room.players.slice(); },
      hostId: function () { return room.hostId; },
      isHost: function () { return !!room.me && room.me.id === room.hostId; },
    },
  };
})();

}

const fontCache = {};
function font(size, bold) {
  size = Math.round(Math.max(14, size)); // 화면 글자는 14px보다 작게 쓰지 않아요
  const k = bold ? size + 1000 : size;
  return fontCache[k] || (fontCache[k] = (bold ? "bold " : "") + size + "px " + FONT_FAMILY);
}
function text(s, x, y, size, color, bold, align) {
  ctx.font = font(size, bold); ctx.fillStyle = color; ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}
function textW(s, size, bold) { ctx.font = font(size, bold); return ctx.measureText(s).width; }
function fitSize(s, maxW, size, bold) {
  const w = textW(s, size, bold);
  if (w <= maxW) return size;
  return Math.max(14, Math.floor(size * maxW / w));
}
const wrapCache = new Map();
function wrapLines(s, maxW, size, bold) {
  const key = size + "|" + (bold ? 1 : 0) + "|" + Math.round(maxW) + "|" + s;
  let v = wrapCache.get(key);
  if (v) return v;
  ctx.font = font(size, bold);
  const words = s.split(" ");
  v = [];
  let cur = "";
  for (let i = 0; i < words.length; i++) {
    const t = cur ? cur + " " + words[i] : words[i];
    if (!cur || ctx.measureText(t).width <= maxW) cur = t;
    else { v.push(cur); cur = words[i]; }
  }
  if (cur) v.push(cur);
  if (wrapCache.size > 300) wrapCache.clear();
  wrapCache.set(key, v);
  return v;
}

/* ----- 도형 ----- */
function rrPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); }
function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2); }
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 0.9, y - s * 0.25, x - s * 0.35, y - s * 0.85, x, y - s * 0.3);
  ctx.bezierCurveTo(x + s * 0.35, y - s * 0.85, x + s * 0.9, y - s * 0.25, x, y + s * 0.35);
  ctx.closePath();
}
function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function checkMark(x, y, s, color, lw) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(x - s * 0.5, y); ctx.lineTo(x - s * 0.12, y + s * 0.38); ctx.lineTo(x + s * 0.55, y - s * 0.42); ctx.stroke();
}
function crossMark(x, y, s, color, lw) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - s * 0.4, y - s * 0.4); ctx.lineTo(x + s * 0.4, y + s * 0.4);

}

/* ===== 소리 (Web Audio로 직접 만들어요. 첫 입력 뒤에 켜져요) ===== */
let audio = null, muted = false, noiseBuf = null;
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === "suspended") audio.resume();
}
function tone(f0, dur, type, vol, delay, f1) {
  if (!audio || muted) return;
  const t0 = audio.currentTime + (delay || 0);
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(audio.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol, f0, f1, ftype, delay, q) {
  if (!audio || muted) return;
  if (!noiseBuf) {
    noiseBuf = audio.createBuffer(1, Math.floor(audio.sampleRate * 0.7), audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t0 = audio.currentTime + (delay || 0);
  const s = audio.createBufferSource(); s.buffer = noiseBuf;
  const f = audio.createBiquadFilter(); f.type = ftype || "bandpass"; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = audio.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f).connect(g).connect(audio.destination);
  s.start(t0, Math.random() * 0.1); s.stop(t0 + dur + 0.03);
}

/* ===== 레이아웃 (창 크기에 맞춰 다시 배치) ===== */
let L = null;
function computeLayout() {
  if (W < 120 || H < 120) { L = null; return; }

  const port = !land && W < H * 0.95;
  const o = { mode: land ? "land" : port ? "port" : "pc", tops: [] };
  let x0, cw;
  if (o.mode === "port") {
    const hudH = Math.round(clamp(H * 0.066, 50, 60));
    const pad = clamp(W * 0.026, 6, 16), gap = clamp(H * 0.012, 6, 12);
    const btnH = clamp(H * 0.085, 56, 84), serveH = clamp(H * 0.095, 56, 88);
    const bottomPad = clamp(H * 0.03, 8, 40);
    const serveY = H - bottomPad - serveH, topY = serveY - gap - btnH, ctrlY = topY - gap;
    const shopH = Math.round((ctrlY - hudH) * 0.47);
    o.hud = R(0, 0, W, hudH);
    o.shop = R(0, hudH, W, shopH);
    o.kit = R(0, hudH + shopH, W, ctrlY - hudH - shopH);
    o.ctrl = R(0, ctrlY, W, H - ctrlY);
    const bw = (W - 2 * pad - 3 * gap) / 4;
    for (let i = 0; i < 4; i++) o.tops.push(R(pad + i * (bw + gap), topY, bw, btnH));
    o.serve = R(pad, serveY, W - 2 * pad, serveH);
    x0 = 0; cw = W;
  } else if (o.mode === "pc") {
    const s = Math.min(W / 800, H / 600);
    o.sc = s;
    cw = Math.min(W - 20, 780 * Math.max(s, 0.7));
    x0 = (W - cw) / 2;
    const hudH = Math.round(clamp(44 * s, 44, 60));
    const rowH = clamp(84 * s, 60, 112);
    const bottomPad = clamp(14 * s, 8, 24), gap = clamp(10 * s, 6, 14);
    const rowY = H - bottomPad - rowH, ctrlY = rowY - gap;
    const shopH = Math.round((ctrlY - hudH) * 0.49);
    o.hud = R(0, 0, W, hudH);
    o.shop = R(0, hudH, W, shopH);
    o.kit = R(0, hudH + shopH, W, ctrlY - hudH - shopH);
    o.ctrl = R(0, ctrlY, W, H - ctrlY);
    const serveW = cw * 0.36, tw = (cw - serveW - 4 * gap) / 4;
    for (let i = 0; i < 4; i++) o.tops.push(R(x0 + i * (tw + gap), rowY, tw, rowH));
    o.serve = R(x0 + 4 * (tw + gap), rowY, serveW, rowH);
  } else {
    const hudH = 40, leftW = Math.round(W * 0.6);
    const shopH = Math.round((H - hudH) * 0.48);
    o.hud = R(0, 0, W, hudH);
    o.shop = R(0, hudH, leftW, shopH);
    o.kit = R(0, hudH + shopH, leftW, H - hudH - shopH);
    o.ctrl = R(leftW, hudH, W - leftW, H - hudH);
    const px = leftW + 10, pw = W - leftW - 20, top = 60, bottom = H - 8, gap = 8, hintH = 44;
    const room = bottom - top - hintH - 3 * gap;
    const bh = clamp(room * 0.27, 50, 76);
    const sh = clamp(room - 2 * bh, 56, 92);
    const used = 2 * bh + sh + hintH + 3 * gap;
    let y = top + Math.max(0, (bottom - top - used) / 2);
    const bw = (pw - gap) / 2;
    o.tops.push(R(px, y, bw, bh), R(px + bw + gap, y, bw, bh), R(px, y + bh + gap, bw, bh), R(px + bw + gap, y + bh + gap, bw, bh));

function layoutShop(o, x0, cw) {

  pw = Math.max(pw, 44);

function resetRound() {

  G.tutorial = true; G.phaseShown = 0; G.introRice = false; G.introCheese = false; G.lastKind = -1; G.lastShirt = -1;
  G.shake = 0; G.smileT = 0; G.sadT = 0; G.bump = 0; G.overT = 0; G.final = 0; G.newBest = false; G.hold = 0;
  for (let i = 0; i < 2; i++) { const p = pots[i]; p.st = "empty"; p.t = 0; p.dinged = false; p.flash = 0; p.shake = 0; p.steamAcc = 0; }
  pots[0].st = "boil"; // 개점 준비: 왼쪽 냄비는 이미 보글보글

function startGame() {
  if (state === "over") GameSDK.newRound();
  resetRound();
  state = "play";
  SFX.start();
}

function endGame() {
  if (state !== "play") return;
  state = "over";
  G.overT = 0;
  for (let i = 0; i < queue.length; i++) { const c = queue[i]; c.react = 4; c.rt = 0; leavers.push(c); G.home++; }
  queue.length = 0;
  G.final = Math.round(G.score);
  G.shown = G.final;
  G.newBest = G.final > best && G.final > 0;
  best = Math.max(best, G.final);
  G.sAmount = fmt(G.final) + "원";
  G.sBest = "최고 매출 " + fmt(best) + "원";
  G.sStat1 = "만족 " + G.good + " · 아쉬움 " + G.bad + " · 돌아간 손님 " + G.left;
  G.sStat2 = "최대 콤보 " + G.maxCombo;
  GameSDK.submitScore(G.final);

/* ===== 손님 ===== */
function spawnCustomer() {
  const idx = G.spawnIdx++;
  const rng = G.rng;
  const r0 = rng(), r1 = rng(), r2 = rng(), r3 = rng(), r4 = rng(), r5 = rng(); // 손님마다 항상 6번 뽑아서 매 판 같은 순서가 나와요
  const ph = phaseIdx(G.t);
  const need = [0, 0, 0, 0];
  let kind = Math.floor(r0 * 4), shirt = Math.floor(r1 * 4);
  if (idx === 0) { kind = 0; shirt = 0; need[0] = 1; }        // 첫 주문: 라면+계란 (토끼)
  else if (idx === 1) { kind = 1; shirt = 1; need[1] = 1; }   // 둘째: 라면+파 (고양이)
  else {
    if (ph === 0) { if (r2 >= 0.45) need[r3 < 0.5 ? 0 : 1]++; }
    else if (ph === 1) {
      let a = Math.floor(r3 * 3);
      if (!G.introRice) { a = 2; G.introRice = true; }
      need[a]++;
      if (r2 >= 0.5) { let b = Math.floor(r4 * 2); if (b >= a) b++; need[b]++; }
    } else {
      let a = Math.floor(r3 * 4);
      if (!G.introCheese) { a = 3; G.introCheese = true; }
      need[a]++; need[Math.floor(r4 * 4)]++;
      if (r2 >= 0.5) need[Math.floor(r5 * 4)]++;
    }
    if (kind === G.lastKind && shirt === G.lastShirt) shirt = (shirt + 1) % 4;
  }
  const list = [];
  for (let k = 0; k < 4; k++) for (let j = 0; j < need[k]; j++) list.push(k);
  const pat = PHASES[ph].pat + 6 * queue.length; // 줄 뒤에 선 손님은 앞사람 1명당 +6초
  queue.push({ kind: kind, shirt: shirt, need: need, list: list, patMax: pat, pat: pat, x: L ? L.enterX : W + 60, from: L ? L.enterX : W + 60,
    walkT: 0, arrived: false, react: -1, rt: 0, seed: idx });
  G.lastKind = kind; G.lastShirt = shirt;
}
function removeFront(i, react) {
  const c = queue[i];
  queue.splice(i, 1);
  c.react = react; c.rt = 0;
  leavers.push(c);
  G.nextSpawn = Math.max(G.nextSpawn, G.t + 0.35);
  G.hold = 0.45; // 떠나는 손님이 비켜설 때까지 뒷사람은 잠깐 기다렸다가 앞으로 와요
  return c;

      py = Math.max(8, (H - o.ph) / 2);
    }
  }
  o.px = px; o.py = py;
}
const TL = { pw: 0, dr: 0, tw: 0, ts: 0, how: null, keys: null, go: null, textH: 0, dubuH: 0, ph: 0, px: 0, py: 0 };
function titleMeasure(pw, side) {
  TL.pw = pw;
  TL.dr = side ? clamp(H * 0.15, 34, 62) : clamp(Math.min(W, H) * 0.1, 30, 58);
  TL.tw = side ? pw - TL.dr * 2.6 - 46 : pw - 36;
  TL.ts = fitSize(TITLE, TL.tw, side ? 32 : clamp(W * 0.085, 24, 36), true);
  TL.how = wrapLines(HOW1, TL.tw, 16, false); TL.keys = wrapLines(HOW2, TL.tw, 14, false); TL.go = wrapLines(START_TXT, TL.tw, 17, true);
  TL.textH = TL.ts * 1.3 + 10 + TL.how.length * 22 + 6 + TL.keys.length * 19 + 14 + TL.go.length * 23;
  TL.dubuH = TL.dr * 2.9;
  TL.ph = side ? Math.max(TL.textH, TL.dubuH) + 40 : TL.dubuH + 14 + TL.textH + 40;
}
function drawTitle() {
  ctx.fillStyle = "rgba(43,27,17,.38)"; ctx.fillRect(0, 0, W, H);
  const side = L.mode === "land";
  titleMeasure(side ? Math.min(W - 32, 660) : Math.min(W - 24, 460), side);
  placePanel(TL, side, titleMeasure);
  const pw = TL.pw, ph = TL.ph, dr = TL.dr, px = TL.px, py = TL.py, ts = TL.ts;
  panel(px, py, pw, Math.min(ph, H - 16));
  let cx, y;
  if (side) {
    drawDubuBig(px + 22 + dr * 1.3, py + ph / 2 - dr * 0.45, dr, 1);
    cx = px + 22 + dr * 2.6 + 12 + TL.tw / 2; y = py + (ph - TL.textH) / 2;
  } else {
    drawDubuBig(px + pw / 2, py + 20 + dr * 1.1, dr, 1);
    cx = px + pw / 2; y = py + 20 + TL.dubuH + 14;
  }
  text(TITLE, cx, y + ts * 0.65, ts, COL.brown, true); y += ts * 1.3 + 10;
  y += drawLines(TL.how, cx, y, 16, COL.brown, false, 22) + 6;
  y += drawLines(TL.keys, cx, y, 14, "rgba(90,59,40,.75)", false, 19) + 14;
  ctx.globalAlpha = 0.7 + 0.3 * Math.sin(animT * 5);
  drawLines(TL.go, cx, y, 17, "#D9631F", true, 23);
  ctx.globalAlpha = 1;
}
const OL = { pw: 0, dr: 0, tw: 0, amtS: 0, st1: null, go: null, textH: 0, dubuH: 0, ph: 0, px: 0, py: 0 };
function overMeasure(pw, side) {
  OL.pw = pw;
  OL.dr = side ? clamp(H * 0.14, 32, 58) : clamp(Math.min(W, H) * 0.085, 28, 50);
  OL.tw = side ? pw - OL.dr * 2.6 - 46 : pw - 36;
  OL.amtS = fitSize(G.sAmount, OL.tw, 34, true);
  OL.st1 = wrapLines(G.sStat1, OL.tw, 15, false); OL.go = wrapLines(AGAIN_TXT, OL.tw, 16, true);
  OL.textH = 34 + 20 + OL.amtS * 1.25 + 24 + (G.newBest ? 28 : 0) + OL.st1.length * 20 + 20 + 14 + OL.go.length * 22;
  OL.dubuH = OL.dr * 2.9;
  OL.ph = side ? Math.max(OL.textH, OL.dubuH) + 36 : OL.dubuH + 10 + OL.textH + 36;
}
function drawOver() {
  ctx.fillStyle = "rgba(43,27,17,.42)"; ctx.fillRect(0, 0, W, H);
  const side = L.mode === "land";
  overMeasure(side ? Math.min(W - 32, 640) : Math.min(W - 24, 440), side);
  placePanel(OL, side, overMeasure);
  const pw = OL.pw, ph = OL.ph, dr = OL.dr, px = OL.px, py = OL.py, amtS = OL.amtS;
  panel(px, py, pw, Math.min(ph, H - 16));
  let cx, y;
  if (side) { drawDubuBig(px + 22 + dr * 1.3, py + ph / 2 - dr * 0.45, dr, G.final > 0 ? 1 : 2); cx = px + 22 + dr * 2.6 + 12 + OL.tw / 2; y = py + (ph - OL.textH) / 2; }
  else { drawDubuBig(px + pw / 2, py + 18 + dr * 1.1, dr, G.final > 0 ? 1 : 2); cx = px + pw / 2; y = py + 18 + OL.dubuH + 10; }
  text("영업 끝!", cx, y + 15, 26, COL.brown, true); y += 34;
  text("오늘 매출", cx, y + 9, 15, "rgba(90,59,40,.8)", false); y += 20;
  text(G.sAmount, cx, y + amtS * 0.62, amtS, "#D9631F", true); y += amtS * 1.25;
  text(G.sBest, cx, y + 10, 15, COL.brown, true); y += 24;
  if (G.newBest) { pill("새 기록!", cx, y + 12, 15, "#FFFFFF", COL.orange, true); y += 28; }
  y += drawLines(OL.st1, cx, y, 15, COL.brown, false, 20);
  text(G.sStat2, cx, y + 10, 15, COL.brown, false); y += 20 + 14;
  if (canRestart()) { ctx.globalAlpha = 0.7 + 0.3 * Math.sin(animT * 5); drawLines(OL.go, cx, y, 16, "#D9631F", true, 22); ctx.globalAlpha = 1; }
}

/* ===== 그리기: 한 장면 ===== */
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!L) { ctx.fillStyle = COL.brown; ctx.fillRect(0, 0, W, H); return; }
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  const sk = G.shake > 0 ? 3 * (G.shake / 0.15) : 0;
  if (sk > 0) ctx.translate(Math.sin(animT * 95) * sk, Math.cos(animT * 83) * sk);
  drawCustomers();
  drawKitchen();
  drawButtons();
  drawHud();
  drawParticles();
  drawFly();
  drawPops();
  drawHint();
  drawBanner();
  drawBig();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state === "title") drawTitle();
  else if (state === "over") drawOver();
}

/* ===== 메인 루프 (프레임 사이 시간이 길어져도 한 번에 0.05초까지만 진행) ===== */
resize();
resetRound();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  // iframe 크기가 늦게 잡히면 resize 이벤트가 안 올 수 있어서 매 프레임 확인해요
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
