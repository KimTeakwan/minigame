# main 브랜치에 supabase/migrations 가 바뀌어 올라오면 Supabase 프로젝트에 자동 적용해요.
# 필요한 GitHub 저장소 Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  Supabase 계정 > Access Tokens 에서 만든 토큰
#   SUPABASE_PROJECT_ID    프로젝트 주소 https://<이 부분>.supabase.co
#   SUPABASE_DB_PASSWORD   프로젝트 만들 때 정한 DB 비밀번호
# Secrets를 넣기 전에 실행되면 실패해요. 넣은 뒤 Actions 탭에서 "Run workflow"로 다시 돌리면 돼요.
name: Supabase DB 배포

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # CLI 버전을 고정해요. "latest"는 실행 때마다 GitHub에 최신 버전을 물어봐서 요청 제한에 걸릴 수 있어요.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      # CLI v3부터 db push는 기본이 내 컴퓨터(로컬) DB라서 --remote로 연결한 프로젝트를 지정하고,
      # CI에서는 확인 질문에 답할 수 없어서 --yes를 붙여요.
      - run: supabase db push --remote --yes
